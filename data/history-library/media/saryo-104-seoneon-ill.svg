<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 1000" role="img">
<title>10 · 4 남북 정상 선언(2007) — 두 번째 남북 정상 회담</title>
<desc>위는 1972년 7·4 남북 공동 성명, 1991년 남북 기본 합의서, 2000년 6·15 남북 공동 선언, 2007년 10·4 선언, 2018년 판문점 선언을 잇는 연표, 아래는 노무현 대통령이 2007년 10월 2일부터 4일까지 육로로 평양을 찾아 발표한 10·4 선언의 여덟 항목을 정리한 표.</desc>
<defs>
<marker id="ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="5.5" markerHeight="5.5" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M1 1.5 L11 6 L1 10.5 L3.6 6 z" fill="#0096b8"/></marker>
<marker id="ahl" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="5.5" markerHeight="5.5" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M1 1.5 L11 6 L1 10.5 L3.6 6 z" fill="#7a62d6"/></marker>
<radialGradient id="glow"><stop offset="0" stop-color="#00d0ff" stop-opacity="0.55"/><stop offset="0.45" stop-color="#00d0ff" stop-opacity="0.2"/><stop offset="1" stop-color="#00d0ff" stop-opacity="0"/></radialGradient>
<filter id="plate" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#2a2c2d" flood-opacity="0.16"/></filter>
<filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
<rect width="1600" height="1000" fill="#effbff"/>
<text x="60.0" y="92.0" font-size="48" fill="#2a2c2d" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">10 · 4 남북 정상 선언(2007) — 두 번째 남북 정상 회담</text>
<text x="60.0" y="140.0" font-size="28" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">「남북관계 발전과 평화번영을 위한 선언」 · 6 · 15 공동 선언을 바탕으로</text>
<text x="1540.0" y="92.0" font-size="28" fill="#0096b8" text-anchor="end" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">정리 그림</text>
<line x1="60" y1="166" x2="1540" y2="166" stroke="#00d0ff" stroke-width="1"/>
<rect x="60" y="190" width="1480" height="230" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<line x1="110" y1="290" x2="1490" y2="290" stroke="#00d0ff" stroke-width="1.2"/>
<circle cx="190" cy="290" r="9" fill="#00d0ff" stroke="#0096b8" stroke-width="1"/>
<text x="190.0" y="268.0" font-size="30" fill="#0096b8" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">1972</text>
<text x="190.0" y="336.0" font-size="27" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">7 · 4 남북 공동 성명</text>
<circle cx="480" cy="290" r="9" fill="#00d0ff" stroke="#0096b8" stroke-width="1"/>
<text x="480.0" y="268.0" font-size="30" fill="#0096b8" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">1991</text>
<text x="480.0" y="336.0" font-size="27" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">남북 기본 합의서</text>
<circle cx="800" cy="290" r="9" fill="#00d0ff" stroke="#0096b8" stroke-width="1"/>
<text x="800.0" y="268.0" font-size="30" fill="#0096b8" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">2000.6.15</text>
<text x="800.0" y="336.0" font-size="27" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">6 · 15 남북 공동 선언</text>
<circle cx="1110" cy="290" r="9" fill="#00d0ff" stroke="#0096b8" stroke-width="1"/>
<text x="1110.0" y="268.0" font-size="30" fill="#0096b8" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">2007.10.4</text>
<text x="1110.0" y="336.0" font-size="27" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">10 · 4 선언</text>
<circle cx="1400" cy="290" r="9" fill="#00d0ff" stroke="#0096b8" stroke-width="1"/>
<text x="1400.0" y="268.0" font-size="30" fill="#0096b8" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">2018.4.27</text>
<text x="1400.0" y="336.0" font-size="27" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">판문점 선언</text>
<text x="800.0" y="380.0" font-size="26" fill="#5d6365" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">김대중 · 첫 정상 회담</text>
<text x="1110.0" y="380.0" font-size="26" fill="#5d6365" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">노무현 · 두 번째</text>
<text x="1400.0" y="380.0" font-size="26" fill="#5d6365" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">문재인 · 세 번째</text>
<rect x="960" y="226" width="300" height="180" fill="none" stroke="#0096b8" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="800.0" y="470.0" font-size="29" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">2007년 10월 2일 노무현 대통령이 육로로 평양에 감 → 10월 4일 선언 발표</text>
<rect x="60" y="506" width="728" height="92" fill="#ccf6ff" stroke="#00d0ff" stroke-width="1"/>
<text x="86.0" y="564.0" font-size="32" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">①</text>
<text x="140.0" y="563.0" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">6 · 15 공동 선언을 굳게 지키고 실천</text>
<rect x="812" y="506" width="728" height="92" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<text x="838.0" y="564.0" font-size="32" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">②</text>
<text x="892.0" y="563.0" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">사상 · 제도를 넘어 서로 존중 · 신뢰</text>
<rect x="60" y="612" width="728" height="92" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<text x="86.0" y="670.0" font-size="32" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">③</text>
<text x="140.0" y="669.0" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">군사적 적대 관계 끝내고 긴장 완화</text>
<rect x="812" y="612" width="728" height="92" fill="#ccf6ff" stroke="#00d0ff" stroke-width="1"/>
<text x="838.0" y="670.0" font-size="32" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">④</text>
<text x="892.0" y="669.0" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">정전 체제를 끝내고 종전 선언 추진</text>
<rect x="60" y="718" width="728" height="92" fill="#ccf6ff" stroke="#00d0ff" stroke-width="1"/>
<text x="86.0" y="776.0" font-size="32" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">⑤</text>
<text x="140.0" y="775.0" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">경제 협력 확대 · 서해 평화 협력 특별 지대</text>
<rect x="812" y="718" width="728" height="92" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<text x="838.0" y="776.0" font-size="32" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">⑥</text>
<text x="892.0" y="775.0" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">역사 · 언어 · 교육 · 체육 등 교류</text>
<rect x="60" y="824" width="728" height="92" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<text x="86.0" y="882.0" font-size="32" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">⑦</text>
<text x="140.0" y="881.0" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">인도주의 협력 사업</text>
<rect x="812" y="824" width="728" height="92" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<text x="838.0" y="882.0" font-size="32" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">⑧</text>
<text x="892.0" y="881.0" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">국제 무대에서 민족의 이익을 위해 협력</text>
</svg>
