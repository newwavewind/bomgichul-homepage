<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 1000" role="img">
<title>박위의 쓰시마 정벌 (1389)</title>
<desc>왼쪽은 경상도에서 쓰시마로 전함 100척이 건너간 위치 관계를 단순하게 나타낸 모식도, 오른쪽은 왜선 300척을 불태우고 포로 100여 명을 데려온 결과와 1419년 이종무의 쓰시마 정벌로 이어지는 흐름을 정리한 그림.</desc>
<defs>
<marker id="ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="5.5" markerHeight="5.5" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M1 1.5 L11 6 L1 10.5 L3.6 6 z" fill="#0096b8"/></marker>
<marker id="ahl" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="5.5" markerHeight="5.5" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M1 1.5 L11 6 L1 10.5 L3.6 6 z" fill="#7a62d6"/></marker>
</defs>
<rect width="1600" height="1000" fill="#effbff"/>
<text x="60" y="92" font-size="48" fill="#2a2c2d" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">박위의 쓰시마 정벌 (1389)</text>
<text x="60" y="140" font-size="28" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">고려가 왜구의 근거지를 직접 공격한 원정</text>
<text x="1540" y="92" font-size="28" fill="#0096b8" text-anchor="end" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">정리 그림</text>
<line x1="60" y1="166" x2="1540" y2="166" stroke="#00d0ff" stroke-width="1"/>
<rect x="60" y="190" width="800" height="740" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/><rect x="60.5" y="190.5" width="799" height="58" fill="#ccf6ff"/><text x="84" y="230" font-size="31" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">1389년 쓰시마 원정 (모식도)</text><rect x="61" y="249" width="798" height="680" fill="#dff4fa"/><path d="M61 249 L560 249 C540 300 600 330 560 380 C520 420 470 410 430 460 C400 500 330 500 280 540 C220 590 150 580 61 610 Z" fill="#f4ead9" stroke="#2a2c2d" stroke-width="2"/><text x="230" y="350" font-size="34" fill="#2a2c2d" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">고려</text><text x="230" y="395" font-size="26" fill="#5d6365" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">(경상도)</text><path d="M640 650 C670 610 720 620 715 680 C710 740 730 790 700 840 C680 880 640 870 645 820 C650 770 620 720 640 650 Z" fill="#f4ead9" stroke="#2a2c2d" stroke-width="2"/><text x="760" y="760" font-size="30" fill="#2a2c2d" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">쓰시마</text><text x="760" y="800" font-size="24" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">(대마도)</text><path d="M420 470 C470 560 560 620 625 690" fill="none" stroke="#0096b8" stroke-width="4" stroke-dasharray="12 8" marker-end="url(#ah)"/><text x="330" y="640" font-size="30" fill="#0096b8" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">전함 100척</text><text x="460" y="900" font-size="24" fill="#5d6365" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">※ 위치 관계만 나타낸 그림 (실제 축척 아님)</text><rect x="900" y="190" width="640" height="460" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/><rect x="900.5" y="190.5" width="639" height="58" fill="#ccf6ff"/><text x="924" y="230" font-size="31" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">원정의 결과 (『고려사』 박위 열전)</text><text x="924" y="300" font-size="28" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">이끈 사람: 경상도 도순문사 박위</text><text x="924" y="345" font-size="28" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">때: 1389년(창왕 원년) 2월</text><rect x="924" y="390" width="592" height="100" fill="#ccf6ff" stroke="#00d0ff" stroke-width="0.8"/><text x="1220.0" y="450.0" font-size="29" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">왜선 300척 · 바닷가 집을 불태움</text><rect x="924" y="515" width="592" height="100" fill="#ccf6ff" stroke="#00d0ff" stroke-width="0.8"/><text x="1220.0" y="575.0" font-size="29" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">붙잡혀 간 남녀 100여 명을 데려옴</text><rect x="900" y="680" width="640" height="250" fill="#ffffff" stroke="#0096b8" stroke-width="1.5"/><rect x="900.5" y="680.5" width="639" height="58" fill="#ccf6ff"/><text x="924" y="720" font-size="31" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">왜구 근거지를 직접 치다</text><rect x="924" y="770" width="270" height="120" fill="#ccf6ff" stroke="#00d0ff" stroke-width="0.8"/><text x="1059.0" y="826.0" font-size="29" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">1389 박위</text><text x="1059.0" y="864.0" font-size="24" fill="#5d6365" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">고려 창왕</text><line x1="1200" y1="830" x2="1240" y2="830" stroke="#0096b8" stroke-width="3" marker-end="url(#ah)"/><rect x="1246" y="770" width="270" height="120" fill="#ccf6ff" s