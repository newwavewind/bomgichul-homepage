<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 1000" role="img">
<title>태안 앞바다의 고려 침몰선</title>
<desc>강진(탐진)과 전라도 등지에서 서해 뱃길로 태안 앞바다를 지나 개경으로 가는 조운 경로와, 태안선·마도 1호선의 발견 연도·실은 짐·목간을 정리한 카드로 된 정리 그림.</desc>
<rect width="1600" height="1000" fill="#effbff"/>
<text x="60" y="92" font-size="48" fill="#2a2c2d" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">태안 앞바다의 고려 침몰선</text>
<text x="60" y="140" font-size="28" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">짐에 달린 나무 꼬리표가 배의 출발지와 목적지를 알려 주었다</text>
<text x="1540" y="92" font-size="28" fill="#0096b8" text-anchor="end" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">정리 그림</text>
<line x1="60" y1="166" x2="1540" y2="166" stroke="#00d0ff" stroke-width="1"/>
<rect x="60" y="190" width="1480" height="270" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<line x1="345" y1="290" x2="543" y2="290" stroke="#00d0ff" stroke-width="2"/><path d="M541,280 L555,290 L541,300 Z" fill="#00d0ff"/>
<line x1="695" y1="290" x2="893" y2="290" stroke="#00d0ff" stroke-width="2"/><path d="M891,280 L905,290 L891,300 Z" fill="#00d0ff"/>
<line x1="1045" y1="290" x2="1243" y2="290" stroke="#00d0ff" stroke-width="2"/><path d="M1241,280 L1255,290 L1241,300 Z" fill="#00d0ff"/>
<rect x="213" y="268" width="124" height="44" rx="22" fill="#ffffff" stroke="#5d6365" stroke-width="2"/>
<text x="275" y="300" font-size="24" fill="#5d6365" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">출발</text>
<text x="275" y="350" font-size="25" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">탐진(강진)·</text>
<text x="275" y="386" font-size="25" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">전라도 등 산지</text>
<rect x="563" y="268" width="124" height="44" rx="22" fill="#ffffff" stroke="#5d6365" stroke-width="2"/>
<text x="625" y="300" font-size="24" fill="#5d6365" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">서해</text>
<text x="625" y="350" font-size="25" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">바닷길로</text>
<text x="625" y="386" font-size="25" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">북쪽으로 운반</text>
<rect x="913" y="268" width="124" height="44" rx="22" fill="#ccf6ff" stroke="#0096b8" stroke-width="2"/>
<text x="975" y="300" font-size="24" fill="#0096b8" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">태안</text>
<text x="975" y="350" font-size="25" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">물살 험한 곳에서</text>
<text x="975" y="386" font-size="25" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">배가 가라앉음</text>
<rect x="1263" y="268" width="124" height="44" rx="22" fill="#ffffff" stroke="#5d6365" stroke-width="2"/>
<text x="1325" y="300" font-size="24" fill="#5d6365" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">도착</text>
<text x="1325" y="350" font-size="25" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">예성강을 거쳐</text>
<text x="1325" y="386" font-size="25" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">개경의 받는 사람</text>
<rect x="60" y="490" width="473" height="450" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="60.5" y="490.5" width="472" height="62" fill="#ccf6ff"/>
<text x="86" y="533" font-size="31" fill="#5d6365" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">태안선</text>
<text x="90" y="620" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">2007년 대섬 앞바다</text>
<text x="90" y="674" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">청자 2만 3천여 점</text>
<text x="90" y="746" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">목간에 탐진(강진)과</text>
<text x="90" y="800" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">개경의 받는 사람</text>
<text x="90" y="854" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">→ 청자를 나르던 배</text>
<rect x="564" y="490" width="473" height="450" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="564.5" y="490.5" width="472" height="62" fill="#ccf6ff"/>
<text x="590" y="533" font-size="31" fill="#7a62d6" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">마도 1호선</text>
<text x="594" y="620" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">2009년부터 조사</text>
<text x="594" y="674" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">벼·쌀·콩 등 곡물과</text>
<text x="594" y="728" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">젓갈을 실음</text>
<text x="594" y="800" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">목간·죽찰의 간지로</text>
<text x="594" y="854" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">1208년 무렵 침몰</text>
<rect x="1067" y="490" width="473" height="450" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="1067.5" y="490.5" width="472" height="62" fill="#ccf6ff"/>
<text x="1093" y="533" font-size="31" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">무엇을 알려 주나</text>
<text x="1097" y="620" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">고려의 조운</text>
<text x="1097" y="692" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">지방에서 거둔</text>
<text x="1097" y="746" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">곡물과 물품을</text>
<text x="1097" y="800" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">배로 개경까지</text>
<text x="1097" y="854" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">나른 실제 모습</text>
</svg>