<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">
<title>간도 참변(경신참변, 1920)</title>
<rect width="960" height="620" fill="#ffffff"/>
<text x="480.0" y="52" text-anchor="middle" font-size="30" font-weight="700" fill="#1b2a4a">간도 참변(경신참변, 1920)</text>
<text x="480.0" y="84" text-anchor="middle" font-size="17" font-weight="400" fill="#5b6475">청산리에서 진 일본군이 만주의 한인 마을에 보복하다</text>
<rect x="30" y="120" width="210" height="150" rx="10" fill="#ffffff" stroke="#9fdcf5" stroke-width="2"/>
<text x="135.0" y="163.8" text-anchor="middle" font-size="19" font-weight="700" fill="#0096d6">배경</text>
<text x="135.0" y="189.3" text-anchor="middle" font-size="17" font-weight="400" fill="#1b2a4a">3·1 운동 뒤 만주의</text>
<text x="135.0" y="214.0" text-anchor="middle" font-size="17" font-weight="400" fill="#1b2a4a">독립군이 국경을 넘어</text>
<text x="135.0" y="238.6" text-anchor="middle" font-size="17" font-weight="400" fill="#1b2a4a">일본 군경과 자주 싸움</text>
<line x1="244" y1="195.0" x2="261" y2="195.0" stroke="#0096d6" stroke-width="2.5" stroke-linecap="round"/>
<path d="M251.1 199.8 L261 195.0 L251.1 190.2" fill="none" stroke="#0096d6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="265" y="120" width="210" height="150" rx="10" fill="#ffffff" stroke="#9fdcf5" stroke-width="2"/>
<text x="370.0" y="163.8" text-anchor="middle" font-size="19" font-weight="700" fill="#0096d6">1920. 10. 훈춘 사건</text>
<text x="370.0" y="189.3" text-anchor="middle" font-size="17" font-weight="400" fill="#1b2a4a">일본이 사건을 일으켜</text>
<text x="370.0" y="214.0" text-anchor="middle" font-size="17" font-weight="400" fill="#1b2a4a">만주에 군대를 보낼</text>
<text x="370.0" y="238.6" text-anchor="middle" font-size="17" font-weight="400" fill="#1b2a4a">구실을 만듦</text>
<line x1="479" y1="195.0" x2="496" y2="195.0" stroke="#0096d6" stroke-width="2.5" stroke-linecap="round"/>
<path d="M486.1 199.8 L496 195.0 L486.1 190.2" fill="none" stroke="#0096d6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="500" y="120" width="210" height="150" rx="10" fill="#ffffff" stroke="#9fdcf5" stroke-width="2"/>
<text x="605.0" y="163.8" text-anchor="middle" font-size="19" font-weight="700" fill="#0096d6">청산리 전투</text>
<text x="605.0" y="189.3" text-anchor="middle" font-size="17" font-weight="400" fill="#1b2a4a">독립군은 깊은 산속으로</text>
<text x="605.0" y="214.0" text-anchor="middle" font-size="17" font-weight="400" fill="#1b2a4a">옮겨 가 맞섬</text>
<text x="605.0" y="238.6" text-anchor="middle" font-size="17" font-weight="400" fill="#1b2a4a">일본군이 크게 짐</text>
<line x1="714" y1="195.0" x2="731" y2="195.0" stroke="#0096d6" stroke-width="2.5" stroke-linecap="round"/>
<path d="M721.1 199.8 L731 195.0 L721.1 190.2" fill="none" stroke="#0096d6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="735" y="120" width="210" height="150" rx="10" fill="#eaf7fd" stroke="#0096d6" stroke-width="2"/>
<text x="840.0" y="163.8" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2a4a">보복</text>
<text x="840.0" y="189.3" text-anchor="middle" font-size="17" font-weight="400" fill="#1b2a4a">일본군이 간도의</text>
<text x="840.0" y="214.0" text-anchor="middle" font-size="17" font-weight="400" fill="#1b2a4a">한인 마을을</text>
<text x="840.0" y="238.6" text-anchor="middle" font-size="17" font-weight="400" fill="#1b2a4a">닥치는 대로 공격</text>
<line x1="840" y1="276" x2="840" y2="314" stroke="#0096d6" stroke-width="2.5" stroke-linecap="round"/>
<path d="M835.2 304.1 L840 314 L844.8 304.1" fill="none" stroke="#0096d6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="30" y="315" width="915" height="150" rx="10" fill="#eaf7fd" stroke="#0096d6" stroke-width="2"/>
<text x="487.5" y="370.3" text-anchor="middle" font-size="21" font-weight="700" fill="#1b2a4a">간도 참변 — 한인 마을이 폐허가 됨</text>
<text x="487.5" y="397.7" text-anchor="middle" font-size="18" font-weight="400" fill="#1b2a4a">마을 사람들을 모아 죽이고 · 집을 불태우고 · 가축을 빼앗음</text>
<text x="487.5" y="423.8" text-anchor="middle" font-size="18" font-weight="700" fill="#0096d6">1920년 10월 9일 ~ 11월 5일, 27일 동안에만 간도에서 3,469명이 목숨을 잃음</text>
<rect x="30" y="495" width="445" height="95" rx="10" fill="#ffffff" stroke="#9fdcf5" stroke-width="2" stroke-dasharray="6 5"/>
<text x="252.5" y="535.7" text-anchor="middle" font-size="18" font-weight="700" fill="#1b2a4a">누가 알렸나</text>
<text x="252.5" y="560.7" text-anchor="middle" font-size="17" font-weight="400" fill="#1b2a4a">만주에서 일하던 외국인 선교사들이 폭로</text>
<rect x="500" y="495" width="445" height="95" rx="10" fill="#ffffff" stroke="#9fdcf5" stroke-width="2" stroke-dasharray="6 5"/>
<text x="722.5" y="535.7" text-anchor="middle" font-size="18" font-weight="700" fill="#1b2a4a">시험 단서</text>
<text x="722.5" y="560.7" text-anchor="middle" font-size="17" font-weight="400" fill="#1b2a4a">만주(간도) 동포가 겪은 시련 · 청산리 보복</text>
</svg>
