<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">
<title>보안회와 황무지 개간권 반대 운동(1904)</title>
<rect width="960" height="620" fill="#ffffff"/>
<text x="480.0" y="52" text-anchor="middle" font-size="30" font-weight="700" fill="#1b2a4a">보안회와 황무지 개간권 반대 운동(1904)</text>
<text x="480.0" y="84" text-anchor="middle" font-size="17" font-weight="400" fill="#5b6475">일본의 땅 요구를 백성의 힘으로 막아 내다</text>
<rect x="30" y="120" width="210" height="150" rx="10" fill="#ffffff" stroke="#9fdcf5" stroke-width="2"/>
<text x="135.0" y="163.8" text-anchor="middle" font-size="19" font-weight="700" fill="#0096d6">1904 러일 전쟁</text>
<text x="135.0" y="189.3" text-anchor="middle" font-size="17" font-weight="400" fill="#1b2a4a">일본이 대한 제국에</text>
<text x="135.0" y="214.0" text-anchor="middle" font-size="17" font-weight="400" fill="#1b2a4a">한일 의정서를</text>
<text x="135.0" y="238.6" text-anchor="middle" font-size="17" font-weight="400" fill="#1b2a4a">강요함</text>
<line x1="244" y1="195" x2="261" y2="195" stroke="#0096d6" stroke-width="2.5" stroke-linecap="round"/>
<path d="M251.1 199.8 L261 195 L251.1 190.2" fill="none" stroke="#0096d6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="265" y="120" width="210" height="150" rx="10" fill="#ffffff" stroke="#9fdcf5" stroke-width="2"/>
<text x="370.0" y="163.8" text-anchor="middle" font-size="19" font-weight="700" fill="#0096d6">황무지 개간권 요구</text>
<text x="370.0" y="189.3" text-anchor="middle" font-size="17" font-weight="400" fill="#1b2a4a">나가모리를 내세워</text>
<text x="370.0" y="214.0" text-anchor="middle" font-size="17" font-weight="400" fill="#1b2a4a">아직 일구지 않은 땅을</text>
<text x="370.0" y="238.6" text-anchor="middle" font-size="17" font-weight="400" fill="#1b2a4a">개간할 권리를 요구</text>
<line x1="479" y1="195" x2="496" y2="195" stroke="#0096d6" stroke-width="2.5" stroke-linecap="round"/>
<path d="M486.1 199.8 L496 195 L486.1 190.2" fill="none" stroke="#0096d6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="500" y="120" width="210" height="150" rx="10" fill="#eaf7fd" stroke="#0096d6" stroke-width="2"/>
<text x="605.0" y="163.8" text-anchor="middle" font-size="19" font-weight="700" fill="#0096d6">1904. 7. 13</text>
<text x="605.0" y="189.3" text-anchor="middle" font-size="17" font-weight="400" fill="#1b2a4a">종로 백목전 집회</text>
<text x="605.0" y="214.0" text-anchor="middle" font-size="17" font-weight="400" fill="#1b2a4a">보안회 결성</text>
<text x="605.0" y="238.6" text-anchor="middle" font-size="17" font-weight="400" fill="#1b2a4a">(송수만 · 심상진 등)</text>
<line x1="714" y1="195" x2="731" y2="195" stroke="#0096d6" stroke-width="2.5" stroke-linecap="round"/>
<path d="M721.1 199.8 L731 195 L721.1 190.2" fill="none" stroke="#0096d6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="735" y="120" width="210" height="150" rx="10" fill="#ffffff" stroke="#9fdcf5" stroke-width="2"/>
<text x="840.0" y="163.8" text-anchor="middle" font-size="19" font-weight="700" fill="#0096d6">반대 운동 확산</text>
<text x="840.0" y="189.3" text-anchor="middle" font-size="17" font-weight="400" fill="#1b2a4a">전국에 통문을 돌림</text>
<text x="840.0" y="214.0" text-anchor="middle" font-size="17" font-weight="400" fill="#1b2a4a">일본 헌병 · 경찰이</text>
<text x="840.0" y="238.6" text-anchor="middle" font-size="17" font-weight="400" fill="#1b2a4a">막고 사람들을 잡아감</text>
<line x1="840" y1="276" x2="840" y2="314" stroke="#0096d6" stroke-width="2.5" stroke-linecap="round"/>
<path d="M835.2 304.1 L840 314 L844.8 304.1" fill="none" stroke="#0096d6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="30" y="320" width="915" height="130" rx="10" fill="#eaf7fd" stroke="#0096d6" stroke-width="2"/>
<text x="487.5" y="366.0" text-anchor="middle" font-size="21" font-weight="700" fill="#1b2a4a">결과 — 정부가 요구를 거절, 일본이 요구를 거둬들임</text>
<text x="487.5" y="393.4" text-anchor="middle" font-size="18" font-weight="400" fill="#1b2a4a">「땅은 한 뼘도 내줄 수 없다」는 반대가 그치지 않음</text>
<text x="487.5" y="418.5" text-anchor="middle" font-size="17" font-weight="700" fill="#0096d6">일본은 1908년 동양 척식 주식회사를 세울 때까지 개간권을 다시 꺼내지 못함</text>
<rect x="30" y="480" width="915" height="110" rx="10" fill="#ffffff" stroke="#9fdcf5" stroke-width="2" stroke-dasharray="6 5"/>
<text x="487.5" y="527.4" text-anchor="middle" font-size="18" font-weight="700" fill="#1b2a4a">보안회 = 보국안민(나라를 지키고 백성을 편안하게)</text>
<text x="487.5" y="553.5" text-anchor="middle" font-size="18" font-weight="400" fill="#1b2a4a">시험 단서: 「황무지 개간권 요구를 저지한 단체」</text>
</svg>
