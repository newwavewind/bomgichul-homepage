<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 1000" role="img">
<title>경재소와 유향소</title>
<desc>서울의 경재소가 지방의 유향소를 통제하고, 유향소가 향리를 감시하던 관계와 두 기구의 설치·혁파 흐름을 정리한 그림.</desc>
<defs><marker id="ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="5.5" markerHeight="5.5" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M1 1.5 L11 6 L1 10.5 L3.6 6 z" fill="#0096b8"/></marker></defs>
<rect width="1600" height="1000" fill="#effbff"/>
<text x="60" y="92" font-size="48" fill="#2a2c2d" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">경재소와 유향소</text>
<text x="60" y="140" font-size="28" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">서울에서 지방을, 지방 양반이 향리를 살피던 짜임</text>
<text x="1540" y="92" font-size="28" fill="#0096b8" text-anchor="end" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">정리 그림</text>
<line x1="60" y1="166" x2="1540" y2="166" stroke="#00d0ff" stroke-width="1"/>
<text x="60" y="222" font-size="29" fill="#7a62d6" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">짜임</text><rect x="60" y="250" width="300" height="80" fill="#ffffff" stroke="#0096b8" stroke-width="1.5"/><text x="210.0" y="300.0" font-size="29" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">왕 · 중앙 정부</text><line x1="210" y1="334" x2="210" y2="386" stroke="#0096b8" stroke-width="2" marker-end="url(#ah)"/><rect x="60" y="390" width="300" height="80" fill="#ccf6ff" stroke="#0096b8" stroke-width="1.5"/><text x="210.0" y="440.0" font-size="29" fill="#0096b8" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">경재소 (서울)</text><line x1="210" y1="474" x2="210" y2="526" stroke="#0096b8" stroke-width="2" marker-end="url(#ah)"/><rect x="60" y="530" width="300" height="80" fill="#ccf6ff" stroke="#0096b8" stroke-width="1.5"/><text x="210.0" y="580.0" font-size="29" fill="#0096b8" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">유향소 (지방)</text><line x1="210" y1="614" x2="210" y2="666" stroke="#0096b8" stroke-width="2" marker-end="url(#ah)"/><rect x="60" y="670" width="300" height="80" fill="#ffffff" stroke="#0096b8" stroke-width="1.5"/><text x="210.0" y="720.0" font-size="29" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">향리</text><text x="390" y="438" font-size="26" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">그 고을 출신 서울 관리가</text><text x="390" y="472" font-size="26" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">유향소를 통제</text><text x="390" y="578" font-size="26" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">지방 품관(좌수·별감)이</text><text x="390" y="612" font-size="26" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">향리를 감시·풍속 교화</text><rect x="60" y="800" width="300" height="80" fill="#ffffff" stroke="#0096b8" stroke-width="1.5"/><text x="210.0" y="850.0" font-size="29" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">수령 (지방관)</text><text x="390" y="848" font-size="26" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">유향소는 수령을 돕는 자문 기구</text><rect x="860" y="205" width="680" height="296" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/><rect x="860.5" y="205.5" width="679" height="58" fill="#ccf6ff"/><text x="884" y="245" font-size="29" fill="#7a62d6" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">닮은 점 · 단서</text><text x="890" y="311" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">· 경재소 ≈ 고려의 사심관</text><text x="890" y="363" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">· 유향소 = 뒤의 향청(향소)</text><text x="890" y="415" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">· 우두머리: 좌수 · 별감</text><text x="890" y="467" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">· 『성종실록』: 향리의 폐단 → 복립 논의</text><text x="860" y="566" font-size="29" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">흐름</text><rect x="860" y="592" width="680" height="76" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/><text x="890" y="641" font-size="28" fill="#7a62d6" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">1406 (태종 6)</text><text x="1150" y="641" font-size="28" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">유향소 혁파</text><rect x="860" y="688" width="680" height="76" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/><text x="890" y="737" font-size="28" fill="#7a62d6" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">세조 말</text><text x="1150" y="737" font-size="28" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">유향소 다시 혁파</text><rect x="860" y="784" width="680" height="76" fill="#ccf6ff" stroke="#0096b8" stroke-width="1.5"/><text x="890" y="833" font-size="28" fill="#7a62d6" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">1482 (성종 13)</text><text x="1150" y="833" font-size="28" fill="#0096b8" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">유향소 다시 설치 허락</text><rect x="860" y="880" width="680" height="76" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/><text x="890" y="929" font-size="28" fill="#7a62d6" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">1603 (선조 36)</text><text x="1150" y="929" font-size="28" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">경재소 영구 폐지</text></svg>
