<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 1000" role="img">
<title>여수 안도 조개더미</title>
<desc>남해안의 대표 신석기 조개더미인 부산 동삼동, 통영 연대도, 여수 송도, 여수 안도의 대략적 위치를 해안선 위에 찍고, 조개더미의 뜻, 안도에서 나온 것, 남해안 조개더미로 알 수 있는 점을 카드로 정리한 정리 그림.</desc>
<rect width="1600" height="1000" fill="#effbff"/>
<text x="60" y="92" font-size="48" fill="#2a2c2d" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">여수 안도 조개더미</text>
<text x="60" y="140" font-size="28" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">신석기 시대 남해안 섬의 조개더미에서 나온 것</text>
<text x="1540" y="92" font-size="28" fill="#0096b8" text-anchor="end" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">정리 그림</text>
<line x1="60" y1="166" x2="1540" y2="166" stroke="#00d0ff" stroke-width="1"/>
<rect x="60" y="190" width="1480" height="300" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<text x="90" y="236" font-size="26" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">남해안의 대표 조개더미(위치는 대략)</text>
<path d="M 110 300 C 300 330, 420 290, 600 330 S 900 310, 1050 340 S 1300 300, 1490 280" fill="none" stroke="#5d6365" stroke-width="2"/>
<text x="1480" y="262" font-size="24" fill="#5d6365" text-anchor="end" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">육지</text>
<text x="1480" y="470" font-size="24" fill="#0096b8" text-anchor="end" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">남해</text>
<circle cx="1380" cy="292" r="8" fill="#ffffff" stroke="#5d6365" stroke-width="2"/>
<text x="1380" y="338" font-size="25" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">부산 동삼동</text>
<circle cx="1000" cy="385" r="8" fill="#ffffff" stroke="#5d6365" stroke-width="2"/>
<text x="1000" y="431" font-size="25" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">통영 연대도</text>
<circle cx="660" cy="370" r="8" fill="#ffffff" stroke="#5d6365" stroke-width="2"/>
<text x="660" y="416" font-size="25" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">여수 송도</text>
<circle cx="440" cy="455" r="12" fill="#ccf6ff" stroke="#0096b8" stroke-width="2"/>
<text x="462" y="465" font-size="28" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">여수 안도</text>
<rect x="60" y="520" width="473" height="420" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="60.5" y="520.5" width="472" height="62" fill="#ccf6ff"/>
<text x="86" y="563" font-size="31" fill="#5d6365" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">조개더미란</text>
<text x="90" y="640" font-size="28" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">조개를 먹고 버린 껍데기가</text>
<text x="90" y="690" font-size="28" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">쌓여 생긴 유적</text>
<text x="90" y="758" font-size="28" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">우리나라에서는</text>
<text x="90" y="808" font-size="28" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">신석기 시대부터 나타남</text>
<rect x="563" y="520" width="473" height="420" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="563.5" y="520.5" width="472" height="62" fill="#ccf6ff"/>
<text x="589" y="563" font-size="31" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">안도에서 나온 것</text>
<text x="593" y="640" font-size="28" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">조개팔찌를 찬 채 묻힌</text>
<text x="593" y="690" font-size="28" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">사람 뼈와 무덤</text>
<text x="593" y="758" font-size="28" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">덧무늬 토기</text>
<text x="593" y="808" font-size="28" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">눌러찍은 무늬 토기</text>
<rect x="1067" y="520" width="473" height="420" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="1067.5" y="520.5" width="472" height="62" fill="#ccf6ff"/>
<text x="1093" y="563" font-size="31" fill="#7a62d6" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">알 수 있는 것</text>
<text x="1097" y="640" font-size="28" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">무덤이 함께 나와</text>
<text x="1097" y="690" font-size="28" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">한곳에 오래 머물러 삶</text>
<text x="1097" y="758" font-size="28" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">규슈산 흑요석·조몬 토기</text>
<text x="1097" y="808" font-size="28" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">바다 건너 일본과 교류</text>
<text x="1097" y="858" font-size="28" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">(남해안 조개더미 공통)</text>
</svg>