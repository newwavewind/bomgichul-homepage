<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 1000" role="img">
<title>위만 조선 — 성립에서 왕검성 함락까지</title>
<desc>왼쪽은 위만이 패수를 건너 망명해 준왕의 신임을 얻고 왕이 되기까지의 흐름, 오른쪽은 우거왕 때 한과 갈등하다 서기전 109년 한의 공격을 받고 1년여 맞서다 서기전 108년 멸망하기까지의 연표. 왕검성과 패수의 위치는 학설이 갈려 지도 대신 흐름으로 정리했다.</desc>
<defs>
<marker id="ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="5.5" markerHeight="5.5" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M1 1.5 L11 6 L1 10.5 L3.6 6 z" fill="#0096b8"/></marker>
<marker id="ahl" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="5.5" markerHeight="5.5" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M1 1.5 L11 6 L1 10.5 L3.6 6 z" fill="#7a62d6"/></marker>
<radialGradient id="glow"><stop offset="0" stop-color="#00d0ff" stop-opacity="0.55"/><stop offset="0.45" stop-color="#00d0ff" stop-opacity="0.2"/><stop offset="1" stop-color="#00d0ff" stop-opacity="0"/></radialGradient>
<filter id="plate" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#2a2c2d" flood-opacity="0.16"/></filter>
<filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
<rect width="1600" height="1000" fill="#effbff"/>
<text x="60.0" y="92.0" font-size="48" fill="#2a2c2d" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">위만 조선 — 성립에서 왕검성 함락까지</text>
<text x="60.0" y="140.0" font-size="28" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">서기전 2세기 초 위만의 집권 → 서기전 108년 멸망과 한 군현 설치</text>
<text x="1540.0" y="92.0" font-size="28" fill="#0096b8" text-anchor="end" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">정리 그림</text>
<line x1="60" y1="166" x2="1540" y2="166" stroke="#00d0ff" stroke-width="1"/>
<text x="60.0" y="214.0" font-size="32" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">성립</text>
<rect x="60" y="236" width="700" height="201" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="60.5" y="236.5" width="699" height="58" fill="#ccf6ff"/>
<text x="84.0" y="276.5" font-size="32" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">망명 · 서기전 2세기 초</text>
<text x="84.0" y="339.0" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">연왕 노관이 흉노로 들어가자 망명</text>
<text x="84.0" y="380.2" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">무리 천여 명 · 상투를 틀고 오랑캐 옷</text>
<text x="84.0" y="421.4" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">동쪽으로 패수를 건넘</text>
<line x1="100" y1="439" x2="100" y2="463" stroke="#0096b8" stroke-width="2" marker-end="url(#ah)"/>
<rect x="60" y="467" width="700" height="201" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="60.5" y="467.5" width="699" height="58" fill="#ccf6ff"/>
<text x="84.0" y="507.5" font-size="32" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">준왕의 신임 (『위략』)</text>
<text x="84.0" y="570.0" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">서쪽 변경을 지키는 울타리가 됨</text>
<text x="84.0" y="611.2" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">박사 벼슬과 100리 땅을 받음</text>
<text x="84.0" y="652.4" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">세력을 키워 준왕을 몰아냄</text>
<line x1="100" y1="670" x2="100" y2="694" stroke="#0096b8" stroke-width="2" marker-end="url(#ah)"/>
<rect x="60" y="698" width="700" height="160" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="60.5" y="698.5" width="699" height="58" fill="#ccf6ff"/>
<text x="84.0" y="738.5" font-size="32" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">왕이 되어 왕험에 도읍</text>
<text x="84.0" y="801.0" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">진번 · 조선 토착민, 연 · 제 망명인을 거느림</text>
<text x="84.0" y="842.2" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">한의 외신이 되어 진번 · 임둔도 복속시킴</text>
<text x="800.0" y="214.0" font-size="32" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">멸망</text>
<rect x="800" y="236" width="740" height="176" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="800.5" y="236.5" width="739" height="58" fill="#ccf6ff"/>
<text x="824.0" y="276.5" font-size="32" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">손자 우거왕 때의 갈등</text>
<text x="824.0" y="339.0" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">한의 망명인을 많이 받아들임</text>
<text x="824.0" y="380.2" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">진번 주변 나라들이 한과 통하는 것을 막음</text>
<rect x="800" y="432" width="740" height="498" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<line x1="836" y1="477" x2="836" y2="825" stroke="#00d0ff" stroke-width="1.5"/>
<circle cx="836" cy="477" r="7" fill="#00d0ff" stroke="#ffffff" stroke-width="2"/><circle cx="836" cy="477" r="8.5" fill="none" stroke="#2a2c2d" stroke-width="0.6"/>
<text x="872.0" y="486.0" font-size="27" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">서기전 109</text>
<text x="1026.0" y="486.0" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">한이 섭하를 보냄 → 우거가 조서를 거부</text>
<circle cx="836" cy="555" r="7" fill="#00d0ff" stroke="#ffffff" stroke-width="2"/><circle cx="836" cy="555" r="8.5" fill="none" stroke="#2a2c2d" stroke-width="0.6"/>
<text x="872.0" y="564.0" font-size="27" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700"></text>
<text x="1026.0" y="564.0" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">섭하가 비왕을 죽임 → 조선이 섭하를 죽임</text>
<rect x="860" y="612" width="656" height="80" fill="#effbff" stroke="#00d0ff" stroke-width="0.5"/>
<circle cx="836" cy="633" r="7" fill="#00d0ff" stroke="#ffffff" stroke-width="2"/><circle cx="836" cy="633" r="8.5" fill="none" stroke="#2a2c2d" stroke-width="0.6"/>
<text x="872.0" y="642.0" font-size="27" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700"></text>
<text x="1026.0" y="642.0" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">한 무제가 수군 · 육군으로 공격</text>
<text x="1026.0" y="678.0" font-size="27" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">처음 싸움은 한군이 크게 불리</text>
<circle cx="836" cy="747" r="7" fill="#00d0ff" stroke="#ffffff" stroke-width="2"/><circle cx="836" cy="747" r="8.5" fill="none" stroke="#2a2c2d" stroke-width="0.6"/>
<text x="872.0" y="756.0" font-size="27" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">1년여</text>
<text x="1026.0" y="756.0" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">왕험성에서 버팀 · 지배층이 갈라짐</text>
<rect x="860" y="804" width="656" height="80" fill="#effbff" stroke="#00d0ff" stroke-width="0.5"/>
<circle cx="836" cy="825" r="7" fill="#00d0ff" stroke="#ffffff" stroke-width="2"/><circle cx="836" cy="825" r="8.5" fill="none" stroke="#2a2c2d" stroke-width="0.6"/>
<text x="872.0" y="834.0" font-size="27" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">서기전 108</text>
<text x="1026.0" y="834.0" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">조선상 노인 등이 우거를 죽이고 항복</text>
<text x="1026.0" y="870.0" font-size="27" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">왕험성 함락 → 한 군현 설치</text>
<text x="60.0" y="900.0" font-size="27" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">왕검성(왕험성)은 평양설과 요동설이 맞서고,</text>
<text x="60.0" y="938.0" font-size="27" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">패수의 위치도 여러 설이 있어 지도 대신 흐름으로 정리함</text>
</svg>
