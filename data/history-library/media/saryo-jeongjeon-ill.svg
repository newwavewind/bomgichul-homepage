<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 1000" role="img">
<title>성덕왕의 정전 지급(722)</title>
<desc>687년 관료전 지급, 689년 녹읍 폐지, 722년 정전 지급, 757년 녹읍 부활을 잇는 연표와 녹읍·관료전·정전을 견준 카드로 된 정리 그림.</desc>
<defs>
<marker id="ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="5.5" markerHeight="5.5" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M1 1.5 L11 6 L1 10.5 L3.6 6 z" fill="#0096b8"/></marker>
<marker id="ahl" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="5.5" markerHeight="5.5" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M1 1.5 L11 6 L1 10.5 L3.6 6 z" fill="#7a62d6"/></marker>
</defs>
<rect width="1600" height="1000" fill="#effbff"/>
<text x="60" y="92" font-size="48" fill="#2a2c2d" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">성덕왕의 정전 지급(722)</text>
<text x="60" y="140" font-size="28" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">귀족의 땅 지배를 줄이고 백성을 나라가 직접 거느리려는 흐름</text>
<text x="1540" y="92" font-size="28" fill="#0096b8" text-anchor="end" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">정리 그림</text>
<line x1="60" y1="166" x2="1540" y2="166" stroke="#00d0ff" stroke-width="1"/>
<rect x="60" y="210" width="860" height="130" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<text x="90" y="265" font-size="34" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">687년</text>
<text x="230" y="265" font-size="26" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">(신문왕 7)</text>
<text x="90" y="312" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">문무 관리에게 관료전을 줌</text>
<line x1="490" y1="342" x2="490" y2="381" stroke="#0096b8" stroke-width="2" marker-end="url(#ah)"/>
<rect x="60" y="385" width="860" height="130" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<text x="90" y="440" font-size="34" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">689년</text>
<text x="230" y="440" font-size="26" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">(신문왕 9)</text>
<text x="90" y="487" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">녹읍을 없애고 해마다 곡식(세조)을 줌</text>
<line x1="490" y1="517" x2="490" y2="556" stroke="#0096b8" stroke-width="2" marker-end="url(#ah)"/>
<rect x="60" y="560" width="860" height="130" fill="#ccf6ff" stroke="#0096b8" stroke-width="1.5"/>
<text x="90" y="615" font-size="34" fill="#7a62d6" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">722년</text>
<text x="230" y="615" font-size="26" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">(성덕왕 21)</text>
<text x="90" y="662" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">백성에게 처음으로 정전을 줌</text>
<line x1="490" y1="692" x2="490" y2="731" stroke="#0096b8" stroke-width="2" marker-end="url(#ah)"/>
<rect x="60" y="735" width="860" height="130" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<text x="90" y="790" font-size="34" fill="#5d6365" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">757년</text>
<text x="230" y="790" font-size="26" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">(경덕왕 16)</text>
<text x="90" y="837" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">월봉을 없애고 녹읍을 되살림</text>
<rect x="980" y="205" width="560" height="215" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="980.5" y="205.5" width="559" height="57" fill="#ccf6ff"/>
<text x="1004" y="245" font-size="29" fill="#5d6365" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">녹읍</text>
<text x="1010" y="307" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">그 땅의 조세를 거두고</text>
<text x="1010" y="353" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">백성의 노동력까지 부릴 수 있음</text>
<rect x="980" y="445" width="560" height="215" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="980.5" y="445.5" width="559" height="57" fill="#ccf6ff"/>
<text x="1004" y="485" font-size="29" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">관료전</text>
<text x="1010" y="547" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">조세만 거둘 수 있고</text>
<text x="1010" y="593" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">노동력 징발은 할 수 없음</text>
<rect x="980" y="685" width="560" height="250" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="980.5" y="685.5" width="559" height="57" fill="#ccf6ff"/>
<text x="1004" y="725" font-size="29" fill="#7a62d6" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">정전</text>
<text x="1010" y="787" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">정(丁)의 나이에 든 백성에게 줌</text>
<text x="1010" y="833" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">가진 땅을 법으로 인정(추정)</text>
<text x="1010" y="879" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">자세한 내용은 아직 연구 중</text>
</svg>
