<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 1000" role="img">
<title>재상지종 — 왕실과 혼인할 수 있는 가문</title>
<desc>왼쪽은 충선왕 복위 교서의 두 내용(왕실 동성혼 금지, 왕실 종친과 재상 집안의 혼인), 오른쪽은 교서에 오른 가문 열 곳과 이 명단이 권문세족을 보여 준다는 점을 정리한 그림.</desc>
<defs>
<marker id="ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="5.5" markerHeight="5.5" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M1 1.5 L11 6 L1 10.5 L3.6 6 z" fill="#0096b8"/></marker>
<marker id="ahl" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="5.5" markerHeight="5.5" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M1 1.5 L11 6 L1 10.5 L3.6 6 z" fill="#7a62d6"/></marker>
</defs>
<rect width="1600" height="1000" fill="#effbff"/>
<text x="60" y="92" font-size="48" fill="#2a2c2d" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">재상지종 — 왕실과 혼인할 수 있는 가문</text>
<text x="60" y="140" font-size="28" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">1308년 충선왕이 복위하며 내린 교서의 내용</text>
<text x="1540" y="92" font-size="28" fill="#0096b8" text-anchor="end" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">정리 그림</text>
<line x1="60" y1="166" x2="1540" y2="166" stroke="#00d0ff" stroke-width="1"/>
<rect x="60" y="190" width="620" height="740" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/><rect x="60.5" y="190.5" width="619" height="58" fill="#ccf6ff"/><text x="84" y="230" font-size="31" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">충선왕 복위 교서 (1308)</text><text x="84" y="300" font-size="30" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">① 왕실 종친의 동성혼 금지</text><text x="84" y="345" font-size="28" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">같은 성씨와 혼인하면</text><text x="84" y="385" font-size="28" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">「황제의 뜻을 어긴 것」으로 다스림</text><text x="84" y="470" font-size="30" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">② 혼인 상대를 정해 둠</text><rect x="110" y="510" width="230" height="100" fill="#ccf6ff" stroke="#00d0ff" stroke-width="0.8"/><text x="225.0" y="570.0" font-size="29" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">왕실 종친</text><rect x="420" y="510" width="230" height="100" fill="#ccf6ff" stroke="#00d0ff" stroke-width="0.8"/><text x="535.0" y="570.0" font-size="29" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">재상 집안</text><line x1="345" y1="545" x2="415" y2="545" stroke="#0096b8" stroke-width="3" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="380" y="650" font-size="26" fill="#0096b8" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">서로 혼인할 수 있게 함</text><text x="84" y="740" font-size="28" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">대대로 공신·재상을 낸 집안</text><text x="84" y="780" font-size="28" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">= 「재상지종(宰相之宗)」</text><text x="84" y="870" font-size="24" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">※ 원 간섭기 왕실과 혼인한 집안이</text><text x="84" y="905" font-size="24" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">   곧 그 시대 최고 가문</text><rect x="720" y="190" width="820" height="560" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/><rect x="720.5" y="190.5" width="819" height="58" fill="#ccf6ff"/><text x="744" y="230" font-size="31" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">교서에 오른 가문 (일부)</text><rect x="750" y="270" width="370" height="68" fill="#ccf6ff" stroke="#00d0ff" stroke-width="0.8"/><text x="935.0" y="314.0" font-size="29" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">경주 김씨</text><rect x="1140" y="270" width="370" height="68" fill="#ccf6ff" stroke="#00d0ff" stroke-width="0.8"/><text x="1325.0" y="314.0" font-size="29" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">언양 김씨</text><rect x="750" y="356" width="370" height="68" fill="#ccf6ff" stroke="#00d0ff" stroke-width="0.8"/><text x="935.0" y="400.0" font-size="29" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">정안 임씨</text><rect x="1140" y="356" width="370" height="68" fill="#ccf6ff" stroke="#00d0ff" stroke-width="0.8"/><text x="1325.0" y="400.0" font-size="29" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">경원 이씨</text><rect x="750" y="442" width="370" height="68" fill="#ccf6ff" stroke="#00d0ff" stroke-width="0.8"/><text x="935.0" y="486.0" font-size="29" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">안산 김씨</text><rect x="1140" y="442" width="370" height="68" fill="#ccf6ff" stroke="#00d0ff" stroke-width="0.8"/><text x="1325.0" y="486.0" font-size="29" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">철원 최씨</text><rect x="750" y="528" width="370" height="68" fill="#ccf6ff" stroke="#00d0ff" stroke-width="0.8"/><text x="935.0" y="572.0" font-size="29" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">해주 최씨</text><rect x="1140" y="528" width="370" height="68" fill="#ccf6ff" stroke="#00d0ff" stroke-width="0.8"/><text x="1325.0" y="572.0" font-size="29" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">공암 허씨</text><rect x="750" y="614" width="370" height="68" fill="#ccf6ff" stroke="#00d0ff" stroke-width="0.8"/><text x="935.0" y="658.0" font-size="29" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">평강 채씨</text><rect x="1140" y="614" width="370" height="68" fill="#ccf6ff" stroke="#00d0ff" stroke-width="0.8"/><text x="1325.0" y="658.0" font-size="29" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">청주 이씨</text><text x="1130" y="725" font-size="24" fill="#5d6365" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">… 등 여러 가문이 명단에 오름</text><rect x="720" y="780" width="820" height="150" fill="#ffffff" stroke="#0096b8" stroke-width="1.5"/><text x="750" y="835" font-size="30" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">왕실과 혼인하는 집안 = 그 시대 최고 가문</text><text x="750" y="890" font-size="28" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">→ 원 간섭기 지배층 「권문세족」의 모습을 보여 주는 명단</text>
</svg>