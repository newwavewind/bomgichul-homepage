<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 1000" role="img">
<title>황산벌 전투(660)</title>
<desc>왼쪽은 신라군이 탄현을 넘어 황산벌에 이르고 계백의 결사대와 네 번 싸운 뒤, 반굴·관창의 전사로 사기가 올라 이기고 사비성이 함락되기까지의 흐름도, 오른쪽은 양쪽 군대와 백제 조정의 대응을 정리한 그림.</desc>
<defs>
<marker id="ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="5.5" markerHeight="5.5" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M1 1.5 L11 6 L1 10.5 L3.6 6 z" fill="#0096b8"/></marker>
</defs>
<rect width="1600" height="1000" fill="#effbff"/>
<text x="60" y="92" font-size="48" fill="#2a2c2d" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">황산벌 전투(660)</text>
<text x="60" y="140" font-size="28" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">의자왕 20년, 계백의 결사대가 신라군을 막아선 마지막 싸움</text>
<text x="1540" y="92" font-size="28" fill="#0096b8" text-anchor="end" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">정리 그림</text>
<line x1="60" y1="166" x2="1540" y2="166" stroke="#00d0ff" stroke-width="1"/>
<rect x="60" y="200" width="860" height="82" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<text x="90" y="252" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">김유신의 신라군 5만이 7월 9일 탄현을 넘음</text>
<line x1="490" y1="284" x2="490" y2="318" stroke="#0096b8" stroke-width="2" marker-end="url(#ah)"/>
<rect x="60" y="322" width="860" height="82" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<text x="90" y="374" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">계백이 결사대 5천으로 황산벌에 세 진영을 침</text>
<line x1="490" y1="406" x2="490" y2="440" stroke="#0096b8" stroke-width="2" marker-end="url(#ah)"/>
<rect x="60" y="444" width="860" height="82" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<text x="90" y="496" font-size="29" fill="#0096b8" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">네 번 싸워 네 번 모두 백제군이 이김</text>
<line x1="490" y1="528" x2="490" y2="562" stroke="#0096b8" stroke-width="2" marker-end="url(#ah)"/>
<rect x="60" y="566" width="860" height="82" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<text x="90" y="618" font-size="29" fill="#7a62d6" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">반굴 · 화랑 관창이 뛰어들어 전사 → 신라군 사기↑</text>
<line x1="490" y1="650" x2="490" y2="684" stroke="#0096b8" stroke-width="2" marker-end="url(#ah)"/>
<rect x="60" y="688" width="860" height="82" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<text x="90" y="740" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">결사대가 크게 지고 계백 전사</text>
<line x1="490" y1="772" x2="490" y2="806" stroke="#0096b8" stroke-width="2" marker-end="url(#ah)"/>
<rect x="60" y="810" width="860" height="82" fill="#ccf6ff" stroke="#0096b8" stroke-width="1.5"/>
<text x="90" y="862" font-size="29" fill="#0096b8" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">나당 연합군이 사비성을 함락 → 백제 멸망</text>
<rect x="980" y="200" width="560" height="300" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="980.5" y="200.5" width="559" height="58" fill="#ccf6ff"/>
<text x="1004" y="240" font-size="29" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">양쪽 군대</text>
<text x="1010" y="305" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">· 백제: 계백의 결사대 5천</text>
<text x="1010" y="353" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">· 신라: 김유신의 5만, 육로로 진군</text>
<text x="1010" y="401" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">· 당: 소정방의 13만, 바닷길로 진군</text>
<text x="1010" y="449" font-size="27" fill="#7a62d6" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">· 황산벌 = 지금의 논산 연산 일대</text>
<rect x="980" y="540" width="560" height="348" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="980.5" y="540.5" width="559" height="58" fill="#ccf6ff"/>
<text x="1004" y="580" font-size="29" fill="#7a62d6" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">머뭇거린 백제 조정</text>
<text x="1010" y="645" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">흥수: 백강과 탄현을 막아</text>
<text x="1010" y="693" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">당군 상륙 · 신라군 진입을 막자</text>
<text x="1010" y="741" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">대신들: 들어온 뒤에 치자</text>
<text x="1010" y="789" font-size="27" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">→ 결정을 못 하는 사이</text>
<text x="1010" y="837" font-size="27" fill="#0096b8" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">신라군이 탄현을 넘음</text>
</svg>
