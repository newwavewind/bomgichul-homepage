<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">
<title>제1차·제2차 경제 개발 5개년 계획 비교</title>
<rect width="960" height="560" fill="#ffffff"/>
<text x="480.0" y="52" text-anchor="middle" font-size="30" font-weight="700" fill="#1b2a4a">경제 개발 5개년 계획 — 제1차와 제2차</text>
<text x="480.0" y="84" text-anchor="middle" font-size="17" font-weight="400" fill="#5b6475">1962년부터 정부가 5년 단위로 세워 실행한 경제 계획</text>
<rect x="60" y="112" width="400" height="400" rx="10" fill="#ffffff" stroke="#0096d6" stroke-width="2"/>
<rect x="61" y="113" width="398" height="62" rx="9" fill="#e3f5fd"/>
<text x="260" y="146" text-anchor="middle" font-size="24" font-weight="700" fill="#0096d6">제1차 계획</text>
<text x="260" y="168" text-anchor="middle" font-size="16" font-weight="400" fill="#5b6475">1962 ~ 1966</text>
<text x="260" y="214" text-anchor="middle" font-size="20" font-weight="700" fill="#1b2a4a">자립 경제의 바탕 마련</text>
<text x="260" y="244" text-anchor="middle" font-size="17" font-weight="400" fill="#5b6475">목표를 넘는 성장</text>
<rect x="210" y="329.6" width="100" height="140.4" fill="#0096d6"/>
<line x1="150" y1="470" x2="370" y2="470" stroke="#1b2a4a" stroke-width="1.5"/>
<text x="260" y="317.6" text-anchor="middle" font-size="20" font-weight="700" fill="#1b2a4a">연평균 7.8%</text>
<text x="260" y="498" text-anchor="middle" font-size="15" font-weight="400" fill="#5b6475">한 해 평균 경제 성장률</text>
<rect x="500" y="112" width="400" height="400" rx="10" fill="#ffffff" stroke="#0096d6" stroke-width="2"/>
<rect x="501" y="113" width="398" height="62" rx="9" fill="#e3f5fd"/>
<text x="700" y="146" text-anchor="middle" font-size="24" font-weight="700" fill="#0096d6">제2차 계획</text>
<text x="700" y="168" text-anchor="middle" font-size="16" font-weight="400" fill="#5b6475">1967 ~ 1971</text>
<text x="700" y="214" text-anchor="middle" font-size="20" font-weight="700" fill="#1b2a4a">산업 구조 근대화 · 수출 증대</text>
<text x="700" y="244" text-anchor="middle" font-size="17" font-weight="400" fill="#5b6475">본격적인 공업화</text>
<rect x="650" y="295.4" width="100" height="174.6" fill="#0096d6"/>
<line x1="590" y1="470" x2="810" y2="470" stroke="#1b2a4a" stroke-width="1.5"/>
<text x="700" y="283.4" text-anchor="middle" font-size="20" font-weight="700" fill="#1b2a4a">연평균 9.7%</text>
<text x="700" y="498" text-anchor="middle" font-size="15" font-weight="400" fill="#5b6475">한 해 평균 경제 성장률</text>
<line x1="462" y1="312" x2="498" y2="312" stroke="#0096d6" stroke-width="3" stroke-linecap="round"/>
<path d="M487.2 317.2 L498 312 L487.2 306.8" fill="none" stroke="#0096d6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
