<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 1000" role="img">
<title>신라 촌락 문서(민정 문서) — 네 마을을 낱낱이 적다</title>
<desc>위는 닥종이 두 장에 적힌 네 촌(사해점촌, 살하지촌, 이름이 남지 않은 두 촌)의 소속과 마을 둘레, 가운데는 각 촌마다 같은 순서로 적은 열 가지 항목(촌명, 촌역, 호, 인구, 소·말, 토지, 나무, 그리고 호구·소말·나무의 감소), 아래는 호를 9등급으로 나눈 계연, 남녀를 6등급으로 나눈 인구, 작성 연대 설을 정리한 그림.</desc>
<defs>
<marker id="ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="5.5" markerHeight="5.5" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M1 1.5 L11 6 L1 10.5 L3.6 6 z" fill="#0096b8"/></marker>
<marker id="ahl" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="5.5" markerHeight="5.5" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M1 1.5 L11 6 L1 10.5 L3.6 6 z" fill="#7a62d6"/></marker>
<radialGradient id="glow"><stop offset="0" stop-color="#00d0ff" stop-opacity="0.55"/><stop offset="0.45" stop-color="#00d0ff" stop-opacity="0.2"/><stop offset="1" stop-color="#00d0ff" stop-opacity="0"/></radialGradient>
<filter id="plate" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#2a2c2d" flood-opacity="0.16"/></filter>
<filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
<rect width="1600" height="1000" fill="#effbff"/>
<text x="60.0" y="92.0" font-size="48" fill="#2a2c2d" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">신라 촌락 문서(민정 문서) — 네 마을을 낱낱이 적다</text>
<text x="60.0" y="140.0" font-size="28" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">서원경(지금의 청주) 부근 네 촌 · 3년마다 조사 · 1933년 일본 쇼소인에서 발견</text>
<text x="1540.0" y="92.0" font-size="28" fill="#0096b8" text-anchor="end" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">정리 그림</text>
<line x1="60" y1="166" x2="1540" y2="166" stroke="#00d0ff" stroke-width="1"/>
<rect x="60" y="190" width="1480" height="236" fill="#fffdf6" stroke="#2a2c2d" stroke-width="0.6"/>
<text x="90.0" y="232.0" font-size="26" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">닥종이 2장 · 해서체로 적음</text>
<rect x="90" y="252" width="340" height="154" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<text x="110.0" y="296.0" font-size="32" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">A</text>
<text x="152.0" y="296.0" font-size="30" fill="#2a2c2d" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">사해점촌</text>
<text x="110.0" y="344.0" font-size="27" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">현 소속</text>
<text x="110.0" y="388.0" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">둘레 5,725보</text>
<rect x="450" y="252" width="340" height="154" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<text x="470.0" y="296.0" font-size="32" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">B</text>
<text x="512.0" y="296.0" font-size="30" fill="#2a2c2d" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">살하지촌</text>
<text x="470.0" y="344.0" font-size="27" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">현 소속</text>
<text x="470.0" y="388.0" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">둘레 1만 2,830보</text>
<rect x="810" y="252" width="340" height="154" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<text x="830.0" y="296.0" font-size="32" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">C</text>
<text x="872.0" y="296.0" font-size="30" fill="#2a2c2d" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">이름 모름</text>
<text x="830.0" y="344.0" font-size="27" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">현 소속</text>
<text x="830.0" y="388.0" font-size="27" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">둘레 기록이 안 남음</text>
<rect x="1170" y="252" width="340" height="154" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<text x="1190.0" y="296.0" font-size="32" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">D</text>
<text x="1232.0" y="296.0" font-size="30" fill="#2a2c2d" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">이름 모름</text>
<text x="1190.0" y="344.0" font-size="27" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">서원경 직할</text>
<text x="1190.0" y="388.0" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">둘레 4,800보</text>
<rect x="60" y="452" width="1480" height="236" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<text x="90.0" y="496.0" font-size="30" fill="#2a2c2d" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">촌마다 같은 순서로 적은 항목</text>
<rect x="90" y="520" width="186" height="62" fill="#ccf6ff" stroke="#00d0ff" stroke-width="1"/>
<text x="183.0" y="562.0" font-size="27" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">1 촌 이름</text>
<rect x="288" y="520" width="186" height="62" fill="#ccf6ff" stroke="#00d0ff" stroke-width="1"/>
<text x="381.0" y="562.0" font-size="27" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">2 촌의 영역</text>
<rect x="486" y="520" width="186" height="62" fill="#ccf6ff" stroke="#00d0ff" stroke-width="1"/>
<text x="579.0" y="562.0" font-size="27" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">3 호(연)</text>
<rect x="684" y="520" width="186" height="62" fill="#ccf6ff" stroke="#00d0ff" stroke-width="1"/>
<text x="777.0" y="562.0" font-size="27" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">4 인구</text>
<rect x="882" y="520" width="186" height="62" fill="#ccf6ff" stroke="#00d0ff" stroke-width="1"/>
<text x="975.0" y="562.0" font-size="27" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">5 소 · 말</text>
<rect x="1080" y="520" width="186" height="62" fill="#ccf6ff" stroke="#00d0ff" stroke-width="1"/>
<text x="1173.0" y="562.0" font-size="27" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">6 토지</text>
<rect x="1278" y="520" width="186" height="62" fill="#ccf6ff" stroke="#00d0ff" stroke-width="1"/>
<text x="1371.0" y="562.0" font-size="27" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">7 나무</text>
<rect x="90" y="600" width="186" height="62" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<text x="183.0" y="642.0" font-size="27" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">8 호구 감소</text>
<rect x="288" y="600" width="186" height="62" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<text x="381.0" y="642.0" font-size="27" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">9 소 · 말 감소</text>
<rect x="486" y="600" width="186" height="62" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<text x="579.0" y="642.0" font-size="27" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">10 나무 감소</text>
<text x="700.0" y="642.0" font-size="27" fill="#0096b8" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">← 3년 동안 줄어든 것까지 따로 적음</text>
<text x="1464.0" y="642.0" font-size="26" fill="#5d6365" text-anchor="end" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">나무: 뽕 · 잣 · 호두나무</text>
<rect x="60" y="712" width="472" height="218" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="60.5" y="712.5" width="471" height="52" fill="#ccf6ff"/>
<text x="84.0" y="749.5" font-size="32" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">호 · 계연</text>
<text x="84.0" y="807.0" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">공연을 상상 ~ 하하</text>
<text x="84.0" y="839.9" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">9등급으로 나눔</text>
<text x="84.0" y="872.9" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">이를 환산한 계연이</text>
<text x="84.0" y="905.8" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">세금 · 군역의 기준</text>
<rect x="564" y="712" width="472" height="218" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="564.5" y="712.5" width="471" height="52" fill="#ccf6ff"/>
<text x="588.0" y="749.5" font-size="32" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">인구</text>
<text x="588.0" y="807.0" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">남녀를 각각 6등급으로</text>
<text x="588.0" y="839.9" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">정(丁)이 부역을 지는 중심</text>
<text x="588.0" y="872.9" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">네 촌 모두 462명</text>
<text x="588.0" y="905.8" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">(남 204 · 여 258)</text>
<rect x="1068" y="712" width="472" height="218" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="1068.5" y="712.5" width="471" height="52" fill="#ccf6ff"/>
<text x="1092.0" y="749.5" font-size="32" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">작성 연대</text>
<text x="1092.0" y="807.0" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">695 · 755 · 815 · 875년 설</text>
<text x="1092.0" y="839.9" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">815년 설이 오래 정설</text>
<text x="1092.0" y="872.9" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">최근 695년 설도 지지</text>
<text x="1092.0" y="905.8" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">— 아직 정해지지 않음</text>
</svg>
