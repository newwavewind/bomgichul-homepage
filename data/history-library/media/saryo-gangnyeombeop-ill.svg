<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 1000" role="img">
<title>각염법 — 소금을 나라가 도맡다</title>
<desc>왼쪽은 각염법 이전 궁원·사원·권세가가 염분을 차지해 재정이 모자랐던 상황, 오른쪽은 염분을 나라에 거두고 의염창에서 소금을 팔게 한 각염법, 아래는 그 목적과 부작용을 정리한 그림.</desc>
<defs>
<marker id="ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="5.5" markerHeight="5.5" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M1 1.5 L11 6 L1 10.5 L3.6 6 z" fill="#0096b8"/></marker>
<marker id="ahl" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="5.5" markerHeight="5.5" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M1 1.5 L11 6 L1 10.5 L3.6 6 z" fill="#7a62d6"/></marker>
</defs>
<rect width="1600" height="1000" fill="#effbff"/>
<text x="60" y="92" font-size="48" fill="#2a2c2d" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">각염법 — 소금을 나라가 도맡다</text>
<text x="60" y="140" font-size="28" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">1309년(충선왕 원년) 소금의 생산과 판매를 나라가 맡게 한 개혁</text>
<text x="1540" y="92" font-size="28" fill="#0096b8" text-anchor="end" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">정리 그림</text>
<line x1="60" y1="166" x2="1540" y2="166" stroke="#00d0ff" stroke-width="1"/>
<rect x="60" y="190" width="700" height="470" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/><rect x="60.5" y="190.5" width="699" height="58" fill="#ccf6ff"/><text x="84" y="230" font-size="31" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">각염법 이전</text><rect x="90" y="280" width="300" height="100" fill="#ccf6ff" stroke="#00d0ff" stroke-width="0.8"/><text x="240.0" y="340.0" font-size="29" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">염호(소금 만드는 집)</text><line x1="395" y1="330" x2="505" y2="330" stroke="#0096b8" stroke-width="3" marker-end="url(#ah)"/><text x="450" y="310" font-size="24" fill="#0096b8" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">염세</text><rect x="510" y="280" width="220" height="100" fill="#ccf6ff" stroke="#00d0ff" stroke-width="0.8"/><text x="620.0" y="340.0" font-size="29" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">나라</text><text x="90" y="450" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">궁원 · 사원 · 권세가가</text><text x="90" y="495" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">염분(소금 가마)을 차지하고</text><text x="90" y="540" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">세금을 내지 않고 이익을 독차지</text><text x="90" y="610" font-size="29" fill="#0096b8" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">→ 나라 살림(재정)이 모자람</text><rect x="840" y="190" width="700" height="470" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/><rect x="840.5" y="190.5" width="699" height="58" fill="#ccf6ff"/><text x="864" y="230" font-size="31" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">각염법 (1309, 충선왕)</text><text x="864" y="300" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">여러 곳이 가진 염분을</text><text x="864" y="345" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">모두 나라에 거두어들임</text><rect x="870" y="390" width="300" height="100" fill="#ccf6ff" stroke="#00d0ff" stroke-width="0.8"/><text x="1020.0" y="436.0" font-size="29" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">염분 → 나라</text><text x="1020.0" y="474.0" font-size="24" fill="#5d6365" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">생산을 나라가 맡음</text><line x1="1175" y1="440" x2="1235" y2="440" stroke="#0096b8" stroke-width="3" marker-end="url(#ah)"/><rect x="1240" y="390" width="270" height="100" fill="#ccf6ff" stroke="#00d0ff" stroke-width="0.8"/><text x="1375.0" y="436.0" font-size="29" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">의염창</text><text x="1375.0" y="474.0" font-size="24" fill="#5d6365" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">판매를 나라가 맡음</text><text x="864" y="560" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">소금이 필요한 사람은 모두</text><text x="864" y="605" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">의염창에 가서 값을 치르고 사게 함</text><line x1="770" y1="425" x2="830" y2="425" stroke="#0096b8" stroke-width="4" marker-end="url(#ah)"/><rect x="60" y="690" width="1480" height="240" fill="#ffffff" stroke="#0096b8" stroke-width="1.5"/><text x="90" y="745" font-size="31" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">각염법의 두 얼굴</text><rect x="90" y="775" width="690" height="120" fill="#ccf6ff" stroke="#00d0ff" stroke-width="0.8"/><text x="435.0" y="831.0" font-size="29" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">노린 것: 권세가 누르기 · 재정 늘리기</text><text x="435.0" y="869.0" font-size="24" fill="#5d6365" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">소금 = 나라가 도맡아 파는 물건(전매)</text><rect x="820" y="775" width="690" height="120" fill="#ccf6ff" stroke="#00d0ff" stroke-width="0.8"/><text x="1165.0" y="831.0" font-size="29" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">그늘: 백성의 부담</text><text x="1165.0" y="869.0" font-size="24" fill="#5d6365" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">소금값 베(염가포)가 새 세금이 되어 부담이 커짐</text>
</svg>