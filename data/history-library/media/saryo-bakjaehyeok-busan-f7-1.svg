<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">
<title>박재혁의 부산 경찰서 폭탄 투척(1920)</title>
<rect width="960" height="620" fill="#ffffff"/>
<text x="480.0" y="52" text-anchor="middle" font-size="30" font-weight="700" fill="#1b2a4a">박재혁의 부산 경찰서 폭탄 투척(1920)</text>
<text x="480.0" y="84" text-anchor="middle" font-size="17" font-weight="400" fill="#5b6475">의열단원이 고서 상인으로 꾸며 부산 경찰서장을 처단하다</text>
<rect x="30" y="110" width="900" height="70" rx="10" fill="#ffffff" stroke="#9fdcf5" stroke-width="2" stroke-dasharray="6 5"/>
<text x="480.0" y="150.5" text-anchor="middle" font-size="18" font-weight="700" fill="#1b2a4a">1920년 초, 많은 의열단원이 부산 경찰서에 붙잡힘 → 단장 김원봉이 처단을 계획</text>
<line x1="90" y1="270" x2="830" y2="270" stroke="#9fdcf5" stroke-width="4" stroke-dasharray="10 8"/>
<circle cx="90" cy="270" r="10" fill="#1b2a4a" stroke="#ffffff" stroke-width="3"/>
<text x="90" y="240" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2a4a">싱가포르</text>
<text x="90" y="305" text-anchor="middle" font-size="15" font-weight="400" fill="#5b6475">박재혁이 머물던 곳</text>
<line x1="150" y1="270" x2="220" y2="270" stroke="#0096d6" stroke-width="2" stroke-linecap="round"/>
<path d="M210.1 274.8 L220 270 L210.1 265.2" fill="none" stroke="#0096d6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="280" cy="270" r="10" fill="#1b2a4a" stroke="#ffffff" stroke-width="3"/>
<text x="280" y="240" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2a4a">상하이</text>
<text x="280" y="305" text-anchor="middle" font-size="15" font-weight="400" fill="#5b6475">김원봉이 부름</text>
<line x1="340" y1="270" x2="410" y2="270" stroke="#0096d6" stroke-width="2" stroke-linecap="round"/>
<path d="M400.1 274.8 L410 270 L400.1 265.2" fill="none" stroke="#0096d6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="470" cy="270" r="10" fill="#1b2a4a" stroke="#ffffff" stroke-width="3"/>
<text x="470" y="240" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2a4a">나가사키</text>
<line x1="530" y1="270" x2="590" y2="270" stroke="#0096d6" stroke-width="2" stroke-linecap="round"/>
<path d="M580.1 274.8 L590 270 L580.1 265.2" fill="none" stroke="#0096d6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="650" cy="270" r="10" fill="#1b2a4a" stroke="#ffffff" stroke-width="3"/>
<text x="650" y="240" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2a4a">쓰시마</text>
<line x1="710" y1="270" x2="770" y2="270" stroke="#0096d6" stroke-width="2" stroke-linecap="round"/>
<path d="M760.1 274.8 L770 270 L760.1 265.2" fill="none" stroke="#0096d6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="830" cy="270" r="13" fill="#0096d6" stroke="#ffffff" stroke-width="3"/>
<text x="830" y="240" text-anchor="middle" font-size="19" font-weight="700" fill="#0096d6">부산</text>
<text x="830" y="305" text-anchor="middle" font-size="15" font-weight="400" fill="#5b6475">고향</text>
<rect x="30" y="340" width="440" height="120" rx="10" fill="#ffffff" stroke="#9fdcf5" stroke-width="2"/>
<text x="250.0" y="381.1" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2a4a">고서 상인으로 꾸밈</text>
<text x="250.0" y="406.6" text-anchor="middle" font-size="17" font-weight="400" fill="#1b2a4a">서장이 옛 책을 모은다는 것을 알고</text>
<text x="250.0" y="431.3" text-anchor="middle" font-size="17" font-weight="400" fill="#1b2a4a">중국 고서 더미 속에 폭탄을 숨김</text>
<rect x="495" y="340" width="435" height="120" rx="10" fill="#eaf7fd" stroke="#0096d6" stroke-width="2"/>
<text x="712.5" y="381.1" text-anchor="middle" font-size="19" font-weight="700" fill="#0096d6">1920. 9. 14 부산 경찰서</text>
<text x="712.5" y="406.6" text-anchor="middle" font-size="17" font-weight="400" fill="#1b2a4a">「상하이에서 온 의열단원」이라 외치고</text>
<text x="712.5" y="431.3" text-anchor="middle" font-size="17" font-weight="400" fill="#1b2a4a">전단을 뿌린 뒤 폭탄을 던짐</text>
<line x1="712" y1="466" x2="712" y2="492" stroke="#0096d6" stroke-width="2.5" stroke-linecap="round"/>
<path d="M707.2 482.1 L712 492 L716.8 482.1" fill="none" stroke="#0096d6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="30" y="498" width="900" height="100" rx="10" fill="#ffffff" stroke="#9fdcf5" stroke-width="2"/>
<text x="480.0" y="529.1" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2a4a">결과</text>
<text x="480.0" y="554.6" text-anchor="middle" font-size="17" font-weight="400" fill="#1b2a4a">서장은 크게 다쳐 숨지고, 박재혁도 다쳐 붙잡힘 → 감옥에서 음식을 끊고 순국</text>
<text x="480.0" y="579.3" text-anchor="middle" font-size="17" font-weight="700" fill="#0096d6">의열단이 국내 일제 기관을 직접 공격한 이른 시기의 의거</text>
</svg>
