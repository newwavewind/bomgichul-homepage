<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 1000" role="img">
<title>신흥 강습소에서 신흥 무관 학교로</title>
<desc>1910년 삼원보 기지 마련부터 1911년 경학사와 신흥 강습소, 1919년 신흥 무관 학교, 1920년 폐교까지 연표로 잇고 자리와 목적을 정리한 그림.</desc>
<defs><marker id="ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="5.5" markerHeight="5.5" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M1 1.5 L11 6 L1 10.5 L3.6 6 z" fill="#0096b8"/></marker></defs>
<rect width="1600" height="1000" fill="#effbff"/>
<text x="60" y="92" font-size="48" fill="#2a2c2d" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">신흥 강습소에서 신흥 무관 학교로</text>
<text x="60" y="140" font-size="28" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">서간도 삼원보에 세운 독립군 양성 학교의 흐름</text>
<text x="1540" y="92" font-size="28" fill="#0096b8" text-anchor="end" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">정리 그림</text>
<line x1="60" y1="166" x2="1540" y2="166" stroke="#00d0ff" stroke-width="1"/>
<rect x="60.0" y="205" width="352.0" height="70" fill="#ccf6ff" stroke="#0096b8" stroke-width="1.5"/>
<text x="236.0" y="251" font-size="30" fill="#0096b8" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">1910</text>
<rect x="60.0" y="295" width="352.0" height="220" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="60.5" y="295.5" width="351.0" height="57" fill="#ccf6ff"/>
<text x="84.0" y="335" font-size="29" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">기지 마련</text>
<text x="88.0" y="400" font-size="25" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">신민회 인사들이</text>
<text x="88.0" y="444" font-size="25" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">남만주 유하현</text>
<text x="88.0" y="488" font-size="25" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">삼원보에 자리 잡음</text>
<line x1="414.0" y1="240" x2="434.0" y2="240" stroke="#0096b8" stroke-width="3" marker-end="url(#ah)"/>
<rect x="436.0" y="205" width="352.0" height="70" fill="#ccf6ff" stroke="#0096b8" stroke-width="1.5"/>
<text x="612.0" y="251" font-size="30" fill="#7a62d6" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">1911. 4.</text>
<rect x="436.0" y="295" width="352.0" height="220" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="436.5" y="295.5" width="351.0" height="57" fill="#ccf6ff"/>
<text x="460.0" y="335" font-size="29" fill="#7a62d6" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">경학사 · 강습소</text>
<text x="464.0" y="400" font-size="25" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">자치 기관 경학사와</text>
<text x="464.0" y="444" font-size="25" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">함께 신흥 강습소를</text>
<text x="464.0" y="488" font-size="25" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">세움</text>
<line x1="790.0" y1="240" x2="810.0" y2="240" stroke="#0096b8" stroke-width="3" marker-end="url(#ah)"/>
<rect x="812.0" y="205" width="352.0" height="70" fill="#ccf6ff" stroke="#0096b8" stroke-width="1.5"/>
<text x="988.0" y="251" font-size="30" fill="#0096b8" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">1919</text>
<rect x="812.0" y="295" width="352.0" height="220" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="812.5" y="295.5" width="351.0" height="57" fill="#ccf6ff"/>
<text x="836.0" y="335" font-size="29" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">신흥 무관 학교</text>
<text x="840.0" y="400" font-size="25" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">고산자로 옮기며</text>
<text x="840.0" y="444" font-size="25" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">무관 학교로 키움</text>
<text x="840.0" y="488" font-size="25" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">(지청천 · 이범석 교관)</text>
<line x1="1166.0" y1="240" x2="1186.0" y2="240" stroke="#0096b8" stroke-width="3" marker-end="url(#ah)"/>
<rect x="1188.0" y="205" width="352.0" height="70" fill="#ccf6ff" stroke="#0096b8" stroke-width="1.5"/>
<text x="1364.0" y="251" font-size="30" fill="#7a62d6" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">1920 가을</text>
<rect x="1188.0" y="295" width="352.0" height="220" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="1188.5" y="295.5" width="351.0" height="57" fill="#ccf6ff"/>
<text x="1212.0" y="335" font-size="29" fill="#7a62d6" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">문을 닫음</text>
<text x="1216.0" y="400" font-size="25" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">일제의 탄압으로</text>
<text x="1216.0" y="444" font-size="25" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">학교를 닫음 →</text>
<text x="1216.0" y="488" font-size="25" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">졸업생은 독립군으로</text>
<rect x="60" y="560" width="700" height="190" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="60.5" y="560.5" width="699" height="57" fill="#ccf6ff"/>
<text x="84" y="600" font-size="29" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">어디에</text>
<text x="88" y="665" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">· 서간도(남만주) 유하현 삼원보</text>
<text x="88" y="711" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">· 뒤에 고산자로 옮김</text>
<rect x="840" y="560" width="700" height="190" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="840.5" y="560.5" width="699" height="57" fill="#ccf6ff"/>
<text x="864" y="600" font-size="29" fill="#7a62d6" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">무엇을</text>
<text x="868" y="665" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">· 국내에서 건너온 청년을</text>
<text x="868" y="711" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">   독립운동 간부로 기름</text>
<rect x="60" y="800" width="1480" height="80" fill="#ccf6ff" stroke="#0096b8" stroke-width="1.5"/>
<text x="800.0" y="850.8" font-size="30" fill="#0096b8" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">졸업생이 서로 군정서 등 만주 독립군의 중심이 됨</text>
</svg>
