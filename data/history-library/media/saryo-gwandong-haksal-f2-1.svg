<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">
<title>관동 대지진과 조선인 학살(1923)</title>
<desc>1923년 9월 1일 관동 대지진, 다음 날 계엄령, 조선인 폭동 유언비어, 자경단과 군대·경찰의 학살, 희생자 규모와 오늘날 추도비를 차례로 정리한 그림</desc>
<rect width="960" height="600" fill="#ffffff"/>
<text x="40" y="62" font-size="32" fill="#1c2b4a" text-anchor="start" font-weight="700">관동 대지진과 조선인 학살</text>
<text x="40" y="98" font-size="19" fill="#55627a" text-anchor="start">1923년 9월 · 일본 도쿄와 그 둘레(관동 지방)</text>
<text x="920" y="62" font-size="17" fill="#00a3d9" text-anchor="end" font-weight="700">정리 그림</text>
<line x1="40" y1="118" x2="920" y2="118" stroke="#00a3d9" stroke-width="2"/>
<rect x="40" y="160" width="880" height="175" rx="10" fill="#ffffff" stroke="#9fdcf2" stroke-width="1.5"/>
<line x1="70" y1="230" x2="890" y2="230" stroke="#00a3d9" stroke-width="3"/>
<circle cx="152" cy="230" r="8" fill="#ffffff" stroke="#00a3d9" stroke-width="3"/>
<text x="152" y="206" font-size="18" fill="#55627a" text-anchor="middle" font-weight="700">9월 1일</text>
<text x="152" y="266" font-size="17" fill="#1c2b4a" text-anchor="middle">관동 지방에</text>
<text x="152" y="291" font-size="17" fill="#1c2b4a" text-anchor="middle">큰 지진</text>
<circle cx="316" cy="230" r="8" fill="#ffffff" stroke="#00a3d9" stroke-width="3"/>
<text x="316" y="206" font-size="18" fill="#55627a" text-anchor="middle" font-weight="700">9월 2일</text>
<text x="316" y="266" font-size="17" fill="#1c2b4a" text-anchor="middle">일본 정부</text>
<text x="316" y="291" font-size="17" fill="#1c2b4a" text-anchor="middle">계엄령 선포</text>
<circle cx="480" cy="230" r="11" fill="#00a3d9" stroke="#00a3d9" stroke-width="3"/>
<text x="480" y="206" font-size="18" fill="#00a3d9" text-anchor="middle" font-weight="700">혼란 속</text>
<text x="480" y="266" font-size="17" fill="#1c2b4a" text-anchor="middle" font-weight="700">「조선인이</text>
<text x="480" y="291" font-size="17" fill="#1c2b4a" text-anchor="middle">불을 지른다」</text>
<circle cx="644" cy="230" r="11" fill="#00a3d9" stroke="#00a3d9" stroke-width="3"/>
<text x="644" y="206" font-size="18" fill="#00a3d9" text-anchor="middle" font-weight="700">계엄령 아래</text>
<text x="644" y="266" font-size="17" fill="#1c2b4a" text-anchor="middle" font-weight="700">자경단·군대·경찰</text>
<text x="644" y="291" font-size="17" fill="#1c2b4a" text-anchor="middle">조선인 학살</text>
<circle cx="808" cy="230" r="8" fill="#ffffff" stroke="#00a3d9" stroke-width="3"/>
<text x="808" y="206" font-size="18" fill="#55627a" text-anchor="middle" font-weight="700">오늘날</text>
<text x="808" y="266" font-size="17" fill="#1c2b4a" text-anchor="middle">일본 곳곳에</text>
<text x="808" y="291" font-size="17" fill="#1c2b4a" text-anchor="middle">추도비</text>
<rect x="40" y="370" width="280" height="170" rx="10" fill="#ffffff" stroke="#9fdcf2" stroke-width="1.5"/>
<rect x="40" y="370" width="280" height="46" rx="10" fill="#e3f6fd"/>
<rect x="40" y="400" width="280" height="16" fill="#e3f6fd"/>
<text x="180" y="401" font-size="19" fill="#0a6f94" text-anchor="middle" font-weight="700">헛소문</text>
<text x="60" y="450" font-size="17" fill="#1c2b4a" text-anchor="start">「조선인이 불을 지른다」</text>
<text x="60" y="478" font-size="17" fill="#1c2b4a" text-anchor="start">「조선인이 쳐들어온다」</text>
<text x="60" y="506" font-size="17" fill="#1c2b4a" text-anchor="start">경찰이 오히려 퍼뜨림</text>
<rect x="340" y="370" width="280" height="170" rx="10" fill="#ffffff" stroke="#9fdcf2" stroke-width="1.5"/>
<rect x="340" y="370" width="280" height="46" rx="10" fill="#e3f6fd"/>
<rect x="340" y="400" width="280" height="16" fill="#e3f6fd"/>
<text x="480" y="401" font-size="19" fill="#0a6f94" text-anchor="middle" font-weight="700">누가 죽였나</text>
<text x="360" y="450" font-size="17" fill="#1c2b4a" text-anchor="start">겁먹은 주민이 만든</text>
<text x="360" y="478" font-size="17" fill="#1c2b4a" text-anchor="start">자경단</text>
<text x="360" y="506" font-size="17" fill="#1c2b4a" text-anchor="start">군대와 경찰</text>
<rect x="640" y="370" width="280" height="170" rx="10" fill="#ffffff" stroke="#9fdcf2" stroke-width="1.5"/>
<rect x="640" y="370" width="280" height="46" rx="10" fill="#e3f6fd"/>
<rect x="640" y="400" width="280" height="16" fill="#e3f6fd"/>
<text x="780" y="401" font-size="19" fill="#0a6f94" text-anchor="middle" font-weight="700">얼마나 죽었나</text>
<text x="660" y="450" font-size="17" fill="#1c2b4a" text-anchor="start">조선인·일본인 사회주의자</text>
<text x="660" y="478" font-size="17" fill="#1c2b4a" text-anchor="start">6천여 명으로 봄</text>
<text x="660" y="506" font-size="17" fill="#1c2b4a" text-anchor="start">독립신문 조사 6,661명</text>
<text x="480" y="570" font-size="16" fill="#55627a" text-anchor="middle">자연재해가 헛소문과 국가 폭력을 거쳐 민족 학살로 이어짐</text>
</svg>
