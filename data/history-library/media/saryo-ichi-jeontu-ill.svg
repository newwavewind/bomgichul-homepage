<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 1000" role="img">
<title>이치 전투(1592) — 전라도를 지킨 고개</title>
<desc>왼쪽 위는 금산에서 이치(배재) 고개를 넘어 전주로 가려던 일본군의 진로를 이치에서 막았음을 보여 주는 흐름도, 아래는 1592년 7월 8일 전투의 지휘관과 경과. 오른쪽은 이 승리로 전라도가 후방 보급 기지 구실을 하게 된 의의와 시험 단서.</desc>
<defs>
<marker id="ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="5.5" markerHeight="5.5" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M1 1.5 L11 6 L1 10.5 L3.6 6 z" fill="#0096b8"/></marker>
<marker id="ahl" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="5.5" markerHeight="5.5" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M1 1.5 L11 6 L1 10.5 L3.6 6 z" fill="#7a62d6"/></marker>
<radialGradient id="glow"><stop offset="0" stop-color="#00d0ff" stop-opacity="0.55"/><stop offset="0.45" stop-color="#00d0ff" stop-opacity="0.2"/><stop offset="1" stop-color="#00d0ff" stop-opacity="0"/></radialGradient>
<filter id="plate" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#2a2c2d" flood-opacity="0.16"/></filter>
<filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
<rect width="1600" height="1000" fill="#ffffff"/>
<text x="48.0" y="84.0" font-size="48" fill="#2a2c2d" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">이치 전투(1592) — 전라도를 지킨 고개</text>
<text x="48.0" y="130.0" font-size="28" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">금산의 일본군이 전주로 넘어가려던 길목, 이치(배재)에서 막아 낸 싸움</text>
<text x="1552.0" y="84.0" font-size="26" fill="#0096b8" text-anchor="end" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">정리 그림</text>
<rect x="48" y="152" width="64" height="4" fill="#00d0ff"/>
<line x1="112" y1="154" x2="1552" y2="154" stroke="#2a2c2d" stroke-opacity="0.18" stroke-width="1"/>
<rect x="48" y="180" width="960" height="770" fill="#ffffff" stroke="#2a2c2d" stroke-opacity="0.55" stroke-width="0.5"/>
<rect x="92" y="236" width="230" height="120" fill="#ffffff" stroke="#2a2c2d" stroke-opacity="0.55" stroke-width="0.5"/>
<text x="207.0" y="288.0" font-size="32" fill="#2a2c2d" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">금산</text>
<text x="207.0" y="330.0" font-size="25" fill="#5d6365" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">일본군이 머문 곳</text>
<line x1="330" y1="296.0" x2="388" y2="296.0" stroke="#0096b8" stroke-width="3" stroke-dasharray="" marker-end="url(#ah)"/>
<rect x="398" y="236" width="230" height="120" fill="#effbff" stroke="#0096b8" stroke-opacity="1" stroke-width="1.5"/>
<text x="513.0" y="288.0" font-size="32" fill="#2a2c2d" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">이치(배재)</text>
<text x="513.0" y="330.0" font-size="25" fill="#5d6365" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">권율·황진이 막음</text>
<line x1="636" y1="296.0" x2="694" y2="296.0" stroke="#0096b8" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#ah)"/>
<rect x="704" y="236" width="230" height="120" fill="#ffffff" stroke="#2a2c2d" stroke-opacity="0.55" stroke-width="0.5"/>
<text x="819.0" y="288.0" font-size="32" fill="#2a2c2d" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">전주</text>
<text x="819.0" y="330.0" font-size="25" fill="#5d6365" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">전라도의 중심</text>
<g stroke="#7a62d6" stroke-width="5" stroke-linecap="round"><line x1="649" y1="280.0" x2="681" y2="312.0"/><line x1="681" y1="280.0" x2="649" y2="312.0"/></g>
<text x="92.0" y="406.0" font-size="26" fill="#7a62d6" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">일본군의 진로 — 이치에서 막혀 전주로 넘어가지 못함</text>
<line x1="94" y1="580" x2="94" y2="800" stroke="#00d0ff" stroke-width="1.5"/>
<rect x="80" y="498" width="900" height="44" fill="#2a2c2d" fill-opacity="0.04"/>
<rect x="80" y="498" width="5" height="44" fill="#7a62d6"/>
<text x="102.0" y="529.0" font-size="26" fill="#7a62d6" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">1592년(선조 25) 7월 8일</text>
<rect x="114" y="554" width="866" height="92" fill="#effbff" stroke="#00d0ff" stroke-width="0.5"/>
<circle cx="94" cy="580" r="7" fill="#00d0ff" stroke="#ffffff" stroke-width="2"/><circle cx="94" cy="580" r="8.5" fill="none" stroke="#2a2c2d" stroke-width="0.6"/>
<text x="128.0" y="590.0" font-size="29" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">지휘</text>
<text x="250.0" y="590.0" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">권율(전라도 도절제사)·황진(동복 현감)</text>
<text x="250.0" y="630.0" font-size="26" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">관군 1,500명</text>
<circle cx="94" cy="690" r="7" fill="#00d0ff" stroke="#ffffff" stroke-width="2"/><circle cx="94" cy="690" r="8.5" fill="none" stroke="#2a2c2d" stroke-width="0.6"/>
<text x="128.0" y="700.0" font-size="29" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">싸움</text>
<text x="250.0" y="700.0" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">황진이 총에 맞아 쓰러진 뒤에도</text>
<text x="250.0" y="740.0" font-size="26" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">권율이 장병을 독려하여 막아 냄</text>
<rect x="114" y="774" width="866" height="52" fill="#effbff" stroke="#00d0ff" stroke-width="0.5"/>
<circle cx="94" cy="800" r="7" fill="#00d0ff" stroke="#ffffff" stroke-width="2"/><circle cx="94" cy="800" r="8.5" fill="none" stroke="#2a2c2d" stroke-width="0.6"/>
<text x="128.0" y="810.0" font-size="29" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">결과</text>
<text x="250.0" y="810.0" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">일본군을 물리치고 전주 진출을 저지</text>
<rect x="1040" y="180" width="512" height="360" fill="#ffffff" stroke="#2a2c2d" stroke-opacity="0.55" stroke-width="0.5"/>
<rect x="1040.25" y="180.25" width="511.5" height="58" fill="#effbff"/>
<rect x="1040" y="180" width="5" height="58" fill="#00d0ff"/>
<line x1="1040" y1="238" x2="1552" y2="238" stroke="#00d0ff" stroke-width="0.5"/>
<text x="1066.0" y="219.8" font-size="30" fill="#2a2c2d" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">전투의 의의</text>
<circle cx="1072" cy="278.3" r="4" fill="#0096b8"/>
<text x="1088.0" y="288.0" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">전라도가 지켜짐</text>
<circle cx="1072" cy="332.3" r="4" fill="#0096b8"/>
<text x="1088.0" y="342.0" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">후방 병참 기지 구실을 함</text>
<circle cx="1072" cy="386.3" r="4" fill="#0096b8"/>
<text x="1088.0" y="396.0" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">같은 무렵 웅치·금산 전투</text>
<rect x="1040" y="572" width="512" height="378" fill="#ffffff" stroke="#2a2c2d" stroke-opacity="0.55" stroke-width="0.5"/>
<rect x="1040.25" y="572.25" width="511.5" height="58" fill="#effbff"/>
<rect x="1040" y="572" width="5" height="58" fill="#7a62d6"/>
<line x1="1040" y1="630" x2="1552" y2="630" stroke="#00d0ff" stroke-width="0.5"/>
<text x="1066.0" y="611.8" font-size="30" fill="#2a2c2d" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">시험에 나오는 단서</text>
<circle cx="1072" cy="670.3" r="4" fill="#0096b8"/>
<text x="1088.0" y="680.0" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">권율·황진</text>
<circle cx="1072" cy="726.3" r="4" fill="#0096b8"/>
<text x="1088.0" y="736.0" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">이치(배재)</text>
<circle cx="1072" cy="782.3" r="4" fill="#0096b8"/>
<text x="1088.0" y="792.0" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">금산에서 전주로</text>
<circle cx="1072" cy="838.3" r="4" fill="#0096b8"/>
<text x="1088.0" y="848.0" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">전라도 보존</text>
</svg>
