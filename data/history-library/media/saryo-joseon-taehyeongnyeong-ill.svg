<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img">
<title>조선 태형령(1912) — 1910년대 무단 통치의 틀</title>
<desc>조선 총독에서 헌병 경찰과 제령(범죄즉결례·조선태형령)으로 이어져 재판 없는 즉결 처분과 태형에 이르는 구조도, 조선인에게만 적용된다는 제13조, 1910년부터 1920년 폐지까지의 연표.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0096b8"/></marker></defs>
<rect width="1600" height="1000" fill="#effbff"/>
<text x="60" y="92" font-size="50" fill="#2a2c2d" text-anchor="start" font-family="'Noto Serif KR','AppleMyungjo',serif" font-weight="700">조선 태형령(1912) — 1910년대 무단 통치의 틀</text>
<text x="60" y="140" font-size="28" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">조선 총독 아래 헌병 경찰이 재판 없이 처벌하던 구조</text>
<text x="1540" y="92" font-size="28" fill="#0096b8" text-anchor="end" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">정리 그림</text>
<line x1="60" y1="166" x2="1540" y2="166" stroke="#00d0ff" stroke-width="1"/>

<rect x="430" y="192" width="740" height="160" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="430.5" y="192.5" width="739" height="58" fill="#ccf6ff"/>
<text x="454" y="233" font-size="32" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','AppleMyungjo',serif" font-weight="700">조선 총독</text>
<text x="454" y="295" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">일본 육·해군 대장 가운데 임명</text>
<text x="454" y="336" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">행정·입법·사법·군대 통수권을 함께 쥠</text>
<line x1="640" y1="356" x2="420" y2="410" stroke="#0096b8" stroke-width="1.2" marker-end="url(#ah)"/>
<line x1="960" y1="356" x2="1180" y2="410" stroke="#0096b8" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="1196" y="272" font-size="28" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">총독의 명령</text>
<text x="1196" y="312" font-size="28" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">= 제령(制令)</text>
<text x="404" y="272" font-size="28" fill="#5d6365" text-anchor="end" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">헌병 경찰을</text>
<text x="404" y="312" font-size="28" fill="#5d6365" text-anchor="end" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">지휘</text>
<rect x="60" y="414" width="700" height="205" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="60.5" y="414.5" width="699" height="58" fill="#ccf6ff"/>
<text x="84" y="455" font-size="32" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','AppleMyungjo',serif" font-weight="700">헌병 경찰 · 1910년 9월~</text>
<text x="84" y="517" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">헌병이 일반 경찰 업무까지 맡음</text>
<text x="84" y="558" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">경찰서장·헌병대장이</text>
<text x="84" y="599" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">재판 없이 즉결로 처벌</text>
<rect x="840" y="414" width="700" height="205" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="840.5" y="414.5" width="699" height="58" fill="#ccf6ff"/>
<text x="864" y="455" font-size="32" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','AppleMyungjo',serif" font-weight="700">범죄즉결례 · 조선태형령</text>
<text x="864" y="517" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">1910년 12월 범죄즉결례</text>
<text x="864" y="558" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">1912년 3월 조선태형령</text>
<text x="864" y="599" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">3개월 이하 징역·100원 이하 벌금 대상</text>
<line x1="410" y1="623" x2="640" y2="676" stroke="#0096b8" stroke-width="1.2" marker-end="url(#ah)"/>
<line x1="1190" y1="623" x2="960" y2="676" stroke="#0096b8" stroke-width="1.2" marker-end="url(#ah)"/>
<rect x="330" y="680" width="940" height="164" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="330.5" y="680.5" width="939" height="58" fill="#ccf6ff"/>
<text x="354" y="721" font-size="32" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','AppleMyungjo',serif" font-weight="700">즉결 처분 → 태형으로 바꿔 집행</text>
<text x="354" y="783" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">징역 1일 또는 벌금 1원을 태 1대로 셈</text>
<text x="354" y="824" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">재판소의 재판을 거치지 않음</text>
<rect x="1300" y="680" width="240" height="164" fill="#ccf6ff" stroke="#0096b8" stroke-width="1"/>
<text x="1420" y="730" font-size="34" fill="#0096b8" text-anchor="middle" font-family="'Noto Serif KR','AppleMyungjo',serif" font-weight="700">제13조</text>
<text x="1420" y="776" font-size="30" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">조선인에게만</text>
<text x="1420" y="816" font-size="30" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">적용</text>
<rect x="60" y="680" width="240" height="164" fill="#ccf6ff" stroke="#0096b8" stroke-width="1"/>
<text x="180" y="730" font-size="30" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">일본인은</text>
<text x="180" y="772" font-size="30" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">대상에서 빠짐</text>
<text x="180" y="816" font-size="30" fill="#0096b8" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">→ 민족 차별</text>
<line x1="90" y1="920" x2="1510" y2="920" stroke="#00d0ff" stroke-width="1"/>
<circle cx="160" cy="920" r="9" fill="#00d0ff" stroke="#2a2c2d" stroke-width="1"/>
<text x="180" y="906" font-size="30" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','AppleMyungjo',serif" font-weight="700">1910</text>
<text x="180" y="962" font-size="30" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">헌병 경찰</text>
<circle cx="560" cy="920" r="9" fill="#00d0ff" stroke="#2a2c2d" stroke-width="1"/>
<text x="580" y="906" font-size="30" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','AppleMyungjo',serif" font-weight="700">1912</text>
<text x="580" y="962" font-size="30" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">조선태형령</text>
<circle cx="960" cy="920" r="9" fill="#00d0ff" stroke="#2a2c2d" stroke-width="1"/>
<text x="980" y="906" font-size="30" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','AppleMyungjo',serif" font-weight="700">1919</text>
<text x="980" y="962" font-size="30" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">3·1 운동</text>
<circle cx="1360" cy="920" r="9" fill="#00d0ff" stroke="#2a2c2d" stroke-width="1"/>
<text x="1380" y="906" font-size="30" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','AppleMyungjo',serif" font-weight="700">1920</text>
<text x="1380" y="962" font-size="30" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">태형령 폐지</text>
</svg>
