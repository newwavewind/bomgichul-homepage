<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">
<title>신라 하대 희강왕·민애왕·신무왕의 왕위 다툼 흐름</title>
<rect width="960" height="600" fill="#ffffff"/>
<text x="480.0" y="52" text-anchor="middle" font-size="30" font-weight="700" fill="#1b2a4a">신라 하대의 왕위 다툼 — 희강왕 · 민애왕 · 신무왕</text>
<text x="480.0" y="84" text-anchor="middle" font-size="17" font-weight="400" fill="#5b6475">『삼국사기』 신라본기 민애왕 · 진골 귀족끼리 왕위를 빼앗고 빼앗긴 흐름</text>
<rect x="60" y="118" width="840" height="86" rx="10" fill="#ffffff" stroke="#0096d6" stroke-width="2"/>
<rect x="61" y="119" width="150" height="84" rx="9" fill="#e3f5fd"/>
<text x="136" y="158" text-anchor="middle" font-size="22" font-weight="700" fill="#0096d6">836</text>
<text x="136" y="184" text-anchor="middle" font-size="16" font-weight="700" fill="#1b2a4a">희강왕 즉위</text>
<text x="560" y="156" text-anchor="middle" font-size="19" font-weight="400" fill="#1b2a4a">김제륭이 왕위 다툼에서 이겨 즉위</text>
<text x="560" y="184" text-anchor="middle" font-size="19" font-weight="400" fill="#1b2a4a">김우징의 아버지 김균정은 죽음</text>
<line x1="480" y1="206" x2="480" y2="222" stroke="#0096d6" stroke-width="3" stroke-linecap="round"/>
<path d="M474.8 211.2 L480 222 L485.2 211.2" fill="none" stroke="#0096d6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="60" y="224" width="840" height="86" rx="10" fill="#ffffff" stroke="#0096d6" stroke-width="2"/>
<rect x="61" y="225" width="150" height="84" rx="9" fill="#e3f5fd"/>
<text x="136" y="264" text-anchor="middle" font-size="22" font-weight="700" fill="#0096d6">838</text>
<text x="136" y="290" text-anchor="middle" font-size="16" font-weight="700" fill="#1b2a4a">민애왕 즉위</text>
<text x="560" y="262" text-anchor="middle" font-size="19" font-weight="400" fill="#1b2a4a">상대등 김명이 시중 이홍과 함께</text>
<text x="560" y="290" text-anchor="middle" font-size="19" font-weight="400" fill="#1b2a4a">희강왕을 몰아붙여 죽게 하고 즉위</text>
<line x1="480" y1="312" x2="480" y2="328" stroke="#0096d6" stroke-width="3" stroke-linecap="round"/>
<path d="M474.8 317.2 L480 328 L485.2 317.2" fill="none" stroke="#0096d6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="60" y="330" width="840" height="86" rx="10" fill="#ffffff" stroke="#0096d6" stroke-width="2"/>
<rect x="61" y="331" width="150" height="84" rx="9" fill="#e3f5fd"/>
<text x="136" y="370" text-anchor="middle" font-size="22" font-weight="700" fill="#0096d6">838~839</text>
<text x="136" y="396" text-anchor="middle" font-size="16" font-weight="700" fill="#1b2a4a">청해진의 군사</text>
<text x="560" y="368" text-anchor="middle" font-size="19" font-weight="400" fill="#1b2a4a">김우징이 청해진 대사 장보고(궁복)에게</text>
<text x="560" y="396" text-anchor="middle" font-size="19" font-weight="400" fill="#1b2a4a">군사를 빌려 원수를 갚겠다고 함</text>
<line x1="480" y1="418" x2="480" y2="434" stroke="#0096d6" stroke-width="3" stroke-linecap="round"/>
<path d="M474.8 423.2 L480 434 L485.2 423.2" fill="none" stroke="#0096d6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="60" y="436" width="840" height="86" rx="10" fill="#ffffff" stroke="#0096d6" stroke-width="2"/>
<rect x="61" y="437" width="150" height="84" rx="9" fill="#e3f5fd"/>
<text x="136" y="476" text-anchor="middle" font-size="22" font-weight="700" fill="#0096d6">839</text>
<text x="136" y="502" text-anchor="middle" font-size="16" font-weight="700" fill="#1b2a4a">신무왕 즉위</text>
<text x="560" y="474" text-anchor="middle" font-size="19" font-weight="400" fill="#1b2a4a">장보고 군사의 도움으로 민애왕을 죽이고</text>
<text x="560" y="502" text-anchor="middle" font-size="19" font-weight="400" fill="#1b2a4a">김우징이 왕이 됨</text>
<rect x="60" y="548" width="840" height="52" rx="10" fill="#e3f5fd" stroke="#e3f5fd" stroke-width="0"/>
<text x="480" y="581" text-anchor="middle" font-size="17" font-weight="400" fill="#1b2a4a">863년 경문왕 때 민애왕을 추모하는 석탑을 세우고 그 내력을 새긴 납석 사리호를 넣음(보물)</text>
</svg>
