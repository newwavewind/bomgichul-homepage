<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 1000" role="img">
<title>무단 통치기의 헌병 경찰(1910년대)</title>
<desc>왼쪽은 1910년 9월 10일 만든 헌병 경찰 제도에서 헌병 계급이 경찰 직위를 겸한 대응표와 1911년 헌병 경찰 관서·인원 수, 오른쪽 위는 1910년 12월 범죄 즉결례로 경찰서장·헌병대장이 재판 없이 처벌한 내용, 오른쪽 아래는 관리와 교원까지 제복을 입고 칼을 찬 모습과 3·1 운동 뒤 보통 경찰제로 바뀌었으나 경찰은 오히려 늘어난 사실을 정리한 그림.</desc>
<defs>
<marker id="ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="5.5" markerHeight="5.5" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M1 1.5 L11 6 L1 10.5 L3.6 6 z" fill="#0096b8"/></marker>
<marker id="ahl" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="5.5" markerHeight="5.5" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M1 1.5 L11 6 L1 10.5 L3.6 6 z" fill="#7a62d6"/></marker>
<radialGradient id="glow"><stop offset="0" stop-color="#00d0ff" stop-opacity="0.55"/><stop offset="0.45" stop-color="#00d0ff" stop-opacity="0.2"/><stop offset="1" stop-color="#00d0ff" stop-opacity="0"/></radialGradient>
<filter id="plate" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#2a2c2d" flood-opacity="0.16"/></filter>
<filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
<rect width="1600" height="1000" fill="#effbff"/>
<text x="60.0" y="92.0" font-size="48" fill="#2a2c2d" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">무단 통치기의 헌병 경찰(1910년대)</text>
<text x="60.0" y="140.0" font-size="28" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">헌병이 경찰 일까지 맡고 · 재판 없이 즉결 처분하던 구조</text>
<text x="1540.0" y="92.0" font-size="28" fill="#0096b8" text-anchor="end" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">정리 그림</text>
<line x1="60" y1="166" x2="1540" y2="166" stroke="#00d0ff" stroke-width="1"/>
<rect x="60" y="190" width="720" height="560" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="60.5" y="190.5" width="719" height="58" fill="#ccf6ff"/>
<text x="84.0" y="230.5" font-size="32" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">헌병 경찰 제도 · 1910.9.10</text>
<text x="100.0" y="300.0" font-size="27" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">헌병</text>
<text x="510.0" y="300.0" font-size="27" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">경찰</text>
<rect x="90" y="330" width="300" height="56" fill="#ccf6ff" stroke="#00d0ff" stroke-width="1"/>
<text x="240.0" y="368.0" font-size="28" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">헌병 사령관</text>
<line x1="400" y1="358" x2="464" y2="358" stroke="#0096b8" stroke-width="2" marker-end="url(#ah)"/>
<rect x="472" y="330" width="280" height="56" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<text x="612.0" y="368.0" font-size="28" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">경무 총감</text>
<rect x="90" y="406" width="300" height="56" fill="#ccf6ff" stroke="#00d0ff" stroke-width="1"/>
<text x="240.0" y="444.0" font-size="28" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">각 도 헌병 대장</text>
<line x1="400" y1="434" x2="464" y2="434" stroke="#0096b8" stroke-width="2" marker-end="url(#ah)"/>
<rect x="472" y="406" width="280" height="56" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<text x="612.0" y="444.0" font-size="28" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">도 경무 부장</text>
<rect x="90" y="482" width="300" height="56" fill="#ccf6ff" stroke="#00d0ff" stroke-width="1"/>
<text x="240.0" y="520.0" font-size="28" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">위관(장교)</text>
<line x1="400" y1="510" x2="464" y2="510" stroke="#0096b8" stroke-width="2" marker-end="url(#ah)"/>
<rect x="472" y="482" width="280" height="56" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<text x="612.0" y="520.0" font-size="28" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">경시</text>
<rect x="90" y="558" width="300" height="56" fill="#ccf6ff" stroke="#00d0ff" stroke-width="1"/>
<text x="240.0" y="596.0" font-size="28" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">하사관</text>
<line x1="400" y1="586" x2="464" y2="586" stroke="#0096b8" stroke-width="2" marker-end="url(#ah)"/>
<rect x="472" y="558" width="280" height="56" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<text x="612.0" y="596.0" font-size="28" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">경부</text>
<rect x="90" y="634" width="300" height="56" fill="#ccf6ff" stroke="#00d0ff" stroke-width="1"/>
<text x="240.0" y="672.0" font-size="28" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">사병</text>
<line x1="400" y1="662" x2="464" y2="662" stroke="#0096b8" stroke-width="2" marker-end="url(#ah)"/>
<rect x="472" y="634" width="280" height="56" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<text x="612.0" y="672.0" font-size="28" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">순사</text>
<text x="90.0" y="734.0" font-size="27" fill="#0096b8" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">헌병이 일반 국민의 경찰 업무까지 맡음</text>
<rect x="60" y="774" width="720" height="156" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<text x="84.0" y="823.0" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">1911년 헌병 경찰 관서 1,602곳</text>
<text x="84.0" y="863.6" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">헌병과 경찰을 합쳐 1만 3,971명</text>
<rect x="820" y="190" width="720" height="300" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="820.5" y="190.5" width="719" height="58" fill="#ccf6ff"/>
<text x="844.0" y="230.5" font-size="32" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">범죄 즉결례 · 1910.12.3</text>
<text x="844.0" y="293.0" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">경찰서장 · 헌병 대장이</text>
<text x="844.0" y="333.0" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">징역 3개월 이하 · 벌금 100원 이하를</text>
<text x="844.0" y="373.0" font-size="29" fill="#0096b8" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">재판 없이 즉결로 처분</text>
<text x="844.0" y="413.1" font-size="29" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">대상 87개 조항 · 일상생활 거의 모두</text>
<rect x="820" y="510" width="720" height="200" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="820.5" y="510.5" width="719" height="58" fill="#ccf6ff"/>
<text x="844.0" y="550.5" font-size="32" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">제복과 칼</text>
<text x="844.0" y="613.0" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">총독부 관리는 물론</text>
<text x="844.0" y="655.0" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">학교 교원까지 제복을 입고 칼을 참</text>
<rect x="820" y="730" width="720" height="200" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="820.5" y="730.5" width="719" height="58" fill="#ccf6ff"/>
<text x="844.0" y="770.5" font-size="32" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">3 · 1 운동 뒤</text>
<text x="844.0" y="833.0" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">헌병 경찰제 → 보통 경찰제로 바뀜</text>
<text x="844.0" y="875.0" font-size="29" fill="#0096b8" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">1920년 관서 2,761곳 · 1만 8,400명으로 늘어남</text>
</svg>
