<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">
<title>윤심덕의 「사의 찬미」(1926)</title>
<rect width="960" height="600" fill="#ffffff"/>
<text x="480.0" y="52" text-anchor="middle" font-size="30" font-weight="700" fill="#1b2a4a">윤심덕의 「사의 찬미」(1926)</text>
<text x="480.0" y="84" text-anchor="middle" font-size="17" font-weight="400" fill="#5b6475">외국 곡에 우리말 가사를 붙인 노래가 음반으로 널리 퍼지다</text>
<rect x="30" y="120" width="250" height="130" rx="10" fill="#ffffff" stroke="#9fdcf5" stroke-width="2"/>
<text x="155.0" y="166.1" text-anchor="middle" font-size="19" font-weight="700" fill="#0096d6">원곡</text>
<text x="155.0" y="191.6" text-anchor="middle" font-size="17" font-weight="400" fill="#1b2a4a">이바노비치 작곡</text>
<text x="155.0" y="216.3" text-anchor="middle" font-size="17" font-weight="400" fill="#1b2a4a">「도나우강의 잔물결」</text>
<rect x="30" y="280" width="250" height="130" rx="10" fill="#ffffff" stroke="#9fdcf5" stroke-width="2"/>
<text x="155.0" y="326.1" text-anchor="middle" font-size="19" font-weight="700" fill="#0096d6">가사</text>
<text x="155.0" y="351.6" text-anchor="middle" font-size="17" font-weight="400" fill="#1b2a4a">윤심덕이 스스로 붙임</text>
<text x="155.0" y="376.3" text-anchor="middle" font-size="17" font-weight="400" fill="#1b2a4a">인생의 쓸쓸함과 허무</text>
<line x1="286" y1="185" x2="352" y2="240" stroke="#0096d6" stroke-width="2.5" stroke-linecap="round"/>
<path d="M341.3 237.3 L352 240 L347.5 230.0" fill="none" stroke="#0096d6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="286" y1="345" x2="352" y2="290" stroke="#0096d6" stroke-width="2.5" stroke-linecap="round"/>
<path d="M347.5 300.0 L352 290 L341.3 292.7" fill="none" stroke="#0096d6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="360" y="170" width="260" height="170" rx="10" fill="#eaf7fd" stroke="#0096d6" stroke-width="2"/>
<text x="490.0" y="225.3" text-anchor="middle" font-size="24" font-weight="700" fill="#1b2a4a">「사의 찬미」</text>
<text x="490.0" y="252.9" text-anchor="middle" font-size="17" font-weight="400" fill="#1b2a4a">1926년 녹음</text>
<text x="490.0" y="277.6" text-anchor="middle" font-size="17" font-weight="400" fill="#1b2a4a">일본 닛토 레코드</text>
<text x="490.0" y="302.2" text-anchor="middle" font-size="17" font-weight="700" fill="#0096d6">축음기 음반</text>
<line x1="626" y1="255" x2="676" y2="255" stroke="#0096d6" stroke-width="2.5" stroke-linecap="round"/>
<path d="M666.1 259.8 L676 255 L666.1 250.2" fill="none" stroke="#0096d6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="684" y="150" width="246" height="210" rx="10" fill="#ffffff" stroke="#9fdcf5" stroke-width="2"/>
<text x="807.0" y="211.5" text-anchor="middle" font-size="19" font-weight="700" fill="#0096d6">크게 팔림</text>
<text x="807.0" y="237.0" text-anchor="middle" font-size="17" font-weight="400" fill="#1b2a4a">대중가요 음반이</text>
<text x="807.0" y="261.6" text-anchor="middle" font-size="17" font-weight="400" fill="#1b2a4a">퍼지는 계기</text>
<text x="807.0" y="286.3" text-anchor="middle" font-size="17" font-weight="400" fill="#1b2a4a">윤심덕의 죽음이</text>
<text x="807.0" y="310.9" text-anchor="middle" font-size="17" font-weight="400" fill="#1b2a4a">알려져 더 많이 팔림</text>
<rect x="30" y="440" width="440" height="140" rx="10" fill="#ffffff" stroke="#9fdcf5" stroke-width="2"/>
<text x="50" y="478.8" text-anchor="start" font-size="19" font-weight="700" fill="#1b2a4a">윤심덕(1897~1926)</text>
<text x="50" y="504.3" text-anchor="start" font-size="17" font-weight="400" fill="#1b2a4a">평양 출생 · 도쿄 음악 학교 성악</text>
<text x="50" y="529.0" text-anchor="start" font-size="17" font-weight="400" fill="#1b2a4a">1923년 귀국 독창회로 이름을 알림</text>
<text x="50" y="553.6" text-anchor="start" font-size="17" font-weight="400" fill="#1b2a4a">1926년 김우진과 귀국길 현해탄에서 사망</text>
<rect x="495" y="440" width="435" height="140" rx="10" fill="#ffffff" stroke="#9fdcf5" stroke-width="2" stroke-dasharray="6 5"/>
<text x="712.5" y="491.1" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2a4a">시대 배경</text>
<text x="712.5" y="516.6" text-anchor="middle" font-size="17" font-weight="400" fill="#1b2a4a">라디오 · 축음기가 퍼진</text>
<text x="712.5" y="541.3" text-anchor="middle" font-size="17" font-weight="400" fill="#1b2a4a">일제 강점기 대중문화</text>
</svg>
