<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 1000" role="img">
<title>고국천왕의 진대법(194)</title>
<desc>위는 진대법이 생긴 까닭, 가운데는 1월부터 12월까지 한 해 가운데 봄 3월~가을 7월에 나라 곡식을 빌려주고 겨울 10월에 돌려받는 시기를 표시한 띠, 아래는 진대법이 고려의 의창·조선의 환곡으로 이어진 흐름을 정리한 그림.</desc>
<defs>
<marker id="ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="5.5" markerHeight="5.5" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M1 1.5 L11 6 L1 10.5 L3.6 6 z" fill="#0096b8"/></marker>
<marker id="ahl" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="5.5" markerHeight="5.5" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M1 1.5 L11 6 L1 10.5 L3.6 6 z" fill="#7a62d6"/></marker>
<filter id="plate" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#2a2c2d" flood-opacity="0.16"/></filter>
</defs>
<rect width="1600" height="1000" fill="#effbff"/>
<text x="60" y="92" font-size="48" fill="#2a2c2d" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">고국천왕의 진대법(194)</text>
<text x="60" y="140" font-size="28" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">을파소를 국상으로 쓴 고국천왕 때 만든 빈민 구제 제도</text>
<text x="1540" y="92" font-size="28" fill="#0096b8" text-anchor="end" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">정리 그림</text>
<line x1="60" y1="166" x2="1540" y2="166" stroke="#00d0ff" stroke-width="1"/>
<rect x="60" y="196" width="1480" height="130" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="60.5" y="196.5" width="1479" height="58" fill="#ccf6ff"/>
<text x="84" y="236" font-size="31" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">왜 만들었나</text>
<text x="84" y="300" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">194년 7월 서리로 곡식이 상해 백성이 굶주림  →  왕이 사냥길에 품을 팔지 못해 우는 사람을 만남</text>
<text x="60" y="370" font-size="30" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">한 해의 흐름</text>
<rect x="100.0" y="390" width="110.7" height="74" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<text x="155.3" y="438" font-size="28" fill="#5d6365" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">1월</text>
<rect x="216.7" y="390" width="110.7" height="74" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<text x="272.1" y="438" font-size="28" fill="#5d6365" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">2월</text>
<rect x="333.4" y="390" width="110.7" height="74" fill="#ccf6ff" stroke="#0096b8" stroke-width="1.5"/>
<text x="388.8" y="438" font-size="28" fill="#0096b8" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">3월</text>
<rect x="450.1" y="390" width="110.7" height="74" fill="#ccf6ff" stroke="#0096b8" stroke-width="1.5"/>
<text x="505.5" y="438" font-size="28" fill="#0096b8" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">4월</text>
<rect x="566.8" y="390" width="110.7" height="74" fill="#ccf6ff" stroke="#0096b8" stroke-width="1.5"/>
<text x="622.1" y="438" font-size="28" fill="#0096b8" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">5월</text>
<rect x="683.5" y="390" width="110.7" height="74" fill="#ccf6ff" stroke="#0096b8" stroke-width="1.5"/>
<text x="738.9" y="438" font-size="28" fill="#0096b8" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">6월</text>
<rect x="800.2" y="390" width="110.7" height="74" fill="#ccf6ff" stroke="#0096b8" stroke-width="1.5"/>
<text x="855.6" y="438" font-size="28" fill="#0096b8" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">7월</text>
<rect x="916.9" y="390" width="110.7" height="74" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<text x="972.2" y="438" font-size="28" fill="#5d6365" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">8월</text>
<rect x="1033.6" y="390" width="110.7" height="74" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<text x="1088.9" y="438" font-size="28" fill="#5d6365" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">9월</text>
<rect x="1150.3" y="390" width="110.7" height="74" fill="#e9e3fb" stroke="#7a62d6" stroke-width="1.5"/>
<text x="1205.6" y="438" font-size="28" fill="#7a62d6" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">10월</text>
<rect x="1267.0" y="390" width="110.7" height="74" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<text x="1322.3" y="438" font-size="28" fill="#5d6365" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">11월</text>
<rect x="1383.7" y="390" width="110.7" height="74" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<text x="1439.0" y="438" font-size="28" fill="#5d6365" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">12월</text>
<path d="M333.4 482 V502 H910.9 V482" fill="none" stroke="#0096b8" stroke-width="2"/>
<text x="622.1" y="548" font-size="29" fill="#0096b8" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">봄 3월 ~ 가을 7월 : 나라 창고의 곡식(관곡)을 빌려줌</text>
<text x="622.1" y="590" font-size="27" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">식구가 많고 적음에 따라 차등을 둠</text>
<line x1="1205.6" y1="620" x2="1205.6" y2="474" stroke="#7a62d6" stroke-width="2" marker-end="url(#ahl)"/>
<text x="1205.6" y="660" font-size="29" fill="#7a62d6" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">겨울 10월 : 거두어 돌려받음</text>
<text x="1205.6" y="700" font-size="26" fill="#5d6365" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">(추수 뒤에 갚음)</text>
<text x="622.1" y="632" font-size="26" fill="#5d6365" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">곡식이 떨어지는 춘궁기</text>
<rect x="60" y="760" width="1480" height="180" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<text x="90" y="812" font-size="30" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">이어진 제도</text>
<rect x="150" y="840" width="320" height="70" fill="#ccf6ff" stroke="#00d0ff" stroke-width="0.8"/>
<text x="310.0" y="885.8" font-size="30" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">고구려 · 진대법</text>
<line x1="480" y1="875" x2="630" y2="875" stroke="#0096b8" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="640" y="840" width="320" height="70" fill="#ccf6ff" stroke="#00d0ff" stroke-width="0.8"/>
<text x="800.0" y="885.8" font-size="30" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">고려 · 의창</text>
<line x1="970" y1="875" x2="1120" y2="875" stroke="#0096b8" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="1130" y="840" width="320" height="70" fill="#ccf6ff" stroke="#00d0ff" stroke-width="0.8"/>
<text x="1290.0" y="885.8" font-size="30" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">조선 · 환곡</text>
<text x="1520" y="812" font-size="25" fill="#5d6365" text-anchor="end" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">「해마다 정해진 법으로 삼으니 안팎이 크게 기뻐하였다」</text>
</svg>
