<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img">
<title>7 · 4 남북 공동 성명(1972) — 통일 3대 원칙</title>
<desc>위는 1972년 5월 비밀 방문에서 7월 4일 동시 발표, 남북 조절 위원회 구성, 1973년 8월 대화 중단까지의 흐름, 가운데는 자주·평화·민족적 대단결의 세 원칙, 아래는 성명에 함께 담긴 합의 사항을 정리한 그림.</desc>
<defs><marker id="ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="5.5" markerHeight="5.5" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M1 1.5 L11 6 L1 10.5 L3.6 6 z" fill="#0096b8"/></marker></defs>
<rect width="1600" height="1000" fill="#effbff"/>
<text x="60" y="92" font-size="48" fill="#2a2c2d" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">7 · 4 남북 공동 성명(1972) — 통일 3대 원칙</text>
<text x="60" y="140" font-size="28" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">분단 뒤 남북 당국이 처음 합의한 문서 · 서울과 평양에서 같은 날 발표</text>
<text x="1540" y="92" font-size="28" fill="#0096b8" text-anchor="end" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">정리 그림</text>
<line x1="60" y1="166" x2="1540" y2="166" stroke="#00d0ff" stroke-width="1"/>
<rect x="60" y="190" width="1480" height="210" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<line x1="110" y1="290" x2="1490" y2="290" stroke="#00d0ff" stroke-width="1.2"/>
<circle cx="230" cy="290" r="9" fill="#00d0ff" stroke="#0096b8" stroke-width="1"/>
<text x="230" y="268" font-size="28" fill="#0096b8" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">1972.5</text>
<text x="230" y="334" font-size="25" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">이후락 평양 방문</text>
<text x="230" y="372" font-size="23" fill="#5d6365" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">박성철 서울 방문(5월 말)</text>
<circle cx="620" cy="290" r="9" fill="#00d0ff" stroke="#0096b8" stroke-width="1"/>
<text x="620" y="268" font-size="28" fill="#0096b8" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">1972.7.4</text>
<text x="620" y="334" font-size="25" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">공동 성명 발표</text>
<text x="620" y="372" font-size="23" fill="#5d6365" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">서울 · 평양 동시</text>
<circle cx="1000" cy="290" r="9" fill="#00d0ff" stroke="#0096b8" stroke-width="1"/>
<text x="1000" y="268" font-size="28" fill="#0096b8" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">합의에 따라</text>
<text x="1000" y="334" font-size="25" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">남북 조절 위원회</text>
<text x="1000" y="372" font-size="23" fill="#5d6365" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">남북 대화 기구</text>
<circle cx="1370" cy="290" r="9" fill="#00d0ff" stroke="#0096b8" stroke-width="1"/>
<text x="1370" y="268" font-size="28" fill="#0096b8" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">1973.8</text>
<text x="1370" y="334" font-size="25" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">대화 끊김</text>
<text x="1370" y="372" font-size="23" fill="#5d6365" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">북한이 회의 거부</text>
<rect x="460" y="226" width="320" height="160" fill="none" stroke="#0096b8" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="800" y="458" font-size="29" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">통일의 세 원칙 — 성명 제1항</text>
<rect x="60" y="484" width="480" height="210" fill="#ccf6ff" stroke="#00d0ff" stroke-width="1"/>
<text x="300" y="552" font-size="40" fill="#0096b8" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">자주</text>
<text x="300" y="612" font-size="26" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">외세에 기대거나 간섭받지 않고</text>
<text x="300" y="652" font-size="26" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">우리 스스로 해결</text>
<rect x="560" y="484" width="480" height="210" fill="#ccf6ff" stroke="#00d0ff" stroke-width="1"/>
<text x="800" y="552" font-size="40" fill="#0096b8" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">평화</text>
<text x="800" y="612" font-size="26" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">서로 무력을 쓰지 않고</text>
<text x="800" y="652" font-size="26" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">평화로운 방법으로</text>
<rect x="1060" y="484" width="480" height="210" fill="#ccf6ff" stroke="#00d0ff" stroke-width="1"/>
<text x="1300" y="552" font-size="40" fill="#0096b8" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">민족적 대단결</text>
<text x="1300" y="612" font-size="26" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">사상 · 이념 · 제도 차이를 넘어</text>
<text x="1300" y="652" font-size="26" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">먼저 한 민족으로 뭉침</text>
<text x="800" y="744" font-size="28" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">함께 합의한 내용</text>
<rect x="60" y="770" width="355" height="96" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<text x="237" y="828" font-size="26" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">서로 헐뜯는 일 그만두기</text>
<rect x="435" y="770" width="355" height="96" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<text x="612" y="828" font-size="26" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">여러 분야의 교류</text>
<rect x="810" y="770" width="355" height="96" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<text x="987" y="828" font-size="26" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">서울–평양 상설 직통 전화</text>
<rect x="1185" y="770" width="355" height="96" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<text x="1362" y="828" font-size="26" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">남북 조절 위원회 구성</text>
<text x="800" y="930" font-size="25" fill="#5d6365" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">※ 성명에는 이후락 중앙정보부장과 김영주 노동당 조직지도부장이 이름을 올림</text>
</svg>
