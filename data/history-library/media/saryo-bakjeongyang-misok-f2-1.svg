<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">
<title>초대 주미 공사 박정양과 『미속습유』</title>
<desc>1887년 주미 전권 공사 임명부터 국서 전달, 『미속습유』 집필, 1889년 귀국, 1898년 만민 공동회 참석까지를 잇는 연표와 자주 외교·청의 간섭·책 내용을 정리한 그림</desc>
<rect width="960" height="600" fill="#ffffff"/>
<text x="40" y="62" font-size="32" fill="#1c2b4a" text-anchor="start" font-weight="700">초대 주미 공사 박정양과 『미속습유』</text>
<text x="40" y="98" font-size="19" fill="#55627a" text-anchor="start">조선이 미국에 처음 보낸 상주 공사</text>
<text x="920" y="62" font-size="17" fill="#00a3d9" text-anchor="end" font-weight="700">정리 그림</text>
<line x1="40" y1="118" x2="920" y2="118" stroke="#00a3d9" stroke-width="2"/>
<rect x="40" y="160" width="880" height="175" rx="10" fill="#ffffff" stroke="#9fdcf2" stroke-width="1.5"/>
<line x1="70" y1="230" x2="890" y2="230" stroke="#00a3d9" stroke-width="3"/>
<circle cx="152" cy="230" r="8" fill="#ffffff" stroke="#00a3d9" stroke-width="3"/>
<text x="152" y="206" font-size="18" fill="#55627a" text-anchor="middle" font-weight="700">1887</text>
<text x="152" y="266" font-size="17" fill="#1c2b4a" text-anchor="middle">주미 전권</text>
<text x="152" y="291" font-size="17" fill="#1c2b4a" text-anchor="middle">공사가 됨</text>
<circle cx="316" cy="230" r="11" fill="#00a3d9" stroke="#00a3d9" stroke-width="3"/>
<text x="316" y="206" font-size="18" fill="#00a3d9" text-anchor="middle" font-weight="700">부임 뒤</text>
<text x="316" y="266" font-size="17" fill="#1c2b4a" text-anchor="middle" font-weight="700">클리블랜드에게</text>
<text x="316" y="291" font-size="17" fill="#1c2b4a" text-anchor="middle">고종 국서 전달</text>
<circle cx="480" cy="230" r="11" fill="#00a3d9" stroke="#00a3d9" stroke-width="3"/>
<text x="480" y="206" font-size="18" fill="#00a3d9" text-anchor="middle" font-weight="700">1888</text>
<text x="480" y="266" font-size="17" fill="#1c2b4a" text-anchor="middle" font-weight="700">미국 견문</text>
<text x="480" y="291" font-size="17" fill="#1c2b4a" text-anchor="middle">『미속습유』</text>
<circle cx="644" cy="230" r="8" fill="#ffffff" stroke="#00a3d9" stroke-width="3"/>
<text x="644" y="206" font-size="18" fill="#55627a" text-anchor="middle" font-weight="700">1889</text>
<text x="644" y="266" font-size="17" fill="#1c2b4a" text-anchor="middle">청의 압력으로</text>
<text x="644" y="291" font-size="17" fill="#1c2b4a" text-anchor="middle">귀국</text>
<circle cx="808" cy="230" r="8" fill="#ffffff" stroke="#00a3d9" stroke-width="3"/>
<text x="808" y="206" font-size="18" fill="#55627a" text-anchor="middle" font-weight="700">1898</text>
<text x="808" y="266" font-size="17" fill="#1c2b4a" text-anchor="middle">만민 공동회</text>
<text x="808" y="291" font-size="17" fill="#1c2b4a" text-anchor="middle">참석</text>
<rect x="40" y="370" width="280" height="170" rx="10" fill="#ffffff" stroke="#9fdcf2" stroke-width="1.5"/>
<rect x="40" y="370" width="280" height="46" rx="10" fill="#e3f6fd"/>
<rect x="40" y="400" width="280" height="16" fill="#e3f6fd"/>
<text x="180" y="401" font-size="19" fill="#0a6f94" text-anchor="middle" font-weight="700">고종의 뜻</text>
<text x="60" y="450" font-size="17" fill="#1c2b4a" text-anchor="start">청의 간섭에서 벗어난</text>
<text x="60" y="478" font-size="17" fill="#1c2b4a" text-anchor="start">자주 외교</text>
<text x="60" y="506" font-size="17" fill="#1c2b4a" text-anchor="start">→ 미국에 공사관을 엶</text>
<rect x="340" y="370" width="280" height="170" rx="10" fill="#ffffff" stroke="#9fdcf2" stroke-width="1.5"/>
<rect x="340" y="370" width="280" height="46" rx="10" fill="#e3f6fd"/>
<rect x="340" y="400" width="280" height="16" fill="#e3f6fd"/>
<text x="480" y="401" font-size="19" fill="#0a6f94" text-anchor="middle" font-weight="700">청의 방해</text>
<text x="360" y="450" font-size="17" fill="#1c2b4a" text-anchor="start">조선은 속국이라며 반대</text>
<text x="360" y="478" font-size="17" fill="#1c2b4a" text-anchor="start">「영약삼단」 세 가지</text>
<text x="360" y="506" font-size="17" fill="#1c2b4a" text-anchor="start">약속을 조건으로 허락</text>
<rect x="640" y="370" width="280" height="170" rx="10" fill="#ffffff" stroke="#9fdcf2" stroke-width="1.5"/>
<rect x="640" y="370" width="280" height="46" rx="10" fill="#e3f6fd"/>
<rect x="640" y="400" width="280" height="16" fill="#e3f6fd"/>
<text x="780" y="401" font-size="19" fill="#0a6f94" text-anchor="middle" font-weight="700">『미속습유』</text>
<text x="660" y="450" font-size="17" fill="#1c2b4a" text-anchor="start">미국에서 쓴 일기 바탕</text>
<text x="660" y="478" font-size="17" fill="#1c2b4a" text-anchor="start">미국의 땅과 역사</text>
<text x="660" y="506" font-size="17" fill="#1c2b4a" text-anchor="start">정부 제도와 풍속 소개</text>
<text x="480" y="570" font-size="16" fill="#55627a" text-anchor="middle">국서 전달 → 견문 기록 → 귀국 뒤 개혁 운동 참여</text>
</svg>
