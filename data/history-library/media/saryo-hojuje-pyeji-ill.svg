<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 1000" role="img">
<title>호주제 폐지(2005)</title>
<desc>왼쪽은 1960년 민법의 호주제 규정에서 헌법 재판소 결정, 민법 개정, 가족관계 등록부 시행까지의 흐름도, 오른쪽은 호적과 가족관계 등록부의 차이와 폐지를 둘러싼 찬반을 정리한 그림.</desc>
<defs>
<marker id="ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="5.5" markerHeight="5.5" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M1 1.5 L11 6 L1 10.5 L3.6 6 z" fill="#0096b8"/></marker>
</defs>
<rect width="1600" height="1000" fill="#effbff"/>
<text x="60" y="92" font-size="48" fill="#2a2c2d" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">호주제 폐지(2005)</text>
<text x="60" y="140" font-size="28" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">호주 중심의 가족 등록에서 개인 단위의 등록으로</text>
<text x="1540" y="92" font-size="28" fill="#0096b8" text-anchor="end" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">정리 그림</text>
<line x1="60" y1="166" x2="1540" y2="166" stroke="#00d0ff" stroke-width="1"/>
<rect x="60" y="200" width="860" height="76" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<text x="90" y="248" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">1960년 시행 민법에 호주 제도가 들어감</text>
<line x1="490" y1="278" x2="490" y2="318" stroke="#0096b8" stroke-width="2" marker-end="url(#ah)"/>
<rect x="60" y="322" width="860" height="76" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<text x="90" y="370" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">호주(집안의 우두머리)를 중심으로 가족을 등록</text>
<line x1="490" y1="400" x2="490" y2="440" stroke="#0096b8" stroke-width="2" marker-end="url(#ah)"/>
<rect x="60" y="444" width="860" height="76" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<text x="90" y="492" font-size="29" fill="#7a62d6" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">호주 승계에서 아들이 앞서 → 성차별 비판</text>
<line x1="490" y1="522" x2="490" y2="562" stroke="#0096b8" stroke-width="2" marker-end="url(#ah)"/>
<rect x="60" y="566" width="860" height="76" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<text x="90" y="614" font-size="29" fill="#0096b8" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">2005. 2. 3. 헌법 재판소 「헌법 불합치」 결정</text>
<line x1="490" y1="644" x2="490" y2="684" stroke="#0096b8" stroke-width="2" marker-end="url(#ah)"/>
<rect x="60" y="688" width="860" height="76" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<text x="90" y="736" font-size="29" fill="#0096b8" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">2005. 3. 2. 국회, 호주 제도를 뺀 민법 개정</text>
<line x1="490" y1="766" x2="490" y2="806" stroke="#0096b8" stroke-width="2" marker-end="url(#ah)"/>
<rect x="60" y="810" width="860" height="76" fill="#ccf6ff" stroke="#0096b8" stroke-width="1.5"/>
<text x="90" y="858" font-size="29" fill="#0096b8" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">2008. 1. 1. 시행 · 가족관계 등록부 도입</text>
<rect x="980" y="205" width="560" height="300" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="980.5" y="205.5" width="559" height="58" fill="#ccf6ff"/>
<text x="1004" y="245" font-size="29" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">호적과 가족관계 등록부</text>
<text x="1010" y="310" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">· 호적: 호주를 중심으로</text>
<text x="1036" y="360" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">한 「집」 단위로 묶어 적음</text>
<text x="1010" y="410" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">· 가족관계 등록부:</text>
<text x="1036" y="460" font-size="27" fill="#0096b8" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">사람마다 따로 적음(개인 단위)</text>
<rect x="980" y="555" width="560" height="340" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="980.5" y="555.5" width="559" height="58" fill="#ccf6ff"/>
<text x="1004" y="595" font-size="29" fill="#7a62d6" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">폐지를 둘러싼 찬반</text>
<text x="1010" y="660" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">· 찬성: 여성계 · 시민 단체</text>
<text x="1036" y="710" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">남녀평등에 어긋나는 제도</text>
<text x="1010" y="760" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">· 반대: 유림 등</text>
<text x="1036" y="810" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">전통 가족 제도 · 미풍양속을</text>
<text x="1036" y="860" font-size="27" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">지켜야 한다는 주장</text>
</svg>
