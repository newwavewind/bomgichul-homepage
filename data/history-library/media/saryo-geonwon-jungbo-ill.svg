<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 1000" role="img">
<title>건원중보(乾元重寶)</title>
<desc>왼쪽은 둥근 몸에 네모난 구멍이 뚫린 건원중보의 앞면(乾元重寶)과 뒷면(東國) 글자를 나타낸 모식도, 오른쪽은 주조에서 유통 중단까지의 흐름을 정리한 그림.</desc>
<defs>
<marker id="ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="5.5" markerHeight="5.5" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M1 1.5 L11 6 L1 10.5 L3.6 6 z" fill="#0096b8"/></marker>
<marker id="ahl" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="5.5" markerHeight="5.5" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M1 1.5 L11 6 L1 10.5 L3.6 6 z" fill="#7a62d6"/></marker>
<filter id="plate" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#2a2c2d" flood-opacity="0.16"/></filter>
</defs>
<rect width="1600" height="1000" fill="#effbff"/>
<text x="60" y="92" font-size="48" fill="#2a2c2d" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">건원중보(乾元重寶)</text>
<text x="60" y="140" font-size="28" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">성종 15년(996), 나라에서 처음 만든 쇠돈</text>
<text x="1540" y="92" font-size="28" fill="#0096b8" text-anchor="end" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">정리 그림</text>
<line x1="60" y1="166" x2="1540" y2="166" stroke="#00d0ff" stroke-width="1"/>
<circle cx="270" cy="470" r="175" fill="#ffffff" stroke="#0096b8" stroke-width="4" filter="url(#plate)"/>
<circle cx="270" cy="470" r="161" fill="none" stroke="#00d0ff" stroke-width="2"/>
<rect x="236" y="436" width="68" height="68" fill="#effbff" stroke="#0096b8" stroke-width="3"/>
<text x="270" y="384" font-size="64" fill="#2a2c2d" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">乾</text>
<text x="270" y="600" font-size="64" fill="#2a2c2d" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">元</text>
<text x="378" y="492" font-size="64" fill="#2a2c2d" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">重</text>
<text x="162" y="492" font-size="64" fill="#2a2c2d" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">寶</text>
<text x="270" y="695" font-size="28" fill="#0096b8" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">앞면 — 乾元重寶</text>
<circle cx="700" cy="470" r="175" fill="#ffffff" stroke="#0096b8" stroke-width="4" filter="url(#plate)"/>
<circle cx="700" cy="470" r="161" fill="none" stroke="#00d0ff" stroke-width="2"/>
<rect x="666" y="436" width="68" height="68" fill="#effbff" stroke="#0096b8" stroke-width="3"/>
<text x="700" y="384" font-size="64" fill="#2a2c2d" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">東</text>
<text x="700" y="600" font-size="64" fill="#2a2c2d" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">國</text>
<text x="700" y="695" font-size="28" fill="#0096b8" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">뒷면 — 東國</text>
<text x="485" y="770" font-size="23" fill="#5d6365" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">※ 글자 놓임을 보여 주는 모식도이며 실물 크기 · 모양과 다를 수 있음</text>
<rect x="980" y="205" width="560" height="82" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<text x="1010" y="256.0" font-size="29" fill="#0096b8" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">996년 처음 주조</text>
<line x1="1260.0" y1="289" x2="1260.0" y2="323" stroke="#0096b8" stroke-width="2" marker-end="url(#ah)"/>
<rect x="980" y="327" width="560" height="82" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<text x="1010" y="378.0" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">이듬해(997) 발행</text>
<line x1="1260.0" y1="411" x2="1260.0" y2="445" stroke="#0096b8" stroke-width="2" marker-end="url(#ah)"/>
<rect x="980" y="449" width="560" height="82" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<text x="1010" y="500.0" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">철전 · 동전 두 종류</text>
<line x1="1260.0" y1="533" x2="1260.0" y2="567" stroke="#0096b8" stroke-width="2" marker-end="url(#ah)"/>
<rect x="980" y="571" width="560" height="82" fill="#ccf6ff" stroke="#0096b8" stroke-width="1.5"/>
<text x="1010" y="622.0" font-size="29" fill="#0096b8" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">1002년 목종이 유통 중단</text>
<rect x="60" y="830" width="1480" height="110" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<text x="90" y="878" font-size="28" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">당나라 건원중보를 본떠 만들고 뒷면에 「東國」을 새겨 고려 돈임을 표시</text>
<text x="90" y="920" font-size="26" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">관에서 만든 우리나라 최초의 화폐 — 1002년에 유통이 멈춤</text>
</svg>
