<rect x="60" y="582" width="334" height="160" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="60.5" y="582.5" width="333" height="50" fill="#ccf6ff"/>
<text x="82" y="619" font-size="30" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','AppleMyungjo',serif" font-weight="700">최씨 정권</text>
<text x="82" y="678" font-size="32" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">최우·최항·최의</text>
<text x="82" y="720" font-size="28" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">4대 60여 년 세습</text>
<line x1="399" y1="682" x2="437" y2="682" stroke="#0096b8" stroke-width="1.2" marker-end="url(#ah)"/>
<rect x="442" y="582" width="334" height="160" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="442.5" y="582.5" width="333" height="50" fill="#ccf6ff"/>
<text x="464" y="619" font-size="30" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','AppleMyungjo',serif" font-weight="700">1258</text>
<text x="464" y="678" font-size="32" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">김준</text>
<text x="464" y="720" font-size="28" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">최의를 없앰</text>
<line x1="781" y1="682" x2="819" y2="682" stroke="#0096b8" stroke-width="1.2" marker-end="url(#ah)"/>
<rect x="824" y="582" width="334" height="160" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="824.5" y="582.5" width="333" height="50" fill="#ccf6ff"/>
<text x="846" y="619" font-size="30" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','AppleMyungjo',serif" font-weight="700">1268</text>
<text x="846" y="678" font-size="32" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">임연</text>
<text x="846" y="720" font-size="28" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">김준을 죽임</text>
<line x1="1163" y1="682" x2="1201" y2="682" stroke="#0096b8" stroke-width="1.2" marker-end="url(#ah)"/>
<rect x="1206" y="582" width="334" height="160" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="1206.5" y="582.5" width="333" height="50" fill="#ccf6ff"/>
<text x="1228" y="619" font-size="30" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','AppleMyungjo',serif" font-weight="700">1270</text>
<text x="1228" y="678" font-size="32" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">임유무 제거</text>
<text x="1228" y="720" font-size="28" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">무신 정권 끝</text>
<path d="M1373 534 V557 H227 V578" fill="none" stroke="#0096b8" stroke-width="1.2" marker-end="url(#ah)"/>
<rect x="100" y="852" width="364" height="56" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<text x="282" y="890" font-size="30" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">성립기</text>
<rect x="464" y="852" width="868" height="56" fill="#ccf6ff" stroke="#00d0ff" stroke-width="1"/>
<text x="898" y="890" font-size="30" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">확립기 · 최씨 정권</text>
<rect x="1332" y="852" width="168" height="56" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<text x="1416" y="890" font-size="30" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">붕괴기</text>
<text x="100" y="944" font-size="28" fill="#0096b8" text-anchor="middle" font-family="'Noto Serif KR','AppleMyungjo',serif" font-weight="700">1170</text>
<text x="464" y="944" font-size="28" fill="#0096b8" text-anchor="middle" font-family="'Noto Serif KR','AppleMyungjo',serif" font-weight="700">1196</text>
<text x="1332" y="944" font-size="28" fill="#0096b8" text-anchor="middle" font-family="'Noto Serif KR','AppleMyungjo',serif" font-weight="700">1258</text>
<text x="1500" y="944" font-size="28" fill="#0096b8" text-anchor="middle" font-family="'Noto Serif KR','AppleMyungjo',serif" font-weight="700">1270</text>
<text x="100" y="834" font-size="28" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">무신 정권 100년을 길이대로</text>
