<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 1000" role="img">
<title>향전 — 구향과 신향의 다툼(조선 후기)</title>
<desc>왼쪽은 향안·유향소를 쥐고 향촌을 이끌던 기존 재지 사족(구향), 오른쪽은 새로 향안에 오른 서얼·서리·군교·요호부민 같은 신향, 가운데는 두 세력이 다툰 향안 입록·향임(좌수·별감) 선임·향교와 서원 참여, 위는 신향을 끌어들인 수령의 관권, 아래는 19세기 중엽 신향·향리가 수령과 손잡고 향촌을 주도하게 된 결과를 정리한 그림.</desc>
<defs>
<marker id="ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="5.5" markerHeight="5.5" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M1 1.5 L11 6 L1 10.5 L3.6 6 z" fill="#0096b8"/></marker>
<marker id="ahl" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="5.5" markerHeight="5.5" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M1 1.5 L11 6 L1 10.5 L3.6 6 z" fill="#7a62d6"/></marker>
<radialGradient id="glow"><stop offset="0" stop-color="#00d0ff" stop-opacity="0.55"/><stop offset="0.45" stop-color="#00d0ff" stop-opacity="0.2"/><stop offset="1" stop-color="#00d0ff" stop-opacity="0"/></radialGradient>
<filter id="plate" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#2a2c2d" flood-opacity="0.16"/></filter>
<filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
<rect width="1600" height="1000" fill="#effbff"/>
<text x="60.0" y="92.0" font-size="48" fill="#2a2c2d" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">향전 — 구향과 신향의 다툼(조선 후기)</text>
<text x="60.0" y="140.0" font-size="28" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">18세기 무렵부터 향촌의 주도권을 두고 벌어진 분쟁</text>
<text x="1540.0" y="92.0" font-size="28" fill="#0096b8" text-anchor="end" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">정리 그림</text>
<line x1="60" y1="166" x2="1540" y2="166" stroke="#00d0ff" stroke-width="1"/>
<rect x="560" y="190" width="480" height="150" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="560.5" y="190.5" width="479" height="58" fill="#ccf6ff"/>
<text x="800.0" y="230.2" font-size="31" fill="#0096b8" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">수령 (관권)</text>
<text x="800.0" y="293.0" font-size="29" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">18세기 이래 향촌 통제가 강해짐</text>
<text x="800.0" y="333.0" font-size="29" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">신향을 동반자로 끌어들임</text>
<rect x="60" y="380" width="440" height="330" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="60.5" y="380.5" width="439" height="58" fill="#ccf6ff"/>
<text x="84.0" y="420.5" font-size="32" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">구향 (舊鄕)</text>
<text x="84.0" y="483.0" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">기존의 재지 사족</text>
<text x="84.0" y="522.4" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">향안에 이름을 올리고</text>
<text x="84.0" y="561.9" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">유향소(향청)를 장악</text>
<text x="84.0" y="601.3" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">향교 · 서원 · 향약으로</text>
<text x="84.0" y="640.8" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">향촌 질서를 이끎</text>
<rect x="1100" y="380" width="440" height="330" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="1100.5" y="380.5" width="439" height="58" fill="#ccf6ff"/>
<text x="1124.0" y="420.5" font-size="32" fill="#7a62d6" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">신향 (新鄕)</text>
<text x="1124.0" y="483.0" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">새로 향안에 오른 세력</text>
<text x="1124.0" y="522.4" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">서얼</text>
<text x="1124.0" y="561.9" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">서리 · 군교</text>
<text x="1124.0" y="601.3" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">요호부민(넉넉한 집안)</text>
<rect x="560" y="380" width="480" height="330" fill="#ffffff" stroke="#0096b8" stroke-width="1.5"/>
<text x="800.0" y="430.0" font-size="32" fill="#2a2c2d" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">다툼거리</text>
<rect x="590" y="470" width="420" height="46" fill="#ccf6ff" stroke="#00d0ff" stroke-width="0.8"/>
<text x="800.0" y="503.0" font-size="28" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">향안에 이름 올리기</text>
<rect x="590" y="528" width="420" height="46" fill="#ccf6ff" stroke="#00d0ff" stroke-width="0.8"/>
<text x="800.0" y="561.0" font-size="28" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">향임(좌수 · 별감) 선임</text>
<rect x="590" y="586" width="420" height="46" fill="#ccf6ff" stroke="#00d0ff" stroke-width="0.8"/>
<text x="800.0" y="619.0" font-size="28" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">향교 · 서원 참여</text>
<rect x="590" y="644" width="420" height="46" fill="#ccf6ff" stroke="#00d0ff" stroke-width="0.8"/>
<text x="800.0" y="677.0" font-size="28" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">제사 · 위패 차례 문제</text>
<line x1="508" y1="545" x2="552" y2="545" stroke="#0096b8" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="1092" y1="545" x2="1048" y2="545" stroke="#7a62d6" stroke-width="2.5" marker-end="url(#ahl)"/>
<line x1="1040" y1="300" x2="1180" y2="372" stroke="#7a62d6" stroke-width="1.8" marker-end="url(#ahl)"/>
<text x="1196.0" y="330.0" font-size="27" fill="#7a62d6" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">관권과 손잡음</text>
<rect x="60" y="744" width="1480" height="186" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<text x="90.0" y="796.0" font-size="30" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">결과</text>
<text x="200.0" y="796.0" font-size="28" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">19세기 중엽 무렵 신향 · 향리가 수령과 손잡고 향촌을 주도하는 체제가 널리 자리 잡음</text>
<text x="200.0" y="846.0" font-size="28" fill="#0096b8" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">→ 사족 중심의 향촌 지배 질서가 무너져 감</text>
<text x="200.0" y="900.0" font-size="26" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">정조: 「요즘 향전이 날로 심해진다」 — 원주의 다툼, 황해 감사의 보고</text>
</svg>
