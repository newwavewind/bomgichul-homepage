<text x="410.0" y="840" font-size="26" fill="#5d6365" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">점선 = 돌담 · 작은 네모 = 나머지 묘광 22기 (7호 포함 23기)</text>
<text x="410.0" y="878" font-size="24" fill="#5d6365" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">(실제 위치·크기가 아니라 구성만 보인 그림)</text>
<rect x="800" y="196" width="740" height="224" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="800.5" y="196.5" width="739" height="58" fill="#ccf6ff"/>
<text x="824" y="236.5" font-size="30" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">생김새</text>
<text x="824" y="299" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">언덕 위에 돌담을 쌓아 묘역을 셋으로 나눔</text>
<text x="824" y="340.2" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">자갈로 덮은 돌무지무덤 · 대부분 화장</text>
<text x="824" y="381.4" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">인골 144구 넘게 확인</text>
<rect x="800" y="439.6" width="740" height="182" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="800.5" y="440.1" width="739" height="58" fill="#ccf6ff"/>
<text x="824" y="480.1" font-size="30" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">나온 물건</text>
<text x="824" y="542.6" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">비파형 동검 · 창 · 청동 팔찌</text>
<text x="824" y="583.8000000000001" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">돌 거푸집 · 대롱구슬 같은 장신구</text>
<rect x="800" y="642.0" width="740" height="250" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<text x="824" y="688.0" font-size="30" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">해석은 두 갈래</text>
<text x="824" y="734.0" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">순장설 — 7호 주인을 위해 많은 사람을 함께 묻음</text>
<text x="824" y="774.0" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">반론 — 강제로 죽인 흔적이 없어 순장이 아니라고 봄</text>
<line x1="1170" y1="794.0" x2="1170" y2="826.0" stroke="#0096b8" stroke-width="2" marker-end="url(#ah)"/>
<text x="1170" y="868.0" font-size="27" fill="#0096b8" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">어느 쪽이든 수장 집단의 우월한 지위 → 계층 분화</text>
</svg>
