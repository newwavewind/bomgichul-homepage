<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 1000" role="img">
<title>강상무덤 — 돌무지무덤과 순장 논쟁</title>
<desc>왼쪽은 돌담으로 세 구역을 나눈 묘역 한가운데 가장 큰 7호 묘광을 두고 나머지 22기가 둘러싼 모습을 단순화한 배치도, 오른쪽은 생김새와 출토 유물, 순장설과 그 반론, 두 견해가 함께 가리키는 계층 분화를 정리한 그림.</desc>
<defs>
<marker id="ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="5.5" markerHeight="5.5" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M1 1.5 L11 6 L1 10.5 L3.6 6 z" fill="#0096b8"/></marker>
</defs>
<rect width="1600" height="1000" fill="#effbff"/>

<text x="60" y="92" font-size="48" fill="#2a2c2d" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">강상무덤 — 돌무지무덤과 순장 논쟁</text>
<text x="60" y="140" font-size="28" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">중국 요령성 대련시 감정자구 · 청동기 시대 돌무지무덤 · 1964년 조중발굴대 발굴</text>
<text x="1540" y="92" font-size="28" fill="#0096b8" text-anchor="end" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">정리 그림</text>
<line x1="60" y1="166" x2="1540" y2="166" stroke="#00d0ff" stroke-width="1"/>
<text x="60" y="214" font-size="32" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">무덤 배치 (단순화)</text>
<rect x="60" y="236" width="700" height="560" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
