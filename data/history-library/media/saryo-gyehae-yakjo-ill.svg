<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 1000" role="img">
<title>계해약조(1443)</title>
<desc>1419년 대마도 정벌, 1426년 삼포 개항, 1443년 계해약조로 이어진 흐름과 세견선 50척·세사미두 200석의 두 조건을 정리한 그림.</desc>
<defs><marker id="ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="5.5" markerHeight="5.5" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M1 1.5 L11 6 L1 10.5 L3.6 6 z" fill="#0096b8"/></marker></defs>
<rect width="1600" height="1000" fill="#effbff"/>
<text x="60" y="92" font-size="48" fill="#2a2c2d" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">계해약조(1443)</text>
<text x="60" y="140" font-size="28" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">세종 25년, 대마도주와 맺은 무역 제한 약속</text>
<text x="1540" y="92" font-size="28" fill="#0096b8" text-anchor="end" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">정리 그림</text>
<line x1="60" y1="166" x2="1540" y2="166" stroke="#00d0ff" stroke-width="1"/>
<text x="60" y="222" font-size="29" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">이어진 흐름</text>
<rect x="60" y="245" width="860" height="80" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<text x="90" y="295.0" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">1419 세종 1 — 이종무의 대마도 정벌</text>
<line x1="490.0" y1="327" x2="490.0" y2="361" stroke="#0096b8" stroke-width="2" marker-end="url(#ah)"/>
<rect x="60" y="365" width="860" height="80" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<text x="90" y="415.0" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">1426 세종 8 — 삼포를 열어 무역 허락</text>
<line x1="490.0" y1="447" x2="490.0" y2="481" stroke="#0096b8" stroke-width="2" marker-end="url(#ah)"/>
<rect x="60" y="485" width="860" height="80" fill="#ccf6ff" stroke="#0096b8" stroke-width="1.5"/>
<text x="90" y="535.0" font-size="29" fill="#0096b8" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">1443 세종 25 — 계해약조</text>
<text x="60" y="650" font-size="29" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">약조의 두 조건</text>
<rect x="60" y="675" width="560" height="200" fill="#ffffff" stroke="#0096b8" stroke-width="1.5"/>
<text x="340" y="745" font-size="30" fill="#5d6365" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">세견선</text>
<text x="340" y="830" font-size="64" fill="#0096b8" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">50척</text>
<rect x="680" y="675" width="560" height="200" fill="#ffffff" stroke="#0096b8" stroke-width="1.5"/>
<text x="960" y="745" font-size="30" fill="#5d6365" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">세사미두</text>
<text x="960" y="830" font-size="64" fill="#0096b8" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">200석</text>
<rect x="980" y="205" width="560" height="296" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="980.5" y="205.5" width="559" height="58" fill="#ccf6ff"/>
<text x="1004" y="245" font-size="29" fill="#7a62d6" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">뜻</text>
<text x="1010" y="307" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">· 세견선: 해마다 대마도주가</text>
<text x="1028" y="359" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">보낼 수 있는 무역선</text>
<text x="1010" y="411" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">· 세사미두: 조선이 해마다</text>
<text x="1028" y="463" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">내려 주는 쌀과 콩</text>
<text x="60" y="940" font-size="27" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">왜인을 달래면서도 무역은 통제한 교린 정책의 한 모습이다.</text>
</svg>
