<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 1000" role="img">
<title>보도 지침(1986 폭로) — 제5공화국의 언론 통제</title>
<desc>위는 문화 공보부 홍보 정책실(홍보 조정실)이 거의 날마다 신문사·방송사에 보도 지침을 내려보내 협조 요청이라는 이름으로 기사를 통제한 흐름도, 아래는 1984년 민주 언론 운동 협의회 창립, 1985년 월간 『말』 창간, 1986년 9월 『말』 특별호의 보도 지침 584건 폭로, 관련자 구속, 1995년 대법원 무죄 확정까지의 연표.</desc>
<defs>
<marker id="ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="5.5" markerHeight="5.5" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M1 1.5 L11 6 L1 10.5 L3.6 6 z" fill="#0096b8"/></marker>
<marker id="ahl" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="5.5" markerHeight="5.5" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M1 1.5 L11 6 L1 10.5 L3.6 6 z" fill="#7a62d6"/></marker>
<radialGradient id="glow"><stop offset="0" stop-color="#00d0ff" stop-opacity="0.55"/><stop offset="0.45" stop-color="#00d0ff" stop-opacity="0.2"/><stop offset="1" stop-color="#00d0ff" stop-opacity="0"/></radialGradient>
<filter id="plate" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#2a2c2d" flood-opacity="0.16"/></filter>
<filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
<rect width="1600" height="1000" fill="#effbff"/>
<text x="60.0" y="92.0" font-size="48" fill="#2a2c2d" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">보도 지침(1986 폭로) — 제5공화국의 언론 통제</text>
<text x="60.0" y="140.0" font-size="28" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">정부가 날마다 기사의 방향 · 크기를 정해 내려보낸 지시</text>
<text x="1540.0" y="92.0" font-size="28" fill="#0096b8" text-anchor="end" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">정리 그림</text>
<line x1="60" y1="166" x2="1540" y2="166" stroke="#00d0ff" stroke-width="1"/>
<rect x="60" y="190" width="440" height="230" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="60.5" y="190.5" width="439" height="58" fill="#ccf6ff"/>
<text x="280.0" y="230.5" font-size="32" fill="#0096b8" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">문화 공보부</text>
<text x="280.0" y="293.0" font-size="29" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">홍보 정책실</text>
<text x="280.0" y="333.6" font-size="29" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">(홍보 조정실을 상설 기구로 둠)</text>
<line x1="508" y1="305" x2="572" y2="305" stroke="#0096b8" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="580" y="190" width="440" height="230" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="580.5" y="190.5" width="439" height="58" fill="#ccf6ff"/>
<text x="800.0" y="230.5" font-size="32" fill="#0096b8" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">보도 지침</text>
<text x="800.0" y="293.0" font-size="29" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">거의 날마다</text>
<text x="800.0" y="332.4" font-size="29" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">기사의 가이드라인을</text>
<text x="800.0" y="371.9" font-size="29" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">작성해 내려보냄</text>
<line x1="1028" y1="305" x2="1092" y2="305" stroke="#0096b8" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="1100" y="190" width="440" height="230" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="1100.5" y="190.5" width="439" height="58" fill="#ccf6ff"/>
<text x="1320.0" y="230.5" font-size="32" fill="#0096b8" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">신문사 · 방송사</text>
<text x="1320.0" y="293.0" font-size="29" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">어떤 기사를 싣고 뺄지</text>
<text x="1320.0" y="333.6" font-size="29" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">얼마나 크게 다룰지</text>
<rect x="60" y="444" width="1480" height="80" fill="#ccf6ff" stroke="#00d0ff" stroke-width="1"/>
<text x="800.0" y="495.0" font-size="30" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">겉으로는 「협조 요청」 → 실제로는 기사 내용을 정해 주는 지시</text>
<rect x="60" y="548" width="1480" height="382" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<line x1="96" y1="595" x2="96" y2="899" stroke="#00d0ff" stroke-width="1.5"/>
<circle cx="96" cy="595" r="7" fill="#00d0ff" stroke="#ffffff" stroke-width="2"/><circle cx="96" cy="595" r="8.5" fill="none" stroke="#2a2c2d" stroke-width="0.6"/>
<text x="132.0" y="604.0" font-size="28" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">1984.12.19</text>
<text x="296.0" y="604.0" font-size="28" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">민주 언론 운동 협의회(언협) 창립</text>
<text x="296.0" y="640.0" font-size="26" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">동아투위 · 조선투위 · 80년 해직 언론인 등</text>
<circle cx="96" cy="689" r="7" fill="#00d0ff" stroke="#ffffff" stroke-width="2"/><circle cx="96" cy="689" r="8.5" fill="none" stroke="#2a2c2d" stroke-width="0.6"/>
<text x="132.0" y="698.0" font-size="28" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">1985.6.15</text>
<text x="296.0" y="698.0" font-size="28" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">기관지 월간 『말』 창간</text>
<rect x="120" y="726" width="1396" height="80" fill="#effbff" stroke="#00d0ff" stroke-width="0.5"/>
<circle cx="96" cy="747" r="7" fill="#00d0ff" stroke="#ffffff" stroke-width="2"/><circle cx="96" cy="747" r="8.5" fill="none" stroke="#2a2c2d" stroke-width="0.6"/>
<text x="132.0" y="756.0" font-size="28" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">1986.9.6</text>
<text x="296.0" y="756.0" font-size="28" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">『말』 특별호가 보도 지침 584건 폭로</text>
<text x="296.0" y="792.0" font-size="26" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">1985.10~1986.8분 · 한국일보 김주언 기자가 자료 제공</text>
<circle cx="96" cy="841" r="7" fill="#00d0ff" stroke="#ffffff" stroke-width="2"/><circle cx="96" cy="841" r="8.5" fill="none" stroke="#2a2c2d" stroke-width="0.6"/>
<text x="132.0" y="850.0" font-size="28" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">그 뒤</text>
<text x="296.0" y="850.0" font-size="28" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">김태홍 · 신홍범 · 김주언 구속 · 기소</text>
<circle cx="96" cy="899" r="7" fill="#00d0ff" stroke="#ffffff" stroke-width="2"/><circle cx="96" cy="899" r="8.5" fill="none" stroke="#2a2c2d" stroke-width="0.6"/>
<text x="132.0" y="908.0" font-size="28" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">1995.12.5</text>
<text x="296.0" y="908.0" font-size="28" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">대법원에서 무죄 확정</text>
</svg>
