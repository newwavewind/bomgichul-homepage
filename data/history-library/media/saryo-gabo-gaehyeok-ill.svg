<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 1000" role="img">
<title>갑오개혁(1894~1896) — 세 차례의 개혁</title>
<desc>세 칸은 1894년 군국기무처가 이끈 1차 개혁(약 210건), 김홍집·박영효 연립 내각의 2차 개혁(213건, 홍범 14조), 김홍집 내각의 3차 개혁(140여 건, 태양력·단발령)에서 바뀐 주요 제도를 정리한 표, 아래 띠는 1차 개혁의 신분제 폐지·과부 재가 허용·노비제 혁파 조목과 아관 파천으로 개혁이 끝난 사실.</desc>
<defs>
<marker id="ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="5.5" markerHeight="5.5" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M1 1.5 L11 6 L1 10.5 L3.6 6 z" fill="#0096b8"/></marker>
<marker id="ahl" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="5.5" markerHeight="5.5" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M1 1.5 L11 6 L1 10.5 L3.6 6 z" fill="#7a62d6"/></marker>
<radialGradient id="glow"><stop offset="0" stop-color="#00d0ff" stop-opacity="0.55"/><stop offset="0.45" stop-color="#00d0ff" stop-opacity="0.2"/><stop offset="1" stop-color="#00d0ff" stop-opacity="0"/></radialGradient>
<filter id="plate" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#2a2c2d" flood-opacity="0.16"/></filter>
<filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
<rect width="1600" height="1000" fill="#effbff"/>
<text x="60.0" y="92.0" font-size="48" fill="#2a2c2d" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">갑오개혁(1894~1896) — 세 차례의 개혁</text>
<text x="60.0" y="140.0" font-size="28" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">군국기무처에서 김홍집 · 박영효 연립 내각, 김홍집 내각까지</text>
<text x="1540.0" y="92.0" font-size="28" fill="#0096b8" text-anchor="end" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">정리 그림</text>
<line x1="60" y1="166" x2="1540" y2="166" stroke="#00d0ff" stroke-width="1"/>
<rect x="60" y="190" width="472" height="520" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="60.5" y="190.5" width="471" height="96" fill="#ccf6ff"/>
<text x="84.0" y="232.0" font-size="32" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">1차 · 1894</text>
<text x="84.0" y="272.0" font-size="26" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">군국기무처 · 약 210건</text>
<text x="84.0" y="336.0" font-size="28" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">의정부 아래 8아문 · 궁내부 분리</text>
<text x="84.0" y="394.0" font-size="28" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">과거제 폐지 · 새 관리 임용법</text>
<text x="84.0" y="452.0" font-size="28" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">개국 기년을 씀 (청과 거리 둠)</text>
<text x="84.0" y="510.0" font-size="28" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">재정을 탁지아문으로 일원화</text>
<text x="84.0" y="568.0" font-size="28" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">은 본위 화폐 · 조세 금납</text>
<text x="84.0" y="626.0" font-size="28" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">도량형 통일</text>
<line x1="536" y1="450" x2="560" y2="450" stroke="#0096b8" stroke-width="2" marker-end="url(#ah)"/>
<rect x="564" y="190" width="472" height="520" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="564.5" y="190.5" width="471" height="96" fill="#ccf6ff"/>
<text x="588.0" y="232.0" font-size="32" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">2차 · 1894 말~1895</text>
<text x="588.0" y="272.0" font-size="26" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">김홍집 · 박영효 연립 내각 · 213건</text>
<text x="588.0" y="336.0" font-size="28" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">홍범 14조 반포</text>
<text x="588.0" y="394.0" font-size="28" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">의정부 → 내각 · 8아문 → 7부</text>
<text x="588.0" y="452.0" font-size="28" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">전국을 23부 337군으로</text>
<text x="588.0" y="510.0" font-size="28" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">재판소 구성법 (사법권 독립)</text>
<text x="588.0" y="568.0" font-size="28" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">교육 입국 조서 · 한성 사범 학교</text>
<line x1="1040" y1="450" x2="1064" y2="450" stroke="#0096b8" stroke-width="2" marker-end="url(#ah)"/>
<rect x="1068" y="190" width="472" height="520" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="1068.5" y="190.5" width="471" height="96" fill="#ccf6ff"/>
<text x="1092.0" y="232.0" font-size="32" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">3차 · 1895~1896.2</text>
<text x="1092.0" y="272.0" font-size="26" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">김홍집 내각 · 140여 건</text>
<text x="1092.0" y="336.0" font-size="28" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">소학교령</text>
<text x="1092.0" y="394.0" font-size="28" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">「건양」 연호를 세움</text>
<text x="1092.0" y="452.0" font-size="28" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">1896년 1월 1일부터 태양력</text>
<text x="1092.0" y="510.0" font-size="28" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">단발령 → 유생 · 백성의 반발</text>
<text x="1092.0" y="568.0" font-size="28" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">아관 파천으로 내각 무너짐</text>
<rect x="60" y="734" width="1480" height="196" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<text x="90.0" y="786.0" font-size="30" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">1차 개혁의 사회 조목</text>
<circle cx="98" cy="831" r="6" fill="#00d0ff"/>
<text x="116.0" y="840.0" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">문벌 · 반상 등급 혁파</text>
<circle cx="818" cy="831" r="6" fill="#00d0ff"/>
<text x="836.0" y="840.0" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">공 · 사노비법 혁파 · 인신매매 금지</text>
<circle cx="98" cy="883" r="6" fill="#00d0ff"/>
<text x="116.0" y="892.0" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">과부 재가 허용 · 조혼 금지</text>
<circle cx="818" cy="883" r="6" fill="#00d0ff"/>
<text x="836.0" y="892.0" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">죄인 연좌법 폐지</text>
</svg>
