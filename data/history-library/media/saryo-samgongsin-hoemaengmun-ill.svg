<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 1000" role="img">
<title>개국·정사·좌명 삼공신 회맹</title>
<desc>개국·정사·좌명 공신이 생긴 차례를 연표로 잇고, 1404년 회맹에서 왕이 한 일과 회맹의 뜻을 정리한 그림.</desc>
<defs><marker id="ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="5.5" markerHeight="5.5" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M1 1.5 L11 6 L1 10.5 L3.6 6 z" fill="#0096b8"/></marker></defs>
<rect width="1600" height="1000" fill="#effbff"/>
<text x="60" y="92" font-size="48" fill="#2a2c2d" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">개국·정사·좌명 삼공신 회맹</text>
<text x="60" y="140" font-size="28" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">태종 4년(1404), 세 차례 책봉된 공신이 한자리에서 맹세하다</text>
<text x="1540" y="92" font-size="28" fill="#0096b8" text-anchor="end" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">정리 그림</text>
<line x1="60" y1="166" x2="1540" y2="166" stroke="#00d0ff" stroke-width="1"/>
<rect x="60.0" y="205" width="352.0" height="70" fill="#ccf6ff" stroke="#0096b8" stroke-width="1.5"/>
<text x="236.0" y="251" font-size="30" fill="#0096b8" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">1392</text>
<rect x="60.0" y="295" width="352.0" height="220" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="60.5" y="295.5" width="351.0" height="57" fill="#ccf6ff"/>
<text x="84.0" y="335" font-size="29" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">개국 공신</text>
<text x="88.0" y="400" font-size="25" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">태조 이성계를 도와</text>
<text x="88.0" y="444" font-size="25" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">조선을 세운 공신</text>
<text x="88.0" y="488" font-size="25" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">(정도전·조준 등)</text>
<line x1="414.0" y1="240" x2="434.0" y2="240" stroke="#0096b8" stroke-width="3" marker-end="url(#ah)"/>
<rect x="436.0" y="205" width="352.0" height="70" fill="#ccf6ff" stroke="#0096b8" stroke-width="1.5"/>
<text x="612.0" y="251" font-size="30" fill="#7a62d6" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">1398</text>
<rect x="436.0" y="295" width="352.0" height="220" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="436.5" y="295.5" width="351.0" height="57" fill="#ccf6ff"/>
<text x="460.0" y="335" font-size="29" fill="#7a62d6" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">정사 공신</text>
<text x="464.0" y="400" font-size="25" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">제1차 왕자의 난 뒤</text>
<text x="464.0" y="444" font-size="25" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">이방원 편에 선</text>
<text x="464.0" y="488" font-size="25" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">사람들을 책봉</text>
<line x1="790.0" y1="240" x2="810.0" y2="240" stroke="#0096b8" stroke-width="3" marker-end="url(#ah)"/>
<rect x="812.0" y="205" width="352.0" height="70" fill="#ccf6ff" stroke="#0096b8" stroke-width="1.5"/>
<text x="988.0" y="251" font-size="30" fill="#0096b8" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">1401</text>
<rect x="812.0" y="295" width="352.0" height="220" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="812.5" y="295.5" width="351.0" height="57" fill="#ccf6ff"/>
<text x="836.0" y="335" font-size="29" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">좌명 공신</text>
<text x="840.0" y="400" font-size="25" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">제2차 왕자의 난(1400)과</text>
<text x="840.0" y="444" font-size="25" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">태종 즉위를 도운</text>
<text x="840.0" y="488" font-size="25" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">사람들을 책봉</text>
<line x1="1166.0" y1="240" x2="1186.0" y2="240" stroke="#0096b8" stroke-width="3" marker-end="url(#ah)"/>
<rect x="1188.0" y="205" width="352.0" height="70" fill="#ccf6ff" stroke="#0096b8" stroke-width="1.5"/>
<text x="1364.0" y="251" font-size="30" fill="#7a62d6" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">1404</text>
<rect x="1188.0" y="295" width="352.0" height="220" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="1188.5" y="295.5" width="351.0" height="57" fill="#ccf6ff"/>
<text x="1212.0" y="335" font-size="29" fill="#7a62d6" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">세 공신 회맹</text>
<text x="1216.0" y="400" font-size="25" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">대청관 북쪽에서</text>
<text x="1216.0" y="444" font-size="25" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">세 공신이 함께 맹세</text>
<text x="1216.0" y="488" font-size="25" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">(삼맹의 신하)</text>
<rect x="60" y="560" width="700" height="190" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="60.5" y="560.5" width="699" height="57" fill="#ccf6ff"/>
<text x="84" y="600" font-size="29" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">왕은 어떻게 했나</text>
<text x="88" y="665" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">· 맹세 글에 서명(押)만 함</text>
<text x="88" y="711" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">· 모임에는 직접 나가지 않음</text>
<rect x="840" y="560" width="700" height="190" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="840.5" y="560.5" width="699" height="57" fill="#ccf6ff"/>
<text x="864" y="600" font-size="29" fill="#7a62d6" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">왜 다시 맹세하게 했나</text>
<text x="868" y="665" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">· 따로 맹세했던 세 무리를</text>
<text x="868" y="711" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">   한자리에 모아 왕 아래로 묶음</text>
<rect x="60" y="800" width="1480" height="80" fill="#ccf6ff" stroke="#0096b8" stroke-width="1.5"/>
<text x="800.0" y="850.8" font-size="30" fill="#0096b8" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">공신 세력을 왕 아래 하나로 묶은 왕권 강화의 한 모습</text>
</svg>
