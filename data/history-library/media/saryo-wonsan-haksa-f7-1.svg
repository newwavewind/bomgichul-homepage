<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">
<title>원산 학사(1883) — 최초의 근대 학교</title>
<rect width="960" height="620" fill="#ffffff"/>
<text x="480.0" y="52" text-anchor="middle" font-size="30" font-weight="700" fill="#1b2a4a">원산 학사(1883) — 최초의 근대 학교</text>
<text x="480.0" y="84" text-anchor="middle" font-size="17" font-weight="400" fill="#5b6475">주민과 관청이 함께 세우고, 문 · 무 두 반에 새 학문을 가르치다</text>
<rect x="30" y="120" width="210" height="150" rx="10" fill="#ffffff" stroke="#9fdcf5" stroke-width="2"/>
<text x="135.0" y="163.8" text-anchor="middle" font-size="19" font-weight="700" fill="#0096d6">1880. 4</text>
<text x="135.0" y="189.3" text-anchor="middle" font-size="17" font-weight="400" fill="#1b2a4a">원산 개항</text>
<text x="135.0" y="214.0" text-anchor="middle" font-size="17" font-weight="400" fill="#1b2a4a">일본 상인이 몰려와</text>
<text x="135.0" y="238.6" text-anchor="middle" font-size="17" font-weight="400" fill="#1b2a4a">장사를 시작</text>
<line x1="244" y1="195" x2="261" y2="195" stroke="#0096d6" stroke-width="2.5" stroke-linecap="round"/>
<path d="M251.1 199.8 L261 195 L251.1 190.2" fill="none" stroke="#0096d6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="265" y="120" width="210" height="150" rx="10" fill="#ffffff" stroke="#9fdcf5" stroke-width="2"/>
<text x="370.0" y="163.8" text-anchor="middle" font-size="19" font-weight="700" fill="#0096d6">1883. 1</text>
<text x="370.0" y="189.3" text-anchor="middle" font-size="17" font-weight="400" fill="#1b2a4a">덕원 · 원산 주민이</text>
<text x="370.0" y="214.0" text-anchor="middle" font-size="17" font-weight="400" fill="#1b2a4a">새 덕원부사 정현석에게</text>
<text x="370.0" y="238.6" text-anchor="middle" font-size="17" font-weight="400" fill="#1b2a4a">학교를 청함</text>
<line x1="479" y1="195" x2="496" y2="195" stroke="#0096d6" stroke-width="2.5" stroke-linecap="round"/>
<path d="M486.1 199.8 L496 195 L486.1 190.2" fill="none" stroke="#0096d6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="500" y="120" width="210" height="150" rx="10" fill="#eaf7fd" stroke="#0096d6" stroke-width="2"/>
<text x="605.0" y="163.8" text-anchor="middle" font-size="19" font-weight="700" fill="#0096d6">관민 합작 설립</text>
<text x="605.0" y="189.3" text-anchor="middle" font-size="17" font-weight="400" fill="#1b2a4a">주민이 돈을 모으고</text>
<text x="605.0" y="214.0" text-anchor="middle" font-size="17" font-weight="400" fill="#1b2a4a">정현석이 힘을 보탬</text>
<text x="605.0" y="238.6" text-anchor="middle" font-size="17" font-weight="400" fill="#1b2a4a">(어윤중 · 정헌시 도움)</text>
<line x1="714" y1="195" x2="731" y2="195" stroke="#0096d6" stroke-width="2.5" stroke-linecap="round"/>
<path d="M721.1 199.8 L731 195 L721.1 190.2" fill="none" stroke="#0096d6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="735" y="120" width="210" height="150" rx="10" fill="#ffffff" stroke="#9fdcf5" stroke-width="2"/>
<text x="840.0" y="163.8" text-anchor="middle" font-size="19" font-weight="700" fill="#0096d6">1883. 8</text>
<text x="840.0" y="189.3" text-anchor="middle" font-size="17" font-weight="400" fill="#1b2a4a">정부가</text>
<text x="840.0" y="214.0" text-anchor="middle" font-size="17" font-weight="400" fill="#1b2a4a">원산 학사 설립을</text>
<text x="840.0" y="238.6" text-anchor="middle" font-size="17" font-weight="400" fill="#1b2a4a">승인함</text>
<rect x="30" y="305" width="440" height="120" rx="10" fill="#ffffff" stroke="#9fdcf5" stroke-width="2"/>
<text x="250.0" y="359.1" text-anchor="middle" font-size="21" font-weight="700" fill="#1b2a4a">문예반</text>
<text x="250.0" y="385.4" text-anchor="middle" font-size="17" font-weight="400" fill="#1b2a4a">글을 배우는 반</text>
<rect x="505" y="305" width="425" height="120" rx="10" fill="#ffffff" stroke="#9fdcf5" stroke-width="2"/>
<text x="717.5" y="359.1" text-anchor="middle" font-size="21" font-weight="700" fill="#1b2a4a">무예반</text>
<text x="717.5" y="385.4" text-anchor="middle" font-size="17" font-weight="400" fill="#1b2a4a">무예를 익히는 반</text>
<line x1="250" y1="431" x2="400" y2="466" stroke="#0096d6" stroke-width="2.5" stroke-linecap="round"/>
<path d="M389.3 468.4 L400 466 L391.4 459.1" fill="none" stroke="#0096d6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="717" y1="431" x2="560" y2="466" stroke="#0096d6" stroke-width="2.5" stroke-linecap="round"/>
<path d="M568.6 459.2 L560 466 L570.7 468.5" fill="none" stroke="#0096d6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="30" y="472" width="900" height="80" rx="10" fill="#eaf7fd" stroke="#0096d6" stroke-width="2"/>
<text x="480.0" y="517.5" text-anchor="middle" font-size="18" font-weight="700" fill="#0096d6">두 반 함께: 산수 · 물리 · 농업 같은 새 학문 · 외국어 · 만국 공법</text>
<rect x="30" y="566" width="900" height="46" rx="10" fill="#ffffff" stroke="#9fdcf5" stroke-width="2" stroke-dasharray="6 5"/>
<text x="480.0" y="594.2" text-anchor="middle" font-size="17" font-weight="700" fill="#1b2a4a">배재 학당보다 2년 앞선 우리나라 최초의 근대 학교</text>
</svg>
