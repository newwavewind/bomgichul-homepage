<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 1000" role="img">
<title>제주 4·3 사건 — 사건의 기간과 진상 규명</title>
<desc>왼쪽은 1947년 3·1절 발포에서 1954년 한라산 금족 지역 개방까지 특별법이 정한 사건 기간과, 2000년 특별법 공포·2003년 진상 조사 보고서 채택과 대통령 사과를 차례로 놓은 연표. 오른쪽은 특별법 제2조의 정의와 시험 단서를 정리한 상자.</desc>
<defs>
<marker id="ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="5.5" markerHeight="5.5" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M1 1.5 L11 6 L1 10.5 L3.6 6 z" fill="#0096b8"/></marker>
<marker id="ahl" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="5.5" markerHeight="5.5" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M1 1.5 L11 6 L1 10.5 L3.6 6 z" fill="#7a62d6"/></marker>
<radialGradient id="glow"><stop offset="0" stop-color="#00d0ff" stop-opacity="0.55"/><stop offset="0.45" stop-color="#00d0ff" stop-opacity="0.2"/><stop offset="1" stop-color="#00d0ff" stop-opacity="0"/></radialGradient>
<filter id="plate" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#2a2c2d" flood-opacity="0.16"/></filter>
<filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
<rect width="1600" height="1000" fill="#ffffff"/>
<text x="48.0" y="84.0" font-size="48" fill="#2a2c2d" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">제주 4·3 사건 — 사건의 기간과 진상 규명</text>
<text x="48.0" y="130.0" font-size="28" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">특별법이 정한 사건 기간(1947. 3. 1. ~ 1954. 9. 21.)과 그 뒤 진상 규명·명예 회복의 흐름</text>
<text x="1552.0" y="84.0" font-size="26" fill="#0096b8" text-anchor="end" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">정리 그림</text>
<rect x="48" y="152" width="64" height="4" fill="#00d0ff"/>
<line x1="112" y1="154" x2="1552" y2="154" stroke="#2a2c2d" stroke-opacity="0.18" stroke-width="1"/>
<rect x="48" y="180" width="960" height="770" fill="#ffffff" stroke="#2a2c2d" stroke-opacity="0.55" stroke-width="0.5"/>
<line x1="94" y1="300" x2="94" y2="800" stroke="#00d0ff" stroke-width="1.5"/>
<rect x="80" y="218" width="900" height="44" fill="#2a2c2d" fill-opacity="0.04"/>
<rect x="80" y="218" width="5" height="44" fill="#7a62d6"/>
<text x="102.0" y="249.0" font-size="26" fill="#7a62d6" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">특별법이 정한 사건 기간 — 7년 7개월</text>
<circle cx="94" cy="300" r="7" fill="#00d0ff" stroke="#ffffff" stroke-width="2"/><circle cx="94" cy="300" r="8.5" fill="none" stroke="#2a2c2d" stroke-width="0.6"/>
<text x="128.0" y="310.0" font-size="29" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">1947. 3. 1.</text>
<text x="310.0" y="310.0" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">3·1절 기념 제주도 대회 때 경찰 발포</text>
<text x="310.0" y="350.0" font-size="26" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">민간인 6명이 숨짐 → 사건의 발단</text>
<rect x="114" y="384" width="866" height="92" fill="#effbff" stroke="#00d0ff" stroke-width="0.5"/>
<circle cx="94" cy="410" r="7" fill="#00d0ff" stroke="#ffffff" stroke-width="2"/><circle cx="94" cy="410" r="8.5" fill="none" stroke="#2a2c2d" stroke-width="0.6"/>
<text x="128.0" y="420.0" font-size="29" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">1948. 4. 3.</text>
<text x="310.0" y="420.0" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">남로당 제주도당이 이끈 무장봉기</text>
<text x="310.0" y="460.0" font-size="26" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">단독 선거·단독 정부 반대 등을 내걸음</text>
<circle cx="94" cy="520" r="7" fill="#00d0ff" stroke="#ffffff" stroke-width="2"/><circle cx="94" cy="520" r="8.5" fill="none" stroke="#2a2c2d" stroke-width="0.6"/>
<text x="128.0" y="530.0" font-size="29" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">그 뒤</text>
<text x="310.0" y="530.0" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">토벌대의 진압 과정에서 많은 주민이 희생됨</text>
<circle cx="94" cy="590" r="7" fill="#00d0ff" stroke="#ffffff" stroke-width="2"/><circle cx="94" cy="590" r="8.5" fill="none" stroke="#2a2c2d" stroke-width="0.6"/>
<text x="128.0" y="600.0" font-size="29" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">1954. 9. 21.</text>
<text x="310.0" y="600.0" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">한라산 금족 지역 전면 개방 → 사건 종결</text>
<rect x="80" y="648" width="900" height="44" fill="#2a2c2d" fill-opacity="0.04"/>
<rect x="80" y="648" width="5" height="44" fill="#7a62d6"/>
<text x="102.0" y="679.0" font-size="26" fill="#7a62d6" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">진상 규명과 명예 회복</text>
<rect x="114" y="704" width="866" height="52" fill="#effbff" stroke="#00d0ff" stroke-width="0.5"/>
<circle cx="94" cy="730" r="7" fill="#00d0ff" stroke="#ffffff" stroke-width="2"/><circle cx="94" cy="730" r="8.5" fill="none" stroke="#2a2c2d" stroke-width="0.6"/>
<text x="128.0" y="740.0" font-size="29" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">2000. 1.</text>
<text x="310.0" y="740.0" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">「4·3 특별법」 공포 — 진상 규명·명예 회복</text>
<rect x="114" y="774" width="866" height="92" fill="#effbff" stroke="#00d0ff" stroke-width="0.5"/>
<circle cx="94" cy="800" r="7" fill="#00d0ff" stroke="#ffffff" stroke-width="2"/><circle cx="94" cy="800" r="8.5" fill="none" stroke="#2a2c2d" stroke-width="0.6"/>
<text x="128.0" y="810.0" font-size="29" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">2003. 10.</text>
<text x="310.0" y="810.0" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">정부의 진상 조사 보고서 채택</text>
<text x="310.0" y="850.0" font-size="26" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">대통령의 공식 사과</text>
<rect x="1040" y="180" width="512" height="360" fill="#ffffff" stroke="#2a2c2d" stroke-opacity="0.55" stroke-width="0.5"/>
<rect x="1040.25" y="180.25" width="511.5" height="58" fill="#effbff"/>
<rect x="1040" y="180" width="5" height="58" fill="#00d0ff"/>
<line x1="1040" y1="238" x2="1552" y2="238" stroke="#00d0ff" stroke-width="0.5"/>
<text x="1066.0" y="219.8" font-size="30" fill="#2a2c2d" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">특별법 제2조의 정의</text>
<circle cx="1072" cy="278.3" r="4" fill="#0096b8"/>
<text x="1088.0" y="288.0" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">1947. 3. 1.을 기점으로</text>
<circle cx="1072" cy="334.3" r="4" fill="#0096b8"/>
<text x="1088.0" y="344.0" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">1948. 4. 3. 발생한 소요 사태</text>
<circle cx="1072" cy="390.3" r="4" fill="#0096b8"/>
<text x="1088.0" y="400.0" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">1954. 9. 21.까지의 무력 충돌</text>
<circle cx="1072" cy="446.3" r="4" fill="#0096b8"/>
<text x="1088.0" y="456.0" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">그 진압 과정에서 주민 희생</text>
<rect x="1040" y="572" width="512" height="378" fill="#ffffff" stroke="#2a2c2d" stroke-opacity="0.55" stroke-width="0.5"/>
<rect x="1040.25" y="572.25" width="511.5" height="58" fill="#effbff"/>
<rect x="1040" y="572" width="5" height="58" fill="#7a62d6"/>
<line x1="1040" y1="630" x2="1552" y2="630" stroke="#00d0ff" stroke-width="0.5"/>
<text x="1066.0" y="611.8" font-size="30" fill="#2a2c2d" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">시험에 나오는 단서</text>
<circle cx="1072" cy="670.3" r="4" fill="#0096b8"/>
<text x="1088.0" y="680.0" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">3·1절 발포 사건(1947)</text>
<circle cx="1072" cy="724.3" r="4" fill="#0096b8"/>
<text x="1088.0" y="734.0" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">4월 3일 무장봉기(1948)</text>
<circle cx="1072" cy="778.3" r="4" fill="#0096b8"/>
<text x="1088.0" y="788.0" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">단독 선거·단독 정부 반대</text>
<circle cx="1072" cy="832.3" r="4" fill="#0096b8"/>
<text x="1088.0" y="842.0" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">4·3 특별법(2000)</text>
<circle cx="1072" cy="886.3" r="4" fill="#0096b8"/>
<text x="1088.0" y="896.0" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">진상 보고서·대통령 사과(2003)</text>
</svg>
