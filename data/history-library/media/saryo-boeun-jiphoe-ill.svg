<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img">
<title>교조 신원 운동에서 보은 집회로(1892~1893)</title>
<desc>위는 1892년 공주·삼례 집회, 1893년 서울 복합 상소, 1893년 보은 집회, 1894년 동학 농민 운동으로 이어지는 흐름, 가운데는 종교 운동에서 정치 운동으로 바뀐 요구, 아래는 조정의 대응을 정리한 그림.</desc>
<defs><marker id="ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="5.5" markerHeight="5.5" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M1 1.5 L11 6 L1 10.5 L3.6 6 z" fill="#0096b8"/></marker></defs>
<rect width="1600" height="1000" fill="#effbff"/>
<text x="60" y="92" font-size="46" fill="#2a2c2d" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">교조 신원 운동에서 보은 집회로(1892~1893)</text>
<text x="60" y="140" font-size="28" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">교조 최제우의 억울함을 풀고 포교의 자유를 얻으려던 동학교도의 움직임</text>
<text x="1540" y="92" font-size="28" fill="#0096b8" text-anchor="end" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">정리 그림</text>
<line x1="60" y1="166" x2="1540" y2="166" stroke="#00d0ff" stroke-width="1"/>
<rect x="60" y="190" width="1480" height="210" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<line x1="110" y1="290" x2="1490" y2="290" stroke="#00d0ff" stroke-width="1.2" marker-end="url(#ah)"/>
<circle cx="282" cy="290" r="9" fill="#00d0ff" stroke="#0096b8" stroke-width="1"/>
<text x="282" y="268" font-size="27" fill="#0096b8" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">1892</text>
<text x="282" y="334" font-size="24" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">공주·삼례 집회</text>
<text x="282" y="372" font-size="21" fill="#5d6365" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">교조 신원 · 탄압 중지 요구</text>
<circle cx="627" cy="290" r="9" fill="#00d0ff" stroke="#0096b8" stroke-width="1"/>
<text x="627" y="268" font-size="27" fill="#0096b8" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">1893 초</text>
<text x="627" y="334" font-size="24" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">복합 상소</text>
<text x="627" y="372" font-size="21" fill="#5d6365" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">서울 궁궐 앞에 엎드려 호소</text>
<circle cx="972" cy="290" r="9" fill="#0096b8" stroke="#0096b8" stroke-width="1"/>
<text x="972" y="268" font-size="27" fill="#0096b8" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">1893.3~4</text>
<text x="972" y="334" font-size="24" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">보은 집회</text>
<text x="972" y="372" font-size="21" fill="#5d6365" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">충청도 보은 · 척왜양</text>
<rect x="807" y="226" width="329" height="160" fill="none" stroke="#0096b8" stroke-width="1.5" stroke-dasharray="6 5"/>
<circle cx="1317" cy="290" r="9" fill="#00d0ff" stroke="#0096b8" stroke-width="1"/>
<text x="1317" y="268" font-size="27" fill="#0096b8" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">1894</text>
<text x="1317" y="334" font-size="24" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">동학 농민 운동</text>
<text x="1317" y="372" font-size="21" fill="#5d6365" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">보은 집회가 큰 영향</text>
<text x="800" y="458" font-size="29" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">요구가 어떻게 달라졌나</text>
<rect x="60" y="484" width="480" height="230" fill="#ccf6ff" stroke="#00d0ff" stroke-width="1"/>
<text x="300" y="546" font-size="36" fill="#0096b8" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">교조 신원</text>
<text x="300" y="600" font-size="24" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">처형된 최제우의</text>
<text x="300" y="638" font-size="24" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">억울함을 풀어 달라</text>
<rect x="560" y="484" width="480" height="230" fill="#ccf6ff" stroke="#00d0ff" stroke-width="1"/>
<text x="800" y="546" font-size="36" fill="#0096b8" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">포교의 자유</text>
<text x="800" y="600" font-size="24" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">동학을 믿는다고</text>
<text x="800" y="638" font-size="24" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">잡아가지 말라</text>
<rect x="1060" y="484" width="480" height="230" fill="#ccf6ff" stroke="#00d0ff" stroke-width="1"/>
<text x="1300" y="546" font-size="36" fill="#0096b8" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">척왜양(斥倭洋)</text>
<text x="1300" y="600" font-size="24" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">일본과 서양 세력을</text>
<text x="1300" y="638" font-size="24" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">몰아내자 — 정치 구호</text>
<text x="800" y="764" font-size="27" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">조정의 대응</text>
<rect x="60" y="786" width="730" height="90" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<text x="425" y="840" font-size="23" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">양호 선무사 어윤중을 보냄</text>
<rect x="810" y="786" width="730" height="90" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<text x="1175" y="840" font-size="23" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">타일러서 흩어지게 함(장계)</text>
<text x="800" y="940" font-size="23" fill="#5d6365" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">※ 앞의 두 칸은 종교 운동의 요구, 마지막 칸은 외세 배격을 내건 정치 운동의 요구</text>
</svg>