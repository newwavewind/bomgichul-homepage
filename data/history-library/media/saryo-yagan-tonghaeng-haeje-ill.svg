<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 1000" role="img">
<title>통금 해제와 교복 자율화</title>
<desc>야간 통행 금지 해제와 중고생 교복·두발 자율화를 나란히 놓고 시작·발표·시행 시기를 정리한 그림.</desc>
<defs><marker id="ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="5.5" markerHeight="5.5" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M1 1.5 L11 6 L1 10.5 L3.6 6 z" fill="#0096b8"/></marker></defs>
<rect width="1600" height="1000" fill="#effbff"/>
<text x="60" y="92" font-size="48" fill="#2a2c2d" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">통금 해제와 교복 자율화</text>
<text x="60" y="140" font-size="28" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">1982년 1월, 신군부 정부가 내놓은 유화 정책 두 가지</text>
<text x="1540" y="92" font-size="28" fill="#0096b8" text-anchor="end" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">정리 그림</text>
<line x1="60" y1="166" x2="1540" y2="166" stroke="#00d0ff" stroke-width="1"/>
<rect x="60" y="205" width="700" height="420" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="60.5" y="205.5" width="699" height="58" fill="#ccf6ff"/>
<text x="84" y="245" font-size="29" fill="#7a62d6" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">야간 통행 금지 해제</text>
<text x="90" y="311" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">· 시작 1945년 9월</text>
<text x="108" y="365" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">미군 진주 직후부터</text>
<text x="90" y="419" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">· 해제 1982년 1월 5일 국무회의</text>
<text x="90" y="473" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">· 휴전선 접적 지역 · 해안 일부 빼고</text>
<text x="108" y="527" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">전국에서 풀림 — 37년 만</text>
<text x="90" y="581" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">· 밤 시간 생활이 크게 달라짐</text>
<rect x="840" y="205" width="700" height="420" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="840.5" y="205.5" width="699" height="58" fill="#ccf6ff"/>
<text x="864" y="245" font-size="29" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">교복 · 두발 자율화</text>
<text x="870" y="311" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">· 발표 1982년 1월 4일</text>
<text x="870" y="365" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">· 두발 1982년 1학기부터</text>
<text x="870" y="419" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">· 교복 1983년 신입생부터 전면</text>
<text x="870" y="473" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">· 1986년 2학기부터</text>
<text x="888" y="527" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">교복 착용 여부를 학교장이 정함</text>
<text x="870" y="581" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">· 대상: 중 · 고등학생</text>
<text x="60" y="690" font-size="29" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">흐름 — 강압 뒤의 유화책</text>
<rect x="60" y="715" width="340" height="80" fill="#ccf6ff" stroke="#0096b8" stroke-width="1.5"/>
<text x="230.0" y="765.08" font-size="28" fill="#0096b8" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">12 · 12 사태</text>
<line x1="404" y1="755" x2="436" y2="755" stroke="#0096b8" stroke-width="3" marker-end="url(#ah)"/>
<rect x="440" y="715" width="340" height="80" fill="#ccf6ff" stroke="#0096b8" stroke-width="1.5"/>
<text x="610.0" y="765.08" font-size="28" fill="#0096b8" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">5 · 18 진압</text>
<line x1="784" y1="755" x2="816" y2="755" stroke="#0096b8" stroke-width="3" marker-end="url(#ah)"/>
<rect x="820" y="715" width="340" height="80" fill="#ccf6ff" stroke="#0096b8" stroke-width="1.5"/>
<text x="990.0" y="765.08" font-size="28" fill="#0096b8" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">신군부 집권</text>
<line x1="1164" y1="755" x2="1196" y2="755" stroke="#0096b8" stroke-width="3" marker-end="url(#ah)"/>
<rect x="1200" y="715" width="340" height="80" fill="#ccf6ff" stroke="#0096b8" stroke-width="1.5"/>
<text x="1370.0" y="765.08" font-size="28" fill="#0096b8" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">유화 정책</text>
<rect x="60" y="860" width="1480" height="80" fill="#ccf6ff" stroke="#0096b8" stroke-width="1.5"/>
<text x="800" y="910" font-size="30" fill="#0096b8" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">통금 해제 · 교복 자율화 · 학원 자율화 = 1980년대 초 유화 정책</text>
</svg>
