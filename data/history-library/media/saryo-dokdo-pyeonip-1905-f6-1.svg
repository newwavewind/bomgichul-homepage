<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">
<title>러일 전쟁 중 일본의 독도 불법 편입(1905)</title>
<rect width="960" height="620" fill="#ffffff"/>
<text x="480.0" y="52" text-anchor="middle" font-size="30" font-weight="700" fill="#1b2a4a">러일 전쟁 중 일본의 독도 불법 편입(1905)</text>
<text x="480.0" y="84" text-anchor="middle" font-size="17" font-weight="400" fill="#5b6475">대한 제국 땅이던 독도를 전쟁 중에 몰래 자기 땅에 넣다</text>
<line x1="70" y1="250" x2="890" y2="250" stroke="#9fdcf5" stroke-width="4" stroke-linecap="round"/>
<circle cx="130" cy="250" r="11" fill="#1b2a4a" stroke="#ffffff" stroke-width="3"/>
<text x="130" y="200" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2a4a">1900</text>
<text x="130" y="226" text-anchor="middle" font-size="18" font-weight="700" fill="#1b2a4a">칙령 제41호</text>
<text x="130" y="292" text-anchor="middle" font-size="16" font-weight="400" fill="#1b2a4a">울도군이 울릉도와</text>
<text x="130" y="316" text-anchor="middle" font-size="16" font-weight="400" fill="#1b2a4a">석도(독도)를 다스림</text>
<circle cx="380" cy="250" r="11" fill="#0096d6" stroke="#ffffff" stroke-width="3"/>
<text x="380" y="200" text-anchor="middle" font-size="19" font-weight="700" fill="#0096d6">1904~1905</text>
<text x="380" y="226" text-anchor="middle" font-size="18" font-weight="700" fill="#1b2a4a">러일 전쟁</text>
<text x="380" y="292" text-anchor="middle" font-size="16" font-weight="400" fill="#1b2a4a">독도에 해군 망루 ·</text>
<text x="380" y="316" text-anchor="middle" font-size="16" font-weight="400" fill="#1b2a4a">무선 전신을 놓으려 함</text>
<circle cx="630" cy="250" r="11" fill="#0096d6" stroke="#ffffff" stroke-width="3"/>
<text x="630" y="200" text-anchor="middle" font-size="19" font-weight="700" fill="#0096d6">1905. 1. 28</text>
<text x="630" y="226" text-anchor="middle" font-size="18" font-weight="700" fill="#1b2a4a">일본의 편입 결정</text>
<text x="630" y="292" text-anchor="middle" font-size="16" font-weight="400" fill="#1b2a4a">독도를 일본 땅에 넣고</text>
<text x="630" y="316" text-anchor="middle" font-size="16" font-weight="400" fill="#1b2a4a">「다케시마」라 부름</text>
<circle cx="850" cy="250" r="11" fill="#1b2a4a" stroke="#ffffff" stroke-width="3"/>
<text x="850" y="200" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2a4a">1905</text>
<text x="850" y="226" text-anchor="middle" font-size="18" font-weight="700" fill="#1b2a4a">을사늑약</text>
<text x="850" y="292" text-anchor="middle" font-size="16" font-weight="400" fill="#1b2a4a">대한 제국이</text>
<text x="850" y="316" text-anchor="middle" font-size="16" font-weight="400" fill="#1b2a4a">외교권을 빼앗김</text>
<rect x="30" y="360" width="440" height="140" rx="10" fill="#ffffff" stroke="#9fdcf5" stroke-width="2"/>
<text x="250.0" y="398.8" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2a4a">대한 제국의 입장</text>
<text x="250.0" y="424.3" text-anchor="middle" font-size="17" font-weight="400" fill="#1b2a4a">이미 1900년에 독도를 다스리고 있었음</text>
<text x="250.0" y="449.0" text-anchor="middle" font-size="17" font-weight="400" fill="#1b2a4a">뒤늦게 알았지만 외교권이 없어</text>
<text x="250.0" y="473.6" text-anchor="middle" font-size="17" font-weight="400" fill="#1b2a4a">제대로 항의할 곳이 없었음</text>
<rect x="495" y="360" width="435" height="140" rx="10" fill="#eaf7fd" stroke="#0096d6" stroke-width="2"/>
<text x="712.5" y="411.1" text-anchor="middle" font-size="19" font-weight="700" fill="#0096d6">그래서 「불법 편입」</text>
<text x="712.5" y="436.6" text-anchor="middle" font-size="17" font-weight="400" fill="#1b2a4a">전쟁을 틈타 대한 제국의 영토를</text>
<text x="712.5" y="461.3" text-anchor="middle" font-size="17" font-weight="400" fill="#1b2a4a">몰래 빼앗은 행위로 봄</text>
<rect x="30" y="525" width="900" height="70" rx="10" fill="#ffffff" stroke="#9fdcf5" stroke-width="2" stroke-dasharray="6 5"/>
<text x="480.0" y="565.5" text-anchor="middle" font-size="18" font-weight="700" fill="#1b2a4a">시험 단서: 러일 전쟁 기간(1904~1905)에 일어난 일</text>
</svg>
