<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 1000" role="img">
<title>최영의 홍산 대첩 (1376)</title>
<desc>위는 1376년 왜구 침입부터 최영의 홍산 승리와 철원부원군 책봉까지의 흐름, 왼쪽 아래는 『고려사』가 전하는 싸움터와 최영의 활약, 오른쪽 아래는 고려 말 왜구를 무찌른 주요 싸움을 정리한 그림.</desc>
<defs>
<marker id="ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="5.5" markerHeight="5.5" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M1 1.5 L11 6 L1 10.5 L3.6 6 z" fill="#0096b8"/></marker>
<marker id="ahl" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="5.5" markerHeight="5.5" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M1 1.5 L11 6 L1 10.5 L3.6 6 z" fill="#7a62d6"/></marker>
</defs>
<rect width="1600" height="1000" fill="#effbff"/>
<text x="60" y="92" font-size="48" fill="#2a2c2d" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">최영의 홍산 대첩 (1376)</text>
<text x="60" y="140" font-size="28" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">왜구가 충청 내륙 깊이 들어오자 최영이 나서서 크게 이긴 싸움</text>
<text x="1540" y="92" font-size="28" fill="#0096b8" text-anchor="end" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">정리 그림</text>
<line x1="60" y1="166" x2="1540" y2="166" stroke="#00d0ff" stroke-width="1"/>
<rect x="60" y="190" width="1480" height="290" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/><rect x="60.5" y="190.5" width="1479" height="58" fill="#ccf6ff"/><text x="84" y="230" font-size="31" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">1376년(우왕 2) 홍산 대첩의 흐름</text><rect x="90" y="282" width="250" height="150" fill="#ccf6ff" stroke="#00d0ff" stroke-width="0.8"/><text x="215.0" y="353.0" font-size="29" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">왜구가 금강을</text><text x="215.0" y="391.0" font-size="24" fill="#5d6365" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">거슬러 오름</text><line x1="342" y1="357" x2="378" y2="357" stroke="#0096b8" stroke-width="3" marker-end="url(#ah)"/><rect x="380" y="282" width="250" height="150" fill="#ccf6ff" stroke="#00d0ff" stroke-width="0.8"/><text x="505.0" y="353.0" font-size="29" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">공주 함락</text><text x="505.0" y="391.0" font-size="24" fill="#5d6365" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">연산 개태사까지</text><line x1="632" y1="357" x2="668" y2="357" stroke="#0096b8" stroke-width="3" marker-end="url(#ah)"/><rect x="670" y="282" width="250" height="150" fill="#ccf6ff" stroke="#00d0ff" stroke-width="0.8"/><text x="795.0" y="353.0" font-size="29" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">최영 출전 자청</text><text x="795.0" y="391.0" font-size="24" fill="#5d6365" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">당시 61세</text><line x1="922" y1="357" x2="958" y2="357" stroke="#0096b8" stroke-width="3" marker-end="url(#ah)"/><rect x="960" y="282" width="250" height="150" fill="#ccf6ff" stroke="#00d0ff" stroke-width="0.8"/><text x="1085.0" y="353.0" font-size="29" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">7월 홍산 대승</text><text x="1085.0" y="391.0" font-size="24" fill="#5d6365" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">충남 부여 홍산면</text><line x1="1212" y1="357" x2="1248" y2="357" stroke="#0096b8" stroke-width="3" marker-end="url(#ah)"/><rect x="1250" y="282" width="250" height="150" fill="#ccf6ff" stroke="#00d0ff" stroke-width="0.8"/><text x="1375.0" y="353.0" font-size="29" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">철원부원군</text><text x="1375.0" y="391.0" font-size="24" fill="#5d6365" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">우왕이 봉함</text><rect x="60" y="510" width="700" height="420" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/><rect x="60.5" y="510.5" width="699" height="58" fill="#ccf6ff"/><text x="84" y="550" font-size="31" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">싸움터와 최영 (『고려사』)</text><text x="84" y="640" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">세 면이 절벽, 길은 하나뿐</text><text x="84" y="685" font-size="28" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">여러 장수가 겁내 나아가지 못함</text><text x="84" y="760" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">최영이 앞장서 돌진 → 적이 무너짐</text><text x="84" y="835" font-size="28" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">입술에 화살을 맞고도</text><text x="84" y="875" font-size="28" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">그 적을 쏘아 쓰러뜨린 뒤에 화살을 뽑음</text><rect x="800" y="510" width="740" height="420" fill="#ffffff" stroke="#0096b8" stroke-width="1.5"/><rect x="800.5" y="510.5" width="739" height="58" fill="#ccf6ff"/><text x="824" y="550" font-size="31" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">고려 말 왜구를 무찌른 싸움</text><rect x="820" y="606" width="700" height="64" fill="#ccf6ff"/><text x="840" y="650" font-size="29" fill="#0096b8" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">1376</text><text x="960" y="650" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">홍산</text><text x="1120" y="650" font-size="28" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">최영</text><text x="840" y="722" font-size="29" fill="#0096b8" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">1380</text><text x="960" y="722" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">진포</text><text x="1120" y="722" font-size="28" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">최무선 · 화포</text><text x="840" y="794" font-size="29" fill="#0096b8" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">1380</text><text x="960" y="794" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">황산</text><text x="1120" y="794" font-size="28" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">이성계</text><text x="840" y="866" font-size="29" fill="#0096b8" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">1389</text><text x="960" y="866" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">쓰시마</text><text x="1120" y="866" font-size="28" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">박위 · 근거지 공격</text>
</svg>