<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 1000" role="img">
<title>전쟁 말기 남서 해안 방어 시설</title>
<desc>중일 전쟁부터 광복까지 일제의 전시 동원 흐름과, 전쟁 말기 연합군 상륙에 대비해 남서 해안에 지은 일본군 방어 시설의 뜻을 정리한 그림.</desc>
<defs><marker id="ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="5.5" markerHeight="5.5" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M1 1.5 L11 6 L1 10.5 L3.6 6 z" fill="#0096b8"/></marker></defs>
<rect width="1600" height="1000" fill="#effbff"/>
<text x="60" y="92" font-size="48" fill="#2a2c2d" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">전쟁 말기 남서 해안 방어 시설</text>
<text x="60" y="140" font-size="28" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">연합군의 상륙을 막으려고 지은 일본군 군사 시설</text>
<text x="1540" y="92" font-size="28" fill="#0096b8" text-anchor="end" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">정리 그림</text>
<line x1="60" y1="166" x2="1540" y2="166" stroke="#00d0ff" stroke-width="1"/>
<text x="60" y="222" font-size="29" fill="#7a62d6" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">전시 동원의 흐름</text><rect x="60" y="250" width="760" height="80" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/><text x="90" y="301" font-size="29" fill="#7a62d6" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">1937</text><text x="270" y="301" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">중일 전쟁 시작</text><line x1="440" y1="332" x2="440" y2="356" stroke="#0096b8" stroke-width="2" marker-end="url(#ah)"/><rect x="60" y="360" width="760" height="80" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/><text x="90" y="411" font-size="29" fill="#7a62d6" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">1938.4</text><text x="270" y="411" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">국가 총동원법 공포</text><line x1="440" y1="442" x2="440" y2="466" stroke="#0096b8" stroke-width="2" marker-end="url(#ah)"/><rect x="60" y="470" width="760" height="80" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/><text x="90" y="521" font-size="29" fill="#7a62d6" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">1939</text><text x="270" y="521" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">국민 징용령 — 노동력 동원</text><line x1="440" y1="552" x2="440" y2="576" stroke="#0096b8" stroke-width="2" marker-end="url(#ah)"/><rect x="60" y="580" width="760" height="80" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/><text x="90" y="631" font-size="29" fill="#7a62d6" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">1941.12</text><text x="270" y="631" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">태평양 전쟁 시작</text><line x1="440" y1="662" x2="440" y2="686" stroke="#0096b8" stroke-width="2" marker-end="url(#ah)"/><rect x="60" y="690" width="760" height="80" fill="#ccf6ff" stroke="#0096b8" stroke-width="1.5"/><text x="90" y="741" font-size="29" fill="#7a62d6" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">전쟁 말기</text><text x="270" y="741" font-size="29" fill="#0096b8" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">남서 해안 방어 시설 공사</text><line x1="440" y1="772" x2="440" y2="796" stroke="#0096b8" stroke-width="2" marker-end="url(#ah)"/><rect x="60" y="800" width="760" height="80" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/><text x="90" y="851" font-size="29" fill="#7a62d6" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">1945.8</text><text x="270" y="851" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">광복</text><rect x="900" y="205" width="640" height="348" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/><rect x="900.5" y="205.5" width="639" height="58" fill="#ccf6ff"/><text x="924" y="245" font-size="29" fill="#7a62d6" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">시설의 모습</text><text x="930" y="311" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">· 자리: 목포 · 여수 등 남서 해안</text><text x="930" y="363" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">· 때: 태평양 전쟁 말기</text><text x="930" y="415" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">· 목적: 연합군의 상륙 저지</text><text x="930" y="467" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">· 같은 때: 전시 동원 체제</text><text x="930" y="519" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">· 시험 자료: 목포·여수 지도</text><rect x="900" y="600" width="640" height="296" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/><rect x="900.5" y="600.5" width="639" height="58" fill="#ccf6ff"/><text x="924" y="640" font-size="29" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">시험의 단서</text><text x="930" y="706" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">· 「연합군의 상륙 저지」</text><text x="930" y="758" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">   → 태평양 전쟁 말기</text><text x="930" y="810" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">· 그 앞: 총동원법 · 징용령</text><text x="930" y="862" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">· 민족 말살 통치기와 겹침</text></svg>
