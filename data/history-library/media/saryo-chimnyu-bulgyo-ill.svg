<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 1000" role="img">
<title>삼국의 불교 수용 — 고구려와 백제</title>
<desc>왼쪽은 372년 전진에서 순도가 와 불교를 전한 고구려, 오른쪽은 384년 동진에서 마라난타가 와 불교를 전한 백제를 나란히 놓고, 가운데에 12년 차이와 북쪽·남쪽 경로의 차이를, 아래에 이듬해 한산에 절을 세운 일을 정리한 그림.</desc>
<defs>
<marker id="ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="5.5" markerHeight="5.5" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M1 1.5 L11 6 L1 10.5 L3.6 6 z" fill="#0096b8"/></marker>
<marker id="ahl" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="5.5" markerHeight="5.5" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M1 1.5 L11 6 L1 10.5 L3.6 6 z" fill="#7a62d6"/></marker>
<filter id="plate" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#2a2c2d" flood-opacity="0.16"/></filter>
</defs>
<rect width="1600" height="1000" fill="#effbff"/>
<text x="60" y="92" font-size="48" fill="#2a2c2d" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">삼국의 불교 수용 — 고구려와 백제</text>
<text x="60" y="140" font-size="28" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">침류왕 원년(384), 백제에 불법이 처음 들어오다</text>
<text x="1540" y="92" font-size="28" fill="#0096b8" text-anchor="end" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">정리 그림</text>
<line x1="60" y1="166" x2="1540" y2="166" stroke="#00d0ff" stroke-width="1"/>
<rect x="60" y="200" width="620" height="420" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="60.5" y="200.5" width="619" height="58" fill="#ccf6ff"/>
<text x="370.0" y="240" font-size="34" fill="#0096b8" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">고구려</text>
<rect x="920" y="200" width="620" height="420" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="920.5" y="200.5" width="619" height="58" fill="#ccf6ff"/>
<text x="1230.0" y="240" font-size="34" fill="#7a62d6" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">백제</text>
<text x="370" y="325" font-size="36" fill="#0096b8" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">372년</text>
<text x="370" y="365" font-size="27" fill="#5d6365" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">소수림왕 2년</text>
<text x="370" y="425" font-size="36" fill="#0096b8" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">전진(前秦)</text>
<text x="370" y="465" font-size="27" fill="#5d6365" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">중국 북쪽 왕조</text>
<text x="370" y="525" font-size="36" fill="#0096b8" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">승려 순도</text>
<text x="370" y="565" font-size="27" fill="#5d6365" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">불상 · 불경을 전함</text>
<text x="1230" y="325" font-size="36" fill="#7a62d6" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">384년</text>
<text x="1230" y="365" font-size="27" fill="#5d6365" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">침류왕 원년</text>
<text x="1230" y="425" font-size="36" fill="#7a62d6" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">동진(東晉)</text>
<text x="1230" y="465" font-size="27" fill="#5d6365" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">중국 남쪽 왕조</text>
<text x="1230" y="525" font-size="36" fill="#7a62d6" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">승려 마라난타</text>
<text x="1230" y="565" font-size="27" fill="#5d6365" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">왕이 궁 안에 모심</text>
<rect x="700" y="300" width="200" height="70" fill="#ffffff" stroke="#0096b8" stroke-width="0.8"/>
<text x="800.0" y="345.8" font-size="30" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">12년 차이</text>
<line x1="700" y1="410" x2="900" y2="410" stroke="#0096b8" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="800" y="480" font-size="25" fill="#5d6365" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">전한 곳도 다름</text>
<text x="800" y="525" font-size="27" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">북쪽 ↔ 남쪽</text>
<rect x="60" y="660" width="1480" height="270" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<text x="90" y="715" font-size="30" fill="#7a62d6" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">백제 쪽 기록</text>
<text x="90" y="770" font-size="28" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">384년 9월  서역 승려 마라난타가 동진에서 오자, 왕이 맞이해 예를 갖추어 공경함</text>
<text x="250" y="820" font-size="28" fill="#7a62d6" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">→ 「불법(佛法)이 이로부터 시작되었다」</text>
<text x="90" y="880" font-size="28" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">385년 2월  한산에 절을 세우고 승려 10명을 둠</text>
</svg>
