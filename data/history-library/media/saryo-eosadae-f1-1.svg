<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">
<title>고려의 어사대와 대간</title>
<desc>어사대의 이름 변천(사헌대·어사대·사헌부), 어사대와 중서문하성 낭사로 이루어진 대간, 대간의 간쟁·봉박·서경 권한, 사료 속 장면을 정리한 그림.</desc>
<rect width="960" height="640" fill="#ffffff"/>
<text x="40" y="58" font-size="30" font-weight="700" fill="#1b2a4a">고려의 어사대와 대간</text>
<text x="40" y="92" font-size="19" fill="#4a5876">정치의 잘잘못을 따지고 관리를 감찰하던 관청</text>
<text x="920" y="58" font-size="18" fill="#0a8fc2" text-anchor="end">정리 그림</text>
<line x1="40" y1="112" x2="920" y2="112" stroke="#7fd3f0" stroke-width="1.5"/>
<g font-size="19" text-anchor="middle">
<rect x="40" y="134" width="190" height="64" rx="8" fill="#ffffff" stroke="#7fd3f0"/>
<text x="135" y="164" font-weight="700" fill="#1b2a4a">사헌대</text><text x="135" y="188" font-size="15" fill="#4a5876">고려 초</text>
<rect x="290" y="134" width="190" height="64" rx="8" fill="#e3f5fc" stroke="#0a8fc2" stroke-width="2"/>
<text x="385" y="164" font-weight="700" fill="#0a8fc2">어사대</text><text x="385" y="188" font-size="15" fill="#4a5876">995년(성종 14)</text>
<rect x="540" y="134" width="190" height="64" rx="8" fill="#ffffff" stroke="#7fd3f0"/>
<text x="635" y="164" font-weight="700" fill="#1b2a4a">사헌부</text><text x="635" y="188" font-size="15" fill="#4a5876">1369년(공민왕 18)</text>
<rect x="790" y="134" width="130" height="64" rx="8" fill="#ffffff" stroke="#7fd3f0"/>
<text x="855" y="164" font-weight="700" fill="#1b2a4a">조선</text><text x="855" y="188" font-size="15" fill="#4a5876">사헌부로 이어짐</text>
</g>
<g stroke="#0a8fc2" stroke-width="2.5" fill="none" stroke-linecap="round"><path d="M236 166 H282 m-9 -8 l9 8 l-9 8"/><path d="M486 166 H532 m-9 -8 l9 8 l-9 8"/><path d="M736 166 H782 m-9 -8 l9 8 l-9 8"/></g>
<rect x="40" y="226" width="420" height="200" rx="10" fill="#ffffff" stroke="#0a8fc2" stroke-width="2"/>
<text x="64" y="262" font-size="20" font-weight="700" fill="#0a8fc2">대간 = 두 관청의 관리</text>
<rect x="64" y="282" width="170" height="70" rx="8" fill="#e3f5fc" stroke="#7fd3f0"/>
<text x="149" y="315" font-size="20" font-weight="700" fill="#1b2a4a" text-anchor="middle">어사대</text>
<text x="149" y="339" font-size="15" fill="#4a5876" text-anchor="middle">감찰·탄핵</text>
<text x="250" y="324" font-size="26" font-weight="700" fill="#0a8fc2" text-anchor="middle">+</text>
<rect x="266" y="282" width="170" height="70" rx="8" fill="#e3f5fc" stroke="#7fd3f0"/>
<text x="351" y="315" font-size="20" font-weight="700" fill="#1b2a4a" text-anchor="middle">낭사</text>
<text x="351" y="339" font-size="15" fill="#4a5876" text-anchor="middle">중서문하성 소속</text>
<text x="64" y="388" font-size="17" fill="#1b2a4a">맡은 일: 시정을 논하고 풍속을 바로잡으며</text>
<text x="64" y="412" font-size="17" fill="#1b2a4a">관리의 잘못을 살펴 벌주기를 아룀</text>
<rect x="500" y="226" width="420" height="200" rx="10" fill="#ffffff" stroke="#0a8fc2" stroke-width="2"/>
<text x="524" y="262" font-size="20" font-weight="700" fill="#0a8fc2">대간의 세 권한</text>
<g font-size="18" fill="#1b2a4a">
<text x="524" y="302"><tspan font-weight="700">간쟁</tspan> — 왕의 잘못을 따져 말함</text>
<text x="524" y="344"><tspan font-weight="700">봉박</tspan> — 잘못된 왕명을 되돌려 보냄</text>
<text x="524" y="386"><tspan font-weight="700">서경</tspan> — 관리 임명·법 제정에 동의</text>
</g>
<text x="524" y="414" font-size="15" fill="#4a5876">왕권을 견제하는 장치</text>
<rect x="40" y="454" width="880" height="156" rx="10" fill="#e3f5fc" stroke="#7fd3f0"/>
<text x="64" y="490" font-size="20" font-weight="700" fill="#0a8fc2">사료 속 장면</text>
<g font-size="17" fill="#1b2a4a" text-anchor="middle">
<rect x="64" y="510" width="240" height="78" rx="8" fill="#ffffff" stroke="#7fd3f0"/>
<text x="184" y="542">죄를 지은 관리를</text><text x="184" y="568">벌하자는 청이 올라옴</text>
<rect x="360" y="510" width="240" height="78" rx="8" fill="#ffffff" stroke="#7fd3f0"/>
<text x="480" y="542">왕: 「가벼운 벌을</text><text x="480" y="568">적용하라」</text>
<rect x="656" y="510" width="240" height="78" rx="8" fill="#ffffff" stroke="#0a8fc2" stroke-width="2"/>
<text x="776" y="542" font-weight="700">어사대: 「법대로」</text><text x="776" y="568">→ 왕이 받아들임</text>
</g>
<g stroke="#0a8fc2" stroke-width="2.5" fill="none" stroke-linecap="round"><path d="M310 549 H352 m-9 -8 l9 8 l-9 8"/><path d="M606 549 H648 m-9 -8 l9 8 l-9 8"/></g>
</svg>
