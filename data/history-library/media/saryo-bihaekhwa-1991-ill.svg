<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 1000" role="img">
<title>한반도 비핵화 공동 선언(1991)</title>
<desc>1991년 9월 남북한 유엔 동시 가입, 12월 13일 남북 기본 합의서 채택, 12월 31일 비핵화 공동 선언 합의, 1992년 2월 19일 발효를 잇는 연표와 약속한 것·갖지 않을 시설·검증 절차를 정리한 카드로 된 정리 그림.</desc>
<rect width="1600" height="1000" fill="#effbff"/>
<text x="60" y="92" font-size="48" fill="#2a2c2d" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">한반도 비핵화 공동 선언(1991)</text>
<text x="60" y="140" font-size="28" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">노태우 정부 때 남북이 맺은 핵 관련 합의</text>
<text x="1540" y="92" font-size="28" fill="#0096b8" text-anchor="end" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">정리 그림</text>
<line x1="60" y1="166" x2="1540" y2="166" stroke="#00d0ff" stroke-width="1"/>
<rect x="60" y="190" width="1480" height="270" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<line x1="100" y1="290" x2="1500" y2="290" stroke="#00d0ff" stroke-width="1.2"/>
<circle cx="245" cy="290" r="8" fill="#ffffff" stroke="#5d6365" stroke-width="2"/>
<text x="245" y="262" font-size="27" fill="#5d6365" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">1991. 9.</text>
<text x="245" y="340" font-size="25" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">남북한</text>
<text x="245" y="376" font-size="25" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">유엔 동시 가입</text>
<circle cx="615" cy="290" r="8" fill="#ffffff" stroke="#5d6365" stroke-width="2"/>
<text x="615" y="262" font-size="27" fill="#5d6365" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">1991. 12. 13.</text>
<text x="615" y="340" font-size="25" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">남북 기본 합의서</text>
<text x="615" y="376" font-size="25" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">채택</text>
<circle cx="985" cy="290" r="12" fill="#ccf6ff" stroke="#0096b8" stroke-width="2"/>
<text x="985" y="262" font-size="27" fill="#0096b8" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">1991. 12. 31.</text>
<text x="985" y="340" font-size="25" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">비핵화 공동 선언</text>
<text x="985" y="376" font-size="25" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">합의</text>
<circle cx="1355" cy="290" r="12" fill="#ccf6ff" stroke="#7a62d6" stroke-width="2"/>
<text x="1355" y="262" font-size="27" fill="#7a62d6" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">1992. 2. 19.</text>
<text x="1355" y="340" font-size="25" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">기본 합의서와 함께</text>
<text x="1355" y="376" font-size="25" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">발효</text>
<rect x="60" y="490" width="473" height="450" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="60.5" y="490.5" width="472" height="62" fill="#ccf6ff"/>
<text x="86" y="533" font-size="31" fill="#5d6365" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">약속한 것</text>
<text x="90" y="620" font-size="30" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">핵무기를</text>
<text x="90" y="674" font-size="30" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">시험·제조·생산·접수</text>
<text x="90" y="728" font-size="30" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">보유·저장·배비·사용</text>
<text x="90" y="782" font-size="30" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">하지 않음</text>
<text x="90" y="836" font-size="30" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">핵에너지는 평화 목적에만</text>
<rect x="564" y="490" width="473" height="450" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="564.5" y="490.5" width="472" height="62" fill="#ccf6ff"/>
<text x="590" y="533" font-size="31" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">갖지 않을 시설</text>
<text x="594" y="620" font-size="30" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">핵 재처리 시설</text>
<text x="594" y="674" font-size="30" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">우라늄 농축 시설</text>
<text x="594" y="746" font-size="30" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">핵무기 재료를 만드는</text>
<text x="594" y="800" font-size="30" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">길을 막겠다는 뜻</text>
<rect x="1067" y="490" width="473" height="450" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="1067.5" y="490.5" width="472" height="62" fill="#ccf6ff"/>
<text x="1093" y="533" font-size="31" fill="#7a62d6" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">검증 방법</text>
<text x="1097" y="620" font-size="30" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">상대측이 고른 대상을</text>
<text x="1097" y="674" font-size="30" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">사찰함</text>
<text x="1097" y="746" font-size="30" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">남북 핵 통제</text>
<text x="1097" y="800" font-size="30" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">공동 위원회 구성</text>
</svg>
