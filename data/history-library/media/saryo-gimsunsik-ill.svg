<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 1000" role="img">
<title>명주 장군 김순식의 귀부</title>
<desc>왼쪽은 명주(강릉) 장군 순식이 고려에 귀순하기까지의 흐름도, 오른쪽은 태조가 호족을 끌어안고 다스린 방법을 정리한 그림.</desc>
<defs>
<marker id="ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="5.5" markerHeight="5.5" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M1 1.5 L11 6 L1 10.5 L3.6 6 z" fill="#0096b8"/></marker>
<marker id="ahl" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="5.5" markerHeight="5.5" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M1 1.5 L11 6 L1 10.5 L3.6 6 z" fill="#7a62d6"/></marker>
</defs>
<rect width="1600" height="1000" fill="#effbff"/>
<text x="60" y="92" font-size="48" fill="#2a2c2d" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">명주 장군 김순식의 귀부</text>
<text x="60" y="140" font-size="28" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">강릉의 큰 호족이 왕씨 성을 받기까지 (922~936)</text>
<text x="1540" y="92" font-size="28" fill="#0096b8" text-anchor="end" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">정리 그림</text>
<line x1="60" y1="166" x2="1540" y2="166" stroke="#00d0ff" stroke-width="1"/><rect x="60" y="205" width="860" height="82" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<text x="90" y="256" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">명주(강릉) 장군 순식, 오랫동안 고려에 따르지 않음</text>
<line x1="490.0" y1="289" x2="490.0" y2="323" stroke="#0096b8" stroke-width="2" marker-end="url(#ah)"/>
<rect x="60" y="327" width="860" height="82" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<text x="90" y="378" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">태조가 승려가 된 순식의 아버지를 보내 타이름</text>
<line x1="490.0" y1="411" x2="490.0" y2="445" stroke="#0096b8" stroke-width="2" marker-end="url(#ah)"/>
<rect x="60" y="449" width="860" height="82" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<text x="90" y="500" font-size="29" fill="#0096b8" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">922년(태조 5) 맏아들 수원을 보내 귀순</text>
<line x1="490.0" y1="533" x2="490.0" y2="567" stroke="#0096b8" stroke-width="2" marker-end="url(#ah)"/>
<rect x="60" y="571" width="860" height="82" fill="#ccf6ff" stroke="#0096b8" stroke-width="1.5"/>
<text x="90" y="622" font-size="29" fill="#0096b8" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">수원에게 왕씨 성과 밭·집을 내림</text>
<line x1="490.0" y1="655" x2="490.0" y2="689" stroke="#0096b8" stroke-width="2" marker-end="url(#ah)"/>
<rect x="60" y="693" width="860" height="82" fill="#ccf6ff" stroke="#0096b8" stroke-width="1.5"/>
<text x="90" y="744" font-size="29" fill="#0096b8" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">순식도 와서 왕씨 성과 대광 벼슬을 받음</text>
<rect x="980" y="205" width="560" height="442" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="980.5" y="205.5" width="559" height="58" fill="#ccf6ff"/>
<text x="1004" y="245" font-size="29" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">태조의 호족 정책</text>
<text x="1010" y="315" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">끌어안기</text>
<text x="1010" y="367" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">· 사성 — 왕씨 성 내리기</text>
<text x="1010" y="419" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">· 혼인 — 호족의 딸과 혼인</text>
<text x="1010" y="471" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">· 관직과 토지 주기</text>
<text x="1010" y="523" font-size="27" fill="#7a62d6" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">견제하기</text>
<text x="1010" y="575" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">· 사심관 제도</text>
<text x="1010" y="627" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">· 기인 제도</text>
<rect x="60" y="800" width="1480" height="140" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/><text x="90" y="855" font-size="29" fill="#7a62d6" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">936년 일리천 전투</text><text x="90" y="905" font-size="28" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">왕순식은 명주 군사를 이끌고 태조와 함께 싸워 후백제를 무너뜨리는 데 힘을 보탬</text>
</svg>
