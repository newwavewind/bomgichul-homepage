<text x="423.0" y="472.0" font-size="27" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">계사일록</text>
<rect x="548" y="380" width="214" height="168" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="548.5" y="380.5" width="213" height="48" fill="#ccf6ff"/>
<text x="655.0" y="414.0" font-size="28" fill="#0096b8" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">3책</text>
<text x="655.0" y="472.0" font-size="27" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">갑오일록</text>
<rect x="780" y="380" width="214" height="168" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="780.5" y="380.5" width="213" height="48" fill="#ccf6ff"/>
<text x="887.0" y="414.0" font-size="28" fill="#0096b8" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">4책</text>
<text x="887.0" y="472.0" font-size="27" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">을미 · 병신</text>
<text x="887.0" y="512.0" font-size="27" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">· 정유일록</text>
<rect x="1012" y="380" width="214" height="168" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="1012.5" y="380.5" width="213" height="48" fill="#ccf6ff"/>
<text x="1119.0" y="414.0" font-size="28" fill="#0096b8" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">5 · 6책</text>
<text x="1119.0" y="472.0" font-size="27" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">정유일록</text>
<rect x="1244" y="380" width="214" height="168" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="1244.5" y="380.5" width="213" height="48" fill="#ccf6ff"/>
<text x="1351.0" y="414.0" font-size="28" fill="#0096b8" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">7책</text>
<text x="1351.0" y="472.0" font-size="27" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">기해 · 경자</text>
<text x="1351.0" y="512.0" font-size="27" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">· 신축일록</text>
<text x="800.0" y="600.0" font-size="27" fill="#5d6365" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">책 이름은 『시전』의 「쇄혜미혜 유리지자」(초라하게 떠도는 사람)에서 따옴</text>
<rect x="60" y="630" width="472" height="300" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="60.5" y="630.5" width="471" height="58" fill="#ccf6ff"/>
<text x="84.0" y="670.5" font-size="32" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">전쟁 기록</text>
<text x="84.0" y="732.0" font-size="28" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">각지의 전황 · 용인 전투의 패배</text>
<text x="84.0" y="769.5" font-size="28" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">명군의 원병과 화의</text>
<text x="84.0" y="807.0" font-size="28" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">곽재우 · 김면 · 김천일 · 고경명</text>
<text x="84.0" y="844.6" font-size="28" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">· 김덕령 · 조헌 등 의병 활동</text>
<rect x="564" y="630" width="472" height="300" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="564.5" y="630.5" width="471" height="58" fill="#ccf6ff"/>
<text x="588.0" y="670.5" font-size="32" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">백성의 삶</text>
<text x="588.0" y="732.0" font-size="28" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">피란민이 떠돎</text>
<text x="588.0" y="769.5" font-size="28" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">굶주림과 유행병</text>
<text x="588.0" y="807.0" font-size="28" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">군사 징발 · 군량 조달로</text>
<text x="588.0" y="844.6" font-size="28" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">농민이 흩어짐</text>
<rect x="1068" y="630" width="472" height="300" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="1068.5" y="630.5" width="471" height="58" fill="#ccf6ff"/>
<text x="1092.0" y="670.5" font-size="32" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">지방 사회</text>
<text x="1092.0" y="732.0" font-size="28" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">수령 · 아전 · 향청 좌수</text>
<text x="1092.0" y="769.5" font-size="28" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">공물 징수 · 군량 수송</text>
<text x="1092.0" y="807.0" font-size="28" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">노비의 신공 · 매매 · 소송</text>
<text x="1092.0" y="844.6" font-size="28" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">각지의 산물과 풍속</text>
