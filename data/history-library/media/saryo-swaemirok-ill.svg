<text x="60.0" y="140.0" font-size="28" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">1591년 11월 27일 한양을 떠난 날부터 1601년 2월 27일까지 · 7책 필사본</text>
