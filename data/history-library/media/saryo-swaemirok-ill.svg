<text x="191.0" y="472.0" font-size="27" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">임진남행일록</text>
<text x="191.0" y="512.0" font-size="27" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">임진일기</text>
<rect x="316" y="380" width="214" height="168" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="316.5" y="380.5" width="213" height="48" fill="#ccf6ff"/>
