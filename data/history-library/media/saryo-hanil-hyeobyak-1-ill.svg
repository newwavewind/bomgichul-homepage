<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img">
<title>제1차 한일 협약(1904) — 고문 정치</title>
<desc>위는 1904년 2월 한일 의정서에서 8월 제1차 한일 협약, 1905년 을사늑약, 1907년 한일 신협약, 1910년 병합 조약으로 이어지는 흐름, 가운데는 협약의 세 항목과 그에 따라 들어온 고문을 정리한 그림.</desc>
<defs><marker id="ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="5.5" markerHeight="5.5" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M1 1.5 L11 6 L1 10.5 L3.6 6 z" fill="#0096b8"/></marker></defs>
<rect width="1600" height="1000" fill="#effbff"/>
<text x="60" y="92" font-size="46" fill="#2a2c2d" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">제1차 한일 협약(1904) — 고문 정치</text>
<text x="60" y="140" font-size="28" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">러일 전쟁 중 일본이 대한 제국의 재정·외교에 고문을 들여보낸 협정</text>
<text x="1540" y="92" font-size="28" fill="#0096b8" text-anchor="end" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">정리 그림</text>
<line x1="60" y1="166" x2="1540" y2="166" stroke="#00d0ff" stroke-width="1"/>
<rect x="60" y="190" width="1480" height="210" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<line x1="110" y1="290" x2="1490" y2="290" stroke="#00d0ff" stroke-width="1.2" marker-end="url(#ah)"/>
<circle cx="248" cy="290" r="9" fill="#00d0ff" stroke="#0096b8" stroke-width="1"/>
<text x="248" y="268" font-size="27" fill="#0096b8" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">1904.2</text>
<text x="248" y="334" font-size="24" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">한일 의정서</text>
<text x="248" y="372" font-size="21" fill="#5d6365" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">러일 전쟁 직후</text>
<circle cx="524" cy="290" r="9" fill="#0096b8" stroke="#0096b8" stroke-width="1"/>
<text x="524" y="268" font-size="27" fill="#0096b8" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">1904.8.22</text>
<text x="524" y="334" font-size="24" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">제1차 한일 협약</text>
<text x="524" y="372" font-size="21" fill="#5d6365" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">고문 정치</text>
<rect x="394" y="226" width="260" height="160" fill="none" stroke="#0096b8" stroke-width="1.5" stroke-dasharray="6 5"/>
<circle cx="800" cy="290" r="9" fill="#00d0ff" stroke="#0096b8" stroke-width="1"/>
<text x="800" y="268" font-size="27" fill="#0096b8" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">1905.11</text>
<text x="800" y="334" font-size="24" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">을사늑약</text>
<text x="800" y="372" font-size="21" fill="#5d6365" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">외교권 · 통감</text>
<circle cx="1076" cy="290" r="9" fill="#00d0ff" stroke="#0096b8" stroke-width="1"/>
<text x="1076" y="268" font-size="27" fill="#0096b8" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">1907.7</text>
<text x="1076" y="334" font-size="24" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">한일 신협약</text>
<text x="1076" y="372" font-size="21" fill="#5d6365" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">차관 정치</text>
<circle cx="1352" cy="290" r="9" fill="#00d0ff" stroke="#0096b8" stroke-width="1"/>
<text x="1352" y="268" font-size="27" fill="#0096b8" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">1910.8</text>
<text x="1352" y="334" font-size="24" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">병합 조약</text>
<text x="1352" y="372" font-size="21" fill="#5d6365" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">국권 상실</text>
<text x="800" y="458" font-size="29" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">협약의 세 항목</text>
<rect x="60" y="484" width="480" height="230" fill="#ccf6ff" stroke="#00d0ff" stroke-width="1"/>
<text x="300" y="546" font-size="36" fill="#0096b8" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">재정 고문</text>
<text x="300" y="600" font-size="23" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">일본 정부 추천 일본인</text>
<text x="300" y="638" font-size="23" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">재무는 모두 의견을 물음</text>
<text x="300" y="676" font-size="23" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">→ 메가타</text>
<rect x="560" y="484" width="480" height="230" fill="#ccf6ff" stroke="#00d0ff" stroke-width="1"/>
<text x="800" y="546" font-size="36" fill="#0096b8" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">외교 고문</text>
<text x="800" y="600" font-size="23" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">일본 정부 추천 외국인</text>
<text x="800" y="638" font-size="23" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">외교 요무는 의견을 물음</text>
<text x="800" y="676" font-size="23" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">→ 미국인 스티븐스</text>
<rect x="1060" y="484" width="480" height="230" fill="#ccf6ff" stroke="#00d0ff" stroke-width="1"/>
<text x="1300" y="546" font-size="36" fill="#0096b8" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">제3항</text>
<text x="1300" y="600" font-size="23" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">외국과 조약을 맺을 때</text>
<text x="1300" y="638" font-size="23" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">미리 일본과</text>
<text x="1300" y="676" font-size="23" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">상의할 것</text>
<text x="800" y="940" font-size="23" fill="#5d6365" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">※ 외부대신 서리 윤치호와 일본 공사 하야시 곤스케가 조인 — 외교·재정 주권을 빼앗는 첫걸음</text>
</svg>