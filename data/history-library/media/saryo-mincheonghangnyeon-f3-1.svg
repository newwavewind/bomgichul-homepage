<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">
<title>민청학련 사건(1974)</title>
<desc>1972년 유신 헌법부터 1974년 긴급 조치 제4호, 민청학련 사건 조작과 군사 재판, 인혁당 재건위 관련자 사형, 1976년 3·1 민주 구국 선언까지의 흐름을 정리한 그림</desc>
<rect width="960" height="600" fill="#ffffff"/>
<text x="40" y="62" font-size="32" fill="#1c2b4a" text-anchor="start" font-weight="700">민청학련 사건</text>
<text x="40" y="98" font-size="19" fill="#55627a" text-anchor="start">1974년 · 유신 체제와 긴급 조치</text>
<text x="920" y="62" font-size="17" fill="#00a3d9" text-anchor="end" font-weight="700">정리 그림</text>
<line x1="40" y1="118" x2="920" y2="118" stroke="#00a3d9" stroke-width="2"/>
<rect x="40" y="160" width="880" height="175" rx="10" fill="#ffffff" stroke="#9fdcf2" stroke-width="1.5"/>
<line x1="70" y1="230" x2="890" y2="230" stroke="#00a3d9" stroke-width="3"/>
<circle cx="152" cy="230" r="8" fill="#ffffff" stroke="#00a3d9" stroke-width="3"/>
<text x="152" y="206" font-size="18" fill="#55627a" text-anchor="middle" font-weight="700">1972</text>
<text x="152" y="266" font-size="17" fill="#1c2b4a" text-anchor="middle">유신 헌법</text>
<text x="152" y="291" font-size="17" fill="#1c2b4a" text-anchor="middle">긴급 조치 권한</text>
<circle cx="316" cy="230" r="8" fill="#ffffff" stroke="#00a3d9" stroke-width="3"/>
<text x="316" y="206" font-size="18" fill="#55627a" text-anchor="middle" font-weight="700">1974 봄</text>
<text x="316" y="266" font-size="17" fill="#1c2b4a" text-anchor="middle">대학생들</text>
<text x="316" y="291" font-size="17" fill="#1c2b4a" text-anchor="middle">유신 반대 시위 준비</text>
<circle cx="480" cy="230" r="11" fill="#00a3d9" stroke="#00a3d9" stroke-width="3"/>
<text x="480" y="206" font-size="18" fill="#00a3d9" text-anchor="middle" font-weight="700">1974</text>
<text x="480" y="266" font-size="17" fill="#1c2b4a" text-anchor="middle" font-weight="700">긴급 조치</text>
<text x="480" y="291" font-size="17" fill="#1c2b4a" text-anchor="middle">제4호</text>
<circle cx="644" cy="230" r="8" fill="#ffffff" stroke="#00a3d9" stroke-width="3"/>
<text x="644" y="206" font-size="18" fill="#55627a" text-anchor="middle" font-weight="700">군사 법정</text>
<text x="644" y="266" font-size="17" fill="#1c2b4a" text-anchor="middle">사형·무기 징역</text>
<text x="644" y="291" font-size="17" fill="#1c2b4a" text-anchor="middle">선고</text>
<circle cx="808" cy="230" r="8" fill="#ffffff" stroke="#00a3d9" stroke-width="3"/>
<text x="808" y="206" font-size="18" fill="#55627a" text-anchor="middle" font-weight="700">1976</text>
<text x="808" y="266" font-size="17" fill="#1c2b4a" text-anchor="middle">3·1 민주</text>
<text x="808" y="291" font-size="17" fill="#1c2b4a" text-anchor="middle">구국 선언</text>
<rect x="40" y="370" width="280" height="170" rx="10" fill="#ffffff" stroke="#9fdcf2" stroke-width="1.5"/>
<rect x="40" y="370" width="280" height="46" rx="10" fill="#e3f6fd"/>
<rect x="40" y="400" width="280" height="16" fill="#e3f6fd"/>
<text x="180" y="401" font-size="19" fill="#0a6f94" text-anchor="middle" font-weight="700">정부의 주장</text>
<text x="60" y="450" font-size="17" fill="#1c2b4a" text-anchor="start">「민청학련」이라는 조직이</text>
<text x="60" y="478" font-size="17" fill="#1c2b4a" text-anchor="start">나라를 뒤엎으려 함</text>
<text x="60" y="506" font-size="17" fill="#1c2b4a" text-anchor="start">뒤에는 「인혁당 재건위」</text>
<rect x="340" y="370" width="280" height="170" rx="10" fill="#ffffff" stroke="#9fdcf2" stroke-width="1.5"/>
<rect x="340" y="370" width="280" height="46" rx="10" fill="#e3f6fd"/>
<rect x="340" y="400" width="280" height="16" fill="#e3f6fd"/>
<text x="480" y="401" font-size="19" fill="#0a6f94" text-anchor="middle" font-weight="700">실제</text>
<text x="360" y="450" font-size="17" fill="#1c2b4a" text-anchor="start">민청학련은 학생들이</text>
<text x="360" y="478" font-size="17" fill="#1c2b4a" text-anchor="start">유인물에 쓰던 이름</text>
<text x="360" y="506" font-size="17" fill="#1c2b4a" text-anchor="start">1,024명 조사, 180명 구속</text>
<rect x="640" y="370" width="280" height="170" rx="10" fill="#ffffff" stroke="#9fdcf2" stroke-width="1.5"/>
<rect x="640" y="370" width="280" height="46" rx="10" fill="#e3f6fd"/>
<rect x="640" y="400" width="280" height="16" fill="#e3f6fd"/>
<text x="780" y="401" font-size="19" fill="#0a6f94" text-anchor="middle" font-weight="700">결과</text>
<text x="660" y="450" font-size="17" fill="#1c2b4a" text-anchor="start">인혁당 재건위와 엮인</text>
<text x="660" y="478" font-size="17" fill="#1c2b4a" text-anchor="start">8명 사형</text>
<text x="660" y="506" font-size="17" fill="#1c2b4a" text-anchor="start">민주화 운동 탄압의 본보기</text>
<text x="480" y="570" font-size="16" fill="#55627a" text-anchor="middle">긴급 조치로 학생 시위를 정부 전복 음모로 몰아간 사건</text>
</svg>
