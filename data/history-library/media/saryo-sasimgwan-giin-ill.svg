<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 1000" role="img">
<title>사심관과 기인 제도</title>
<desc>왼쪽은 사심관 제도, 오른쪽은 기인 제도의 시작과 내용을 정리하고, 가운데 화살표로 개경과 지방 사이에서 두 제도가 움직인 방향을 보인 그림.</desc>
<defs>
<marker id="ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="5.5" markerHeight="5.5" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M1 1.5 L11 6 L1 10.5 L3.6 6 z" fill="#0096b8"/></marker>
<marker id="ahl" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="5.5" markerHeight="5.5" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M1 1.5 L11 6 L1 10.5 L3.6 6 z" fill="#7a62d6"/></marker>
</defs>
<rect width="1600" height="1000" fill="#effbff"/>
<text x="60" y="92" font-size="48" fill="#2a2c2d" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">사심관과 기인 제도</text>
<text x="60" y="140" font-size="28" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">고려 초, 지방관 없이 지방 세력을 다스린 두 수단</text>
<text x="1540" y="92" font-size="28" fill="#0096b8" text-anchor="end" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">정리 그림</text>
<line x1="60" y1="166" x2="1540" y2="166" stroke="#00d0ff" stroke-width="1"/>
<rect x="600" y="205" width="400" height="96" fill="#ccf6ff" stroke="#0096b8" stroke-width="1.5"/><text x="800" y="264" font-size="32" fill="#0096b8" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">개경(중앙)</text>
<rect x="600" y="560" width="400" height="96" fill="#ccf6ff" stroke="#0096b8" stroke-width="1.5"/><text x="800" y="619" font-size="32" fill="#0096b8" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">지방(고향 고을)</text>
<line x1="700" y1="305" x2="700" y2="552" stroke="#0096b8" stroke-width="2" marker-end="url(#ah)"/><text x="684" y="410" font-size="27" fill="#0096b8" text-anchor="end" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">사심관</text><text x="684" y="446" font-size="24" fill="#5d6365" text-anchor="end" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">출신 고장</text><text x="684" y="478" font-size="24" fill="#5d6365" text-anchor="end" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">책임을 짐</text>
<line x1="900" y1="552" x2="900" y2="309" stroke="#7a62d6" stroke-width="2" marker-end="url(#ahl)"/><text x="916" y="410" font-size="27" fill="#7a62d6" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">기인</text><text x="916" y="446" font-size="24" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">향리 자제가</text><text x="916" y="478" font-size="24" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">개경에 머묾</text>
<rect x="60" y="205" width="440" height="520" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="60.5" y="205.5" width="439" height="58" fill="#ccf6ff"/>
<text x="84" y="245" font-size="29" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">사심관</text>
<text x="90" y="315" font-size="27" fill="#0096b8" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">935년(태조 18) 시작</text>
<text x="90" y="367" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">경순왕 김부를</text>
<text x="90" y="419" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">경주 사심관으로 삼음</text>
<text x="90" y="471" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">공신들도 저마다</text>
<text x="90" y="523" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">자기 고장 사심관이 됨</text>
<text x="90" y="575" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">부호장 이하 향직을 맡음</text>
<text x="90" y="627" font-size="27" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">1318년(충숙왕 5) 폐지</text>
<rect x="1100" y="205" width="440" height="520" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="1100.5" y="205.5" width="439" height="58" fill="#ccf6ff"/>
<text x="1124" y="245" font-size="29" fill="#7a62d6" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">기인</text>
<text x="1130" y="315" font-size="27" fill="#7a62d6" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">나라 초기에 시작</text>
<text x="1130" y="367" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">향리의 자제를 뽑아</text>
<text x="1130" y="419" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">개경에 볼모로 머물게 함</text>
<text x="1130" y="471" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">그 고장 일에 대해</text>
<text x="1130" y="523" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">묻는 데 대비함</text>
<text x="1130" y="575" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">신라 상수리 제도를</text>
<text x="1130" y="627" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">이어받은 것</text>
<rect x="60" y="780" width="1480" height="160" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/><text x="90" y="835" font-size="29" fill="#7a62d6" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">두 제도의 공통점</text><text x="90" y="885" font-size="28" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">지방관을 보내기 어렵던 고려 초, 지방 호족을 중앙에 묶어 두고 책임을 지게 한 방법</text><text x="1510" y="925" font-size="25" fill="#5d6365" text-anchor="end" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">태조의 호족 통합·견제 정책 · 함께 출제</text>
</svg>
