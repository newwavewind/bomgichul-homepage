<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 1000" role="img">
<title>창원 다호리 1호분 — 붓이 말해 주는 것</title>
<desc>다호리 1호분에서 나온 옻칠 붓과 손칼, 칼집·활·잔·부채 같은 칠기, 성운경·오수전, 철기를 무리 지어 보이고, 철 생산과 한·낙랑과의 교역, 기록을 남겼을 가능성으로 이어지는 흐름을 정리한 그림.</desc>
<defs>
<marker id="ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="5.5" markerHeight="5.5" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M1 1.5 L11 6 L1 10.5 L3.6 6 z" fill="#0096b8"/></marker>
</defs>
<rect width="1600" height="1000" fill="#effbff"/>

<text x="60" y="92" font-size="48" fill="#2a2c2d" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">창원 다호리 1호분 — 붓이 말해 주는 것</text>
<text x="60" y="140" font-size="28" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">경상남도 창원시 의창구 동읍 · 서기전 1세기 후반 널무덤 · 1988년 사적</text>
<text x="1540" y="92" font-size="28" fill="#0096b8" text-anchor="end" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">정리 그림</text>
<line x1="60" y1="166" x2="1540" y2="166" stroke="#00d0ff" stroke-width="1"/>
<rect x="60" y="200" width="470" height="224" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="60.5" y="200.5" width="469" height="58" fill="#ccf6ff"/>
<text x="84" y="240.5" font-size="30" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">붓 · 손칼</text>
<text x="84" y="303" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">옻칠한 나무 붓</text>
<text x="84" y="344.2" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">함께 나온 손칼</text>
<text x="84" y="385.4" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">오늘날 연필 · 지우개 구실</text>
<rect x="565" y="200" width="470" height="224" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="565.5" y="200.5" width="469" height="58" fill="#ccf6ff"/>
<text x="589" y="240.5" font-size="30" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">다른 칠기</text>
<text x="589" y="303" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">칼집 · 활</text>
<text x="589" y="344.2" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">잔 · 부채</text>
<text x="589" y="385.4" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">붓과 함께 널무덤에서 출토</text>
<rect x="1070" y="200" width="470" height="224" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="1070.5" y="200.5" width="469" height="58" fill="#ccf6ff"/>
<text x="1094" y="240.5" font-size="30" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">한(漢)의 물건</text>
<text x="1094" y="303" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">성운경(거울)</text>
<text x="1094" y="344.2" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">오수전(동전)</text>
<text x="1094" y="385.4" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">→ 서기전 1세기 후반으로 연대 추정</text>
<rect x="60" y="500" width="700" height="290" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="60.5" y="500.5" width="699" height="58" fill="#ccf6ff"/>
<text x="84" y="540.5" font-size="30" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">무덤을 만든 사람들</text>
<text x="84" y="603" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">철기 · 칠기를 갖춘 세력</text>
<text x="84" y="644.2" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">철 생산을 바탕으로</text>
<text x="84" y="685.4000000000001" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">한 · 낙랑과 활발히 교역</text>
<line x1="764" y1="645" x2="836" y2="645" stroke="#0096b8" stroke-width="2" marker-end="url(#ah)"/>
<rect x="840" y="500" width="700" height="290" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="840.5" y="500.5" width="699" height="58" fill="#ccf6ff"/>
<text x="864" y="540.5" font-size="30" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">붓이 알려 주는 것</text>
<text x="864" y="603" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">교역 때 영수증 같은 기록을 적었을 것</text>
<text x="864" y="644.2" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">남부 지역에서도 한자로 기록했을</text>
<text x="864" y="685.4000000000001" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">가능성을 보여 줌</text>
<text x="60" y="880" font-size="27" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">유적: 널무덤 · 독무덤 무덤군 — 1988~1991년 국립중앙박물관이 여섯 차례 발굴</text>
</svg>
