<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 1000" role="img">
<title>『제시의 일기』</title>
<desc>1938년 7월 4일 제시 탄생, 1938~1940년 임시 정부의 피란 이동, 1940년 충칭 정착, 1945년 광복, 1946년 4월 29일 부산 귀국, 1998년 책 간행을 잇는 연표와 지은이·내용·의미를 정리한 카드로 된 정리 그림.</desc>
<rect width="1600" height="1000" fill="#effbff"/>
<text x="60" y="92" font-size="48" fill="#2a2c2d" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">『제시의 일기』</text>
<text x="60" y="140" font-size="28" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">임시 정부를 따라 옮겨 다닌 한 가족의 8년</text>
<text x="1540" y="92" font-size="28" fill="#0096b8" text-anchor="end" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">정리 그림</text>
<line x1="60" y1="166" x2="1540" y2="166" stroke="#00d0ff" stroke-width="1"/>
<rect x="60" y="190" width="1480" height="270" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<line x1="100" y1="290" x2="1500" y2="290" stroke="#00d0ff" stroke-width="1.2"/>
<circle cx="240" cy="290" r="12" fill="#ccf6ff" stroke="#0096b8" stroke-width="2"/>
<text x="240" y="262" font-size="27" fill="#0096b8" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">1938. 7. 4.</text>
<text x="240" y="340" font-size="25" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">첫딸 제시 태어남</text>
<text x="240" y="376" font-size="25" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">일기를 쓰기 시작</text>
<circle cx="520" cy="290" r="8" fill="#ffffff" stroke="#5d6365" stroke-width="2"/>
<text x="520" y="262" font-size="27" fill="#5d6365" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">1938~1940</text>
<text x="520" y="340" font-size="25" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">임시 정부 따라</text>
<text x="520" y="376" font-size="25" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">중국 곳곳 피란</text>
<circle cx="800" cy="290" r="8" fill="#ffffff" stroke="#5d6365" stroke-width="2"/>
<text x="800" y="262" font-size="27" fill="#5d6365" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">1940년</text>
<text x="800" y="340" font-size="25" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">임시 정부</text>
<text x="800" y="376" font-size="25" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">충칭에 자리 잡음</text>
<circle cx="1080" cy="290" r="12" fill="#ccf6ff" stroke="#0096b8" stroke-width="2"/>
<text x="1080" y="262" font-size="27" fill="#0096b8" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">1946. 4. 29.</text>
<text x="1080" y="340" font-size="25" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">부산항으로 귀국</text>
<text x="1080" y="376" font-size="25" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">일기 마침</text>
<circle cx="1360" cy="290" r="8" fill="#ffffff" stroke="#5d6365" stroke-width="2"/>
<text x="1360" y="262" font-size="27" fill="#5d6365" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">1998년</text>
<text x="1360" y="340" font-size="25" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">손녀가 정리해</text>
<text x="1360" y="376" font-size="25" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">책으로 펴냄</text>
<rect x="60" y="490" width="473" height="450" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="60.5" y="490.5" width="472" height="62" fill="#ccf6ff"/>
<text x="86" y="533" font-size="31" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">누가 썼나</text>
<text x="90" y="620" font-size="30" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">양우조·최선화 부부</text>
<text x="90" y="692" font-size="30" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">양우조: 임시 정부·</text>
<text x="90" y="746" font-size="30" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">한국 독립당·광복군</text>
<text x="90" y="800" font-size="30" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">최선화: 한국 혁명</text>
<text x="90" y="854" font-size="30" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">여성 동맹 결성</text>
<rect x="563" y="490" width="473" height="450" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="563.5" y="490.5" width="472" height="62" fill="#ccf6ff"/>
<text x="589" y="533" font-size="31" fill="#0096b8" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">무엇이 담겼나</text>
<text x="593" y="620" font-size="30" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">딸 제시가 자라는 모습</text>
<text x="593" y="692" font-size="30" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">피란길의 가족 생활</text>
<text x="593" y="746" font-size="30" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">임시 정부 사람들의</text>
<text x="593" y="800" font-size="30" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">하루하루</text>
<rect x="1066" y="490" width="473" height="450" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="1066.5" y="490.5" width="472" height="62" fill="#ccf6ff"/>
<text x="1092" y="533" font-size="31" fill="#7a62d6" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">무엇을 보여 주나</text>
<text x="1096" y="620" font-size="30" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">육아 일기이면서</text>
<text x="1302" y="674" font-size="30" fill="#0096b8" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">↓</text>
<text x="1096" y="728" font-size="30" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">임시 정부의 이동과</text>
<text x="1096" y="782" font-size="30" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">독립운동가의 생활을</text>
<text x="1096" y="836" font-size="30" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">보여 주는 기록</text>
</svg>