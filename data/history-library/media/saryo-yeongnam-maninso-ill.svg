<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 1000" role="img">
<title>영남 만인소(1881)</title>
<desc>『조선책략』 반입부터 영남 만인소까지의 흐름과, 상소가 일본·미국·러시아에 관한 주장을 반박한 요지를 정리한 그림.</desc>
<defs><marker id="ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="5.5" markerHeight="5.5" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M1 1.5 L11 6 L1 10.5 L3.6 6 z" fill="#0096b8"/></marker></defs>
<rect width="1600" height="1000" fill="#effbff"/>
<text x="60" y="92" font-size="48" fill="#2a2c2d" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">영남 만인소(1881)</text>
<text x="60" y="140" font-size="28" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">『조선책략』에 맞선 영남 유생 1만여 명의 연명 상소</text>
<text x="1540" y="92" font-size="28" fill="#0096b8" text-anchor="end" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">정리 그림</text>
<line x1="60" y1="166" x2="1540" y2="166" stroke="#00d0ff" stroke-width="1"/>
<rect x="60" y="205" width="760" height="82" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<text x="90" y="256" font-size="29" fill="#7a62d6" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">1880년 2차 수신사 김홍집</text>
<line x1="440.0" y1="289" x2="440.0" y2="323" stroke="#0096b8" stroke-width="2" marker-end="url(#ah)"/>
<rect x="60" y="327" width="760" height="82" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<text x="90" y="378" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">황준헌의 『조선책략』을 들여옴</text>
<line x1="440.0" y1="411" x2="440.0" y2="445" stroke="#0096b8" stroke-width="2" marker-end="url(#ah)"/>
<rect x="60" y="449" width="760" height="82" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<text x="90" y="500" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">정부, 미국과의 수교 추진</text>
<line x1="440.0" y1="533" x2="440.0" y2="567" stroke="#0096b8" stroke-width="2" marker-end="url(#ah)"/>
<rect x="60" y="571" width="760" height="82" fill="#ccf6ff" stroke="#0096b8" stroke-width="1.5"/>
<text x="90" y="622" font-size="29" fill="#0096b8" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">1881년 이만손 등 영남 유생 만인소</text>
<line x1="440.0" y1="655" x2="440.0" y2="689" stroke="#0096b8" stroke-width="2" marker-end="url(#ah)"/>
<rect x="60" y="693" width="760" height="82" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<text x="90" y="744" font-size="29" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">개화와 척사의 갈등이 깊어짐</text>
<rect x="880" y="205" width="660" height="202" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="880.5" y="205.5" width="659" height="58" fill="#ccf6ff"/>
<text x="904" y="245" font-size="29" fill="#7a62d6" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">『조선책략』의 처방</text>
<text x="910" y="321.0" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">러시아를 막으려면(방아)</text>
<text x="910" y="373.0" font-size="27" fill="#0096b8" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">친중국 · 결일본 · 연미국</text>
<line x1="1210" y1="411" x2="1210" y2="451" stroke="#0096b8" stroke-width="2" marker-end="url(#ah)"/>
<rect x="880" y="455" width="660" height="386" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="880.5" y="455.5" width="659" height="58" fill="#ccf6ff"/>
<text x="904" y="495" font-size="29" fill="#7a62d6" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">만인소의 반박</text>
<text x="910" y="567.0" font-size="27" fill="#0096b8" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">일본</text>
<text x="910" y="615.0" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">간교하니 손잡으면 위험하다</text>
<text x="910" y="663.0" font-size="27" fill="#0096b8" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">미국</text>
<text x="910" y="711.0" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">모르는 나라라 끌어들이면 화를 부른다</text>
<text x="910" y="759.0" font-size="27" fill="#0096b8" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">러시아</text>
<text x="910" y="807.0" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">괜히 건드리면 침범을 부른다</text>
<text x="880" y="960" font-size="26" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">위정척사 운동: 서양 종교를 사교로 배척</text>
</svg>