<text x="60" y="782" font-size="29" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">의정부 서사제</text>
<rect x="60" y="810" width="200" height="70" fill="#ffffff" stroke="#0096b8" stroke-width="1.5"/><text x="160.0" y="856" font-size="29" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">6조</text>
<line x1="264" y1="845" x2="336" y2="845" stroke="#0096b8" stroke-width="2" marker-end="url(#ah)"/>
<rect x="340" y="810" width="240" height="70" fill="#ffffff" stroke="#0096b8" stroke-width="1.5"/><text x="460.0" y="856" font-size="29" fill="#2a2c2d" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">의정부</text>
<line x1="584" y1="845" x2="656" y2="845" stroke="#0096b8" stroke-width="2" marker-end="url(#ah)"/>
<rect x="660" y="810" width="200" height="70" fill="#ccf6ff" stroke="#0096b8" stroke-width="1.5"/><text x="760.0" y="856" font-size="29" fill="#0096b8" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">왕</text>
</svg>