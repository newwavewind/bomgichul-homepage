<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 1000" role="img">
<title>덕수궁 돈덕전</title>
<desc>경운궁이 정궁이 된 1897년부터 돈덕전 건립, 1907년 순종 즉위, 1920년대 철거까지 연표로 잇고 쓰임새와 경운궁의 서양식 건물을 정리한 그림.</desc>
<defs><marker id="ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="5.5" markerHeight="5.5" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M1 1.5 L11 6 L1 10.5 L3.6 6 z" fill="#0096b8"/></marker></defs>
<rect width="1600" height="1000" fill="#effbff"/>
<text x="60" y="92" font-size="48" fill="#2a2c2d" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">덕수궁 돈덕전</text>
<text x="60" y="140" font-size="28" fill="#5d6365" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">대한 제국 경운궁에 세운 서양식 영빈관의 내력</text>
<text x="1540" y="92" font-size="28" fill="#0096b8" text-anchor="end" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">정리 그림</text>
<line x1="60" y1="166" x2="1540" y2="166" stroke="#00d0ff" stroke-width="1"/>
<rect x="60.0" y="205" width="352.0" height="70" fill="#ccf6ff" stroke="#0096b8" stroke-width="1.5"/>
<text x="236.0" y="251" font-size="30" fill="#0096b8" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">1897</text>
<rect x="60.0" y="295" width="352.0" height="220" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="60.5" y="295.5" width="351.0" height="57" fill="#ccf6ff"/>
<text x="84.0" y="335" font-size="29" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">경운궁 시대</text>
<text x="88.0" y="400" font-size="25" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">고종이 경운궁으로</text>
<text x="88.0" y="444" font-size="25" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">옮긴 뒤 대한 제국의</text>
<text x="88.0" y="488" font-size="25" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">정궁이 됨</text>
<line x1="414.0" y1="240" x2="434.0" y2="240" stroke="#0096b8" stroke-width="3" marker-end="url(#ah)"/>
<rect x="436.0" y="205" width="352.0" height="70" fill="#ccf6ff" stroke="#0096b8" stroke-width="1.5"/>
<text x="612.0" y="251" font-size="30" fill="#7a62d6" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">1902 무렵</text>
<rect x="436.0" y="295" width="352.0" height="220" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="436.5" y="295.5" width="351.0" height="57" fill="#ccf6ff"/>
<text x="460.0" y="335" font-size="29" fill="#7a62d6" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">돈덕전 건립</text>
<text x="464.0" y="400" font-size="25" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">고종 즉위 40주년</text>
<text x="464.0" y="444" font-size="25" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">기념 행사를 위해</text>
<text x="464.0" y="488" font-size="25" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">서양식으로 지음</text>
<line x1="790.0" y1="240" x2="810.0" y2="240" stroke="#0096b8" stroke-width="3" marker-end="url(#ah)"/>
<rect x="812.0" y="205" width="352.0" height="70" fill="#ccf6ff" stroke="#0096b8" stroke-width="1.5"/>
<text x="988.0" y="251" font-size="30" fill="#0096b8" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">1907. 8.</text>
<rect x="812.0" y="295" width="352.0" height="220" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="812.5" y="295.5" width="351.0" height="57" fill="#ccf6ff"/>
<text x="836.0" y="335" font-size="29" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">순종 즉위</text>
<text x="840.0" y="400" font-size="25" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">고종이 강제로</text>
<text x="840.0" y="444" font-size="25" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">물러난 뒤 순종이</text>
<text x="840.0" y="488" font-size="25" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">돈덕전에서 즉위</text>
<line x1="1166.0" y1="240" x2="1186.0" y2="240" stroke="#0096b8" stroke-width="3" marker-end="url(#ah)"/>
<rect x="1188.0" y="205" width="352.0" height="70" fill="#ccf6ff" stroke="#0096b8" stroke-width="1.5"/>
<text x="1364.0" y="251" font-size="30" fill="#7a62d6" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">1920년대</text>
<rect x="1188.0" y="295" width="352.0" height="220" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="1188.5" y="295.5" width="351.0" height="57" fill="#ccf6ff"/>
<text x="1212.0" y="335" font-size="29" fill="#7a62d6" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">헐림</text>
<text x="1216.0" y="400" font-size="25" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">일제가 덕수궁을</text>
<text x="1216.0" y="444" font-size="25" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">공원으로 바꾸며</text>
<text x="1216.0" y="488" font-size="25" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">건물을 헐어 냄</text>
<rect x="60" y="560" width="700" height="190" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="60.5" y="560.5" width="699" height="57" fill="#ccf6ff"/>
<text x="84" y="600" font-size="29" fill="#0096b8" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">쓰임새</text>
<text x="88" y="665" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">· 외국 사절을 맞는 영빈관</text>
<text x="88" y="711" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">· 황제를 뵙는 알현 장소 · 연회장</text>
<rect x="840" y="560" width="700" height="190" fill="#ffffff" stroke="#00d0ff" stroke-width="1"/>
<rect x="840.5" y="560.5" width="699" height="57" fill="#ccf6ff"/>
<text x="864" y="600" font-size="29" fill="#7a62d6" text-anchor="start" font-family="'Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif" font-weight="700">경운궁의 서양식 건물들</text>
<text x="868" y="665" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">· 정관헌 · 중명전 · 석조전</text>
<text x="868" y="711" font-size="27" fill="#2a2c2d" text-anchor="start" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">· 그리고 돈덕전</text>
<rect x="60" y="800" width="1480" height="80" fill="#ccf6ff" stroke="#0096b8" stroke-width="1.5"/>
<text x="800.0" y="850.08" font-size="28" fill="#0096b8" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-weight="700">고종이 머물며 궁 이름이 덕수궁으로 바뀜 (2023년 다시 지어 공개)</text>
</svg>
