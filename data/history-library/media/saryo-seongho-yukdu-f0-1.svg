<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">
<title>이익 성호사설 육두 — 나라를 좀먹는 여섯 가지</title>
<rect width="960" height="580" fill="#ffffff"/>
<text x="480.0" y="52" text-anchor="middle" font-size="30" font-weight="700" fill="#1b2a4a">이익의 「육두(六蠹)」 — 나라를 좀먹는 여섯 가지</text>
<text x="480.0" y="84" text-anchor="middle" font-size="17" font-weight="400" fill="#5b6475">『성호사설』 권12 인사문 · 조선 후기 실학자 성호 이익</text>
<rect x="40" y="112" width="200" height="56" rx="10" fill="#e3f5fd" stroke="#0096d6" stroke-width="2"/>
<text x="140" y="147" text-anchor="middle" font-size="17" font-weight="700" fill="#1b2a4a">농사에 힘쓰지 않음</text>
<line x1="242" y1="140" x2="266" y2="140" stroke="#0096d6" stroke-width="3" stroke-linecap="round"/>
<path d="M255.2 145.2 L266 140 L255.2 134.8" fill="none" stroke="#0096d6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="270" y="112" width="200" height="56" rx="10" fill="#ffffff" stroke="#0096d6" stroke-width="2"/>
<text x="370" y="147" text-anchor="middle" font-size="17" font-weight="400" fill="#1b2a4a">재물이 모자람</text>
<line x1="472" y1="140" x2="486" y2="140" stroke="#0096d6" stroke-width="3" stroke-linecap="round"/>
<path d="M475.2 145.2 L486 140 L475.2 134.8" fill="none" stroke="#0096d6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="490" y="112" width="200" height="56" rx="10" fill="#ffffff" stroke="#0096d6" stroke-width="2"/>
<text x="590" y="147" text-anchor="middle" font-size="17" font-weight="400" fill="#1b2a4a">간사함이 생김</text>
<line x1="692" y1="140" x2="706" y2="140" stroke="#0096d6" stroke-width="3" stroke-linecap="round"/>
<path d="M695.2 145.2 L706 140 L695.2 134.8" fill="none" stroke="#0096d6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="710" y="112" width="200" height="56" rx="10" fill="#ffffff" stroke="#0096d6" stroke-width="2"/>
<text x="810" y="147" text-anchor="middle" font-size="17" font-weight="400" fill="#1b2a4a">나라가 다스려지지 않음</text>
<text x="480" y="210" text-anchor="middle" font-size="21" font-weight="700" fill="#0096d6">농사를 해치는 여섯 가지 좀(蠹)</text>
<rect x="60" y="232" width="260" height="92" rx="10" fill="#ffffff" stroke="#0096d6" stroke-width="2"/>
<text x="190" y="272" text-anchor="middle" font-size="24" font-weight="700" fill="#1b2a4a">① 노비</text>
<text x="190" y="304" text-anchor="middle" font-size="16" font-weight="400" fill="#5b6475">奴婢</text>
<rect x="350" y="232" width="260" height="92" rx="10" fill="#ffffff" stroke="#0096d6" stroke-width="2"/>
<text x="480" y="272" text-anchor="middle" font-size="24" font-weight="700" fill="#1b2a4a">② 과업</text>
<text x="480" y="304" text-anchor="middle" font-size="16" font-weight="400" fill="#5b6475">科業 · 과거 공부</text>
<rect x="640" y="232" width="260" height="92" rx="10" fill="#ffffff" stroke="#0096d6" stroke-width="2"/>
<text x="770" y="272" text-anchor="middle" font-size="24" font-weight="700" fill="#1b2a4a">③ 벌열</text>
<text x="770" y="304" text-anchor="middle" font-size="16" font-weight="400" fill="#5b6475">閥閱 · 대대로 높은 벼슬 집안</text>
<rect x="60" y="342" width="260" height="92" rx="10" fill="#ffffff" stroke="#0096d6" stroke-width="2"/>
<text x="190" y="382" text-anchor="middle" font-size="24" font-weight="700" fill="#1b2a4a">④ 기교</text>
<text x="190" y="414" text-anchor="middle" font-size="16" font-weight="400" fill="#5b6475">技巧 · 공교한 재주</text>
<rect x="350" y="342" width="260" height="92" rx="10" fill="#ffffff" stroke="#0096d6" stroke-width="2"/>
<text x="480" y="382" text-anchor="middle" font-size="24" font-weight="700" fill="#1b2a4a">⑤ 승니</text>
<text x="480" y="414" text-anchor="middle" font-size="16" font-weight="400" fill="#5b6475">僧尼 · 승려</text>
<rect x="640" y="342" width="260" height="92" rx="10" fill="#ffffff" stroke="#0096d6" stroke-width="2"/>
<text x="770" y="382" text-anchor="middle" font-size="24" font-weight="700" fill="#1b2a4a">⑥ 유타</text>
<text x="770" y="414" text-anchor="middle" font-size="16" font-weight="400" fill="#5b6475">遊惰 · 놀고 게으른 무리</text>
<text x="480" y="478" text-anchor="middle" font-size="17" font-weight="400" fill="#1b2a4a">장사(逐末)는 여기에 넣지 않았다 — 과거 공부에만 매달리는 선비도 좀으로 꼽음</text>
<rect x="60" y="500" width="840" height="56" rx="10" fill="#e3f5fd" stroke="#e3f5fd" stroke-width="0"/>
<text x="480" y="535" text-anchor="middle" font-size="17" font-weight="400" fill="#1b2a4a">함께 볼 주장: 『곽우록』의 한전론 — 집마다 꼭 필요한 땅(영업전)은 사고팔지 못하게 하자</text>
</svg>
