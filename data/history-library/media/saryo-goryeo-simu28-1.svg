<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">
<title>최승로 시무 28조의 불교·유교 역할 나누기</title>
<rect width="960" height="560" fill="#ffffff"/>
<text x="480.0" y="52" text-anchor="middle" font-size="30" font-weight="700" fill="#1b2a4a">최승로의 시무 28조 (982) — 불교와 유교의 자리</text>
<text x="480.0" y="84" text-anchor="middle" font-size="17" font-weight="400" fill="#5b6475">『고려사』 열전 최승로 · 최승로가 성종에게 올린 개혁안</text>
<rect x="60" y="116" width="400" height="250" rx="10" fill="#ffffff" stroke="#0096d6" stroke-width="2"/>
<rect x="61" y="117" width="398" height="56" rx="9" fill="#e3f5fd"/>
<text x="260" y="154" text-anchor="middle" font-size="24" font-weight="700" fill="#0096d6">불교 (釋敎)</text>
<text x="260" y="214" text-anchor="middle" font-size="20" font-weight="400" fill="#5b6475">行釋敎者 修身之本</text>
<text x="260" y="260" text-anchor="middle" font-size="22" font-weight="700" fill="#1b2a4a">몸을 닦는(수신) 근본</text>
<text x="260" y="300" text-anchor="middle" font-size="19" font-weight="400" fill="#1b2a4a">수신은 내생(來生)의 밑천</text>
<text x="260" y="340" text-anchor="middle" font-size="18" font-weight="400" fill="#5b6475">→ 다음 생을 위한 개인의 일</text>
<rect x="500" y="116" width="400" height="250" rx="10" fill="#ffffff" stroke="#0096d6" stroke-width="2"/>
<rect x="501" y="117" width="398" height="56" rx="9" fill="#e3f5fd"/>
<text x="700" y="154" text-anchor="middle" font-size="24" font-weight="700" fill="#0096d6">유교 (儒敎)</text>
<text x="700" y="214" text-anchor="middle" font-size="20" font-weight="400" fill="#5b6475">行儒敎者 理國之源</text>
<text x="700" y="260" text-anchor="middle" font-size="22" font-weight="700" fill="#1b2a4a">나라를 다스리는(이국) 근원</text>
<text x="700" y="300" text-anchor="middle" font-size="19" font-weight="400" fill="#1b2a4a">이국은 금일(今日)의 일</text>
<text x="700" y="340" text-anchor="middle" font-size="18" font-weight="400" fill="#5b6475">→ 지금 힘써야 할 나라의 일</text>
<text x="480" y="250" text-anchor="middle" font-size="30" font-weight="700" fill="#0096d6">↔</text>
<line x1="480" y1="380" x2="480" y2="414" stroke="#0096d6" stroke-width="3" stroke-linecap="round"/>
<path d="M474.8 403.2 L480 414 L485.2 403.2" fill="none" stroke="#0096d6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="60" y="420" width="840" height="110" rx="10" fill="#e3f5fd" stroke="#0096d6" stroke-width="2"/>
<text x="480" y="458" text-anchor="middle" font-size="22" font-weight="700" fill="#1b2a4a">성종이 받아들여 유교 중심의 통치 체제를 다듬음</text>
<text x="480" y="496" text-anchor="middle" font-size="19" font-weight="400" fill="#1b2a4a">불교 행사를 줄이고 · 12목을 두어 지방관을 보냄</text>
</svg>
